<!doctype html>
<html lang="zh-CN" data-fs="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b4a6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2026三基题库</title>
<style>
  :root{
    --brand:#2b4a6f; --brand-2:#3c6896;
    --bg:#f4f6f8; --card:#ffffff; --card-2:#fafbfc;
    --ink:#1c2733; --ink-2:#5a6b7d; --ink-3:#8b9aab;
    --line:#e2e7ed; --line-2:#eef1f5;
    --ok:#2e7d57; --ok-bg:#e9f4ee; --ok-line:#bfe0cf;
    --bad:#b3413c; --bad-bg:#fbedec; --bad-line:#efc8c5;
    --shadow:0 1px 2px rgba(16,32,48,.05), 0 6px 18px rgba(16,32,48,.05);
    --radius:16px;
    --fs:18px;
  }
  html[data-fs="0"]{--fs:16px}
  html[data-fs="1"]{--fs:18px}
  html[data-fs="2"]{--fs:20px}
  @media (prefers-color-scheme: dark){
    :root{
      --brand:#8fb3d9; --brand-2:#a9c6e6;
      --bg:#0f1419; --card:#171d25; --card-2:#1c232c;
      --ink:#e6ecf3; --ink-2:#9aa9ba; --ink-3:#6f7f90;
      --line:#28323d; --line-2:#212a34;
      --ok:#66c295; --ok-bg:#16281f; --ok-line:#2b4a38;
      --bad:#e58882; --bad-bg:#2a1a19; --bad-line:#4d2b29;
      --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:var(--fs)/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px}
  a{color:inherit; text-decoration:none}
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
  h1,h2,h3,p{margin:0}
  .muted{color:var(--ink-2)}
  .tiny{font-size:.8em; color:var(--ink-3)}

  /* ---------- 通用块 ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .pad{padding:16px}
  .row{display:flex; align-items:center; gap:10px}
  .between{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .grow{flex:1; min-width:0}

  /* ---------- 顶部 ---------- */
  .top{padding:26px 0 12px}
  .top h1{font-size:1.5em; letter-spacing:.5px; font-weight:650}
  .top .sub{margin-top:4px; font-size:.85em; color:var(--ink-2)}

  .bar{height:8px; border-radius:99px; background:var(--line-2); overflow:hidden}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:99px; transition:width .25s ease}
  .bar.ok>i{background:var(--ok)}
  .bar.bad>i{background:var(--bad)}

  /* ---------- 科目卡 ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0}
  .scard{padding:14px; text-align:left; transition:transform .12s ease, border-color .12s}
  .scard:active{transform:scale(.985)}
  .scard .nm{font-weight:600; font-size:1.02em}
  .scard .n{margin-top:2px; font-size:.78em; color:var(--ink-3)}
  .scard .st{margin-top:10px; display:flex; align-items:baseline; gap:6px; font-size:.78em; color:var(--ink-2)}
  .scard .st b{font-size:1.05em; color:var(--ink); font-weight:600}
  .dot{display:inline-block; width:6px; height:6px; border-radius:99px; background:var(--bad); margin-right:4px; vertical-align:1px}

  /* ---------- 底部操作区 ---------- */
  .bottom{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  .bottom .wrap{display:flex; gap:10px; padding:0}
  .btn{
    flex:1; min-height:50px; border-radius:14px; font-weight:600; font-size:1em;
    background:var(--card); border:1px solid var(--line); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .1s ease, background .15s, opacity .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#0f1419} }
  .btn.ghost{background:transparent}
  .btn[disabled]{opacity:.42; pointer-events:none}
  .btn.sm{min-height:38px; flex:none; padding:0 14px; font-size:.86em; border-radius:11px}
  .btn.danger{color:var(--bad); border-color:var(--bad-line); background:transparent}
  .btn.danger:active{background:var(--bad-bg)}

  /* ---------- 答题 ---------- */
  .qhead{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0 8px}
  .qhead .back{font-size:.9em; color:var(--ink-2); padding:6px 2px}
  .qhead .pos{font-size:.8em; color:var(--ink-3); font-variant-numeric:tabular-nums}
  .tag{
    display:inline-block; padding:2px 8px; border-radius:7px; font-size:.72em; font-weight:600;
    background:var(--line-2); color:var(--ink-2); vertical-align:2px;
  }
  .qcard{padding:18px 16px; animation:fade .12s ease}
  @keyframes fade{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
  .stem{font-size:1.04em; line-height:1.7; white-space:pre-wrap; word-break:break-word}

  .opts{margin:14px 0 6px; display:flex; flex-direction:column; gap:10px}
  .opt{
    display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
    padding:13px 14px; border-radius:13px; border:1.5px solid var(--line);
    background:var(--card-2); transition:border-color .12s, background .12s, transform .1s;
  }
  .opt:active{transform:scale(.995)}
  .opt .k{
    flex:none; width:26px; height:26px; border-radius:99px; display:grid; place-items:center;
    font-size:.8em; font-weight:700; background:var(--card); border:1.5px solid var(--line);
    color:var(--ink-2); margin-top:1px;
  }
  .opt .t{flex:1; word-break:break-word}
  .opt.sel{border-color:var(--brand); background:color-mix(in srgb,var(--brand) 8%, var(--card))}
  .opt.sel .k{background:var(--brand); border-color:var(--brand); color:#fff}
  .opt.ok{border-color:var(--ok-line); background:var(--ok-bg)}
  .opt.ok .k{background:var(--ok); border-color:var(--ok); color:#fff}
  .opt.bad{border-color:var(--bad-line); background:var(--bad-bg)}
  .opt.bad .k{background:var(--bad); border-color:var(--bad); color:#fff}
  .opt.lock{pointer-events:none}
  .opt.big{padding:20px 14px; justify-content:center; font-weight:600}
  .opt.big .k{display:none}

  .fb{margin-top:14px; padding:13px 14px; border-radius:13px; border:1px solid; animation:fade .12s ease}
  .fb.ok{background:var(--ok-bg); border-color:var(--ok-line)}
  .fb.bad{background:var(--bad-bg); border-color:var(--bad-line)}
  .fb .hd{font-weight:700; display:flex; align-items:center; gap:8px}
  .fb.ok .hd{color:var(--ok)} .fb.bad .hd{color:var(--bad)}
  .fb .bd{margin-top:6px; font-size:.92em; color:var(--ink); line-height:1.65}
  .fb .bd b{color:var(--ink)}

  /* ---------- 题号面板 ---------- */
  .sheet{
    position:fixed; inset:0; z-index:40; background:rgba(10,16,24,.42);
    display:flex; align-items:flex-end; animation:fade .15s ease;
  }
  .sheet .panel{
    width:100%; max-height:68vh; overflow:auto; background:var(--card);
    border-radius:20px 20px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    animation:up .18s ease;
  }
  @keyframes up{from{transform:translateY(14px); opacity:.6} to{transform:none; opacity:1}}
  .sheet h3{font-size:.95em; margin-bottom:12px}
  .nums{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:8px}
  .num{
    aspect-ratio:1; border-radius:10px; background:var(--card-2); border:1px solid var(--line);
    font-size:.85em; font-variant-numeric:tabular-nums; color:var(--ink-2);
    display:grid; place-items:center;
  }
  .num.ok{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok)}
  .num.bad{background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad)}
  .num.cur{outline:2px solid var(--brand); color:var(--brand); font-weight:700}

  /* ---------- 列表 / 设置 ---------- */
  .list{padding:4px 0; margin:12px 0}
  .item{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2)}
  .item:last-child{border-bottom:0}
  .item .ttl{font-weight:600}
  .item .desc{font-size:.8em; color:var(--ink-3); margin-top:2px}
  .seg{display:flex; gap:6px; background:var(--line-2); padding:4px; border-radius:12px}
  .seg button{flex:1; padding:10px 8px; border-radius:9px; font-size:.9em; color:var(--ink-2)}
  .seg button.on{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .spacer{height:14px}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-3)}
  .empty .big{font-size:2em; margin-bottom:8px; opacity:.5}
  .note{font-size:.82em; color:var(--ink-3); line-height:1.7}
</style>
</head>

\nC研究者\nD.伦理委员会\n答案：A"},{"id":"lunli-a1-007","subject":"伦理","section":"伦理知识","type":"a1","no":"7","stem":"保护试验参与者权益和安全最重要两项核心措施是(  )","options":[{"key":"A","text":"监查＋稽查"},{"key":"B","text":"伦理审查＋知情同意"},{"key":"C","text":"保险＋补偿"},{"key":"D","text":"机构质控＋SAE上报"}],"answer":["B"],"raw":"7、保护试验参与者权益和安全最重要两项核心措施是(  )\nA.监查＋稽查\nB.伦理审查＋知情同意\nC.保险＋补偿\nD.机构质控＋SAE上报\n答案：B"},{"id":"lunli-a1-008","subject":"伦理","section":"伦理知识","type":"a1","no":"8","stem":"主要研究者获知严重不良事件SAE 后，除方案另有约定外，应当(  ) 内向申办者与伦理审查委员会书面报告","options":[{"key":"A","text":"24小时"},{"key":"B","text":"立即"},{"key":"C","text":"3个工作日"},{"key":"D","text":"7个工作日"}],"answer":["A"],"raw":"8、主要研究者获知严重不良事件SAE 后，除方案另有约定外，应当(  ) 内向申办者与伦理审查委员会书面报告\nA.24小时\nB.立即\nC.3个工作日\nD.7个工作日\n答案：A"},{"id":"lunli-a1-009","subject":"伦理","section":"伦理知识","type":"a1","no":"9","stem":"PI下列哪项工作，按2026版GCP原则上不可以授权给CRC或Subl(  )","options":[{"key":"A","text":"CRF录入辅助"},{"key":"B","text":"试验物资整理"},{"key":"C","text":"受试者随访预约"},{"key":"D","text":"向伦理委员会提交SAE正式书面报告"}],"answer":["D"],"raw":"9、PI下列哪项工作，按2026版GCP原则上不可以授权给CRC或Subl(  )\nA.CRF录入辅助\nB.试验物资整理\nC.受试者随访预约\nD.向伦理委员会提交SAE正式书面报告\n答案：D"},{"id":"lunli-a1-010","subject":"伦理","section":"伦理知识","type":"a1","no":"10","stem":"伦理委员会组成，必须包含以下哪一类独立人员保障公正性(  )","options":[{"key":"A","text":"申办方研发人员"},{"key":"B","text":"无医学专业背景的独立委员"},{"key":"C","text":"CRO监查员"},{"key":"D","text":"机构项目负责人"}],"answer":["B"],"raw":"10、伦理委员会组成，必须包含以下哪一类独立人员保障公正性(  )\nA.申办方研发人员\nB.无医学专业背景的独立委员\nC.CRO监查员\nD.机构项目负责人\n答案：B"},{"id":"lunli-a1-011","subject":"伦理","section":"伦理知识","type":"a1","no":"11","stem":"发生方案偏离，研究者正确做法是( )","options":[{"key":"A","text":"口头告知申办者，无需书面记录"},{"key":"B","text":"予以记录，重要方案偏离进行解释，采取纠正预防措施，报告申办者与伦理委员会"},{"key":"C","text":"仅在试验总结报告简单提及"},{"key":"D","text":"仅CRC记录即可，研究者不用复核"}],"answer":["B"],"raw":"11、发生方案偏离，研究者正确做法是( )\nA.口头告知申办者，无需书面记录\nB.予以记录，重要方案偏离进行解释，采取纠正预防措施，报告申办者与伦理委员会\nC.仅在试验总结报告简单提及\nD.仅CRC记录即可，研究者不用复核\n答案：B"},{"id":"lunli-a1-012","subject":"伦理","section":"伦理知识","type":"a1","no":"12","stem":"无民事行为能力受试者参加临床试验，知情同意法定签署主体是( )","options":[{"key":"A","text":"受试者本人"},{"key":"B","text":"CRC代签"},{"key":"C","text":"法定代理人"},{"key":"D","text":"监查员代签"}],"answer":["C"],"raw":"12、无民事行为能力受试者参加临床试验，知情同意法定签署主体是( )\nA.受试者本人\nB.CRC代签\nC.法定代理人\nD.监查员代签\n答案：C"},{"id":"lunli-a1-013","subject":"伦理","section":"伦理知识","type":"a1","no":"13","stem":"伦理委员会对正在开展的临床试验，应当定期跟踪审查，至少多久开展一次审查( ）","options":[{"key":"A","text":"6个月"},{"key":"B","text":"12个月"},{"key":"C","text":"18个月"},{"key":"D","text":"24个月"}],"answer":["B"],"raw":"13、伦理委员会对正在开展的临床试验，应当定期跟踪审查，至少多久开展一次审查( ）A.6个月\nB.12个月\nC.18个月\nD.24个月\n答案：B"},{"id":"lunli-a1-014","subject":"伦理","section":"伦理知识","type":"a1","no":"14","stem":"盲法试验中，维持盲态的主体责任在( )","options":[{"key":"A","text":"研究者"},{"key":"B","text":"伦理委员会"},{"key":"C","text":"申办者"},{"key":"D","text":"监查员"}],"answer":["C"],"raw":"14、盲法试验中，维持盲态的主体责任在( )\nA.研究者\nB.伦理委员会\nC.申办者\nD.监查员\n答案：C"},{"id":"lunli-a1-015","subject":"伦理","section":"伦理知识","type":"a1","no":"15","stem":"知情同意书不允许出现的条款(  )","options":[{"key":"A","text":"告知试验风险"},{"key":"B","text":"免除申办者／研究者责任的免责条款"},{"key":"C","text":"告知试验参与者可以随时退出"},{"key":"D","text":"告知隐私保护"}],"answer":["B"],"raw":"15、知情同意书不允许出现的条款(  )\nA.告知试验风险\nB.免除申办者／研究者责任的免责条款\nC.告知试验参与者可以随时退出\nD.告知隐私保护\n答案：B"},{"id":"lunli-x-001","subject":"伦理","section":"伦理知识","type":"x","no":"1","stem":"根据2023年2月国家四部委颁布的《涉及人的生命科学和医学研究伦理审查办法》，涉及人的生命科学和医学研究包括以下哪些内容：（  ）","options":[{"key":"A","text":"采用物理学、化学、生物学、中医药学等方法对人的生殖、生长、发育、衰老等进行研究的活动"},{"key":"B","text":"采用物理学、化学、生物学、中医药学、心理学等方法对人的生理、心理行为、病理现象、疾病病因和发病机制，以及疾病的预防、诊断、治疗和康复等进行研究的活动"},{"key":"C","text":"采用新技术或者新产品在人体上进行试验研究的活动"},{"key":"D","text":"采用流行病学、社会学、心理学等方法收集、记录、使用、报告或者储存有关人的涉及生命科学和医学问题的生物样本、信息数据（包括健康记录、行为等）等科学研究资料的活动"},{"key":"E","text":"采用新技术或者新产品在实验动物上进行试验研究的活动"}],"answer":["A","B","C","D"],"raw":"1、根据2023年2月国家四部委颁布的《涉及人的生命科学和医学研究伦理审查办法》，涉及人的生命科学和医学研究包括以下哪些内容：（  ）\nA.采用物理学、化学、生物学、中医药学等方法对人的生殖、生长、发育、衰老等进行研究的活动\nB.采用物理学、化学、生物学、中医药学、心理学等方法对人的生理、心理行为、病理现象、疾病病因和发病机制，以及疾病的预防、诊断、治疗和康复等进行研究的活动\nC.采用新技术或者新产品在人体上进行试验研究的活动\nD.采用流行病学、社会学、心理学等方法收集、记录、使用、报告或者储存有关人的涉及生命科学和医学问题的生物样本、信息数据（包括健康记录、行为等）等科学研究资料的活动\nE.采用新技术或者新产品在实验动物上进行试验研究的活动\n答案：ABCD"},{"id":"lunli-x-002","subject":"伦理","section":"伦理知识","type":"x","no":"2","stem":"关于伦理审查委员会，以下哪些描述是正确的：（  ）","options":[{"key":"A","text":"机构是伦理审查工作的管理责任主体，应当设立伦理审查委员会，开展涉及人的生命科学和医学研究伦理审查，定期对从事涉及人的生命科学和医学研究的科研人员、学生、科研管理人员等相关人员进行生命伦理教育和培训"},{"key":"B","text":"机构应当采取有效措施、提供资源确保伦理审查委员会工作的独立性"},{"key":"C","text":"伦理审查委员会对涉及人的生命科学和医学研究进行伦理审查，包括初始审查和跟踪审查；受理研究参与者的投诉并协调处理，确保研究不会将研究参与者置于不合理的风险之中；组织开展相关伦理审查培训，提供伦理咨询"},{"key":"D","text":"伦理审查委员会委员、独立顾问及其工作人员应当签署保密协议，承诺对伦理审查工作中获知的敏感信息履行保密义务"},{"key":"E","text":"伦理审查委员会应当接受所在机构的管理和研究参与者的监督"}],"answer":["A","B","C","D","E"],"raw":"2、关于伦理审查委员会，以下哪些描述是正确的：（  ）\nA.机构是伦理审查工作的管理责任主体，应当设立伦理审查委员会，开展涉及人的生命科学和医学研究伦理审查，定期对从事涉及人的生命科学和医学研究的科研人员、学生、科研管理人员等相关人员进行生命伦理教育和培训\nB.机构应当采取有效措施、提供资源确保伦理审查委员会工作的独立性\nC.伦理审查委员会对涉及人的生命科学和医学研究进行伦理审查，包括初始审查和跟踪审查；受理研究参与者的投诉并协调处理，确保研究不会将研究参与者置于不合理的风险之中；组织开展相关伦理审查培训，提供伦理咨询\nD.伦理审查委员会委员、独立顾问及其工作人员应当签署保密协议，承诺对伦理审查工作中获知的敏感信息履行保密义务\nE.伦理审查委员会应当接受所在机构的管理和研究参与者的监督\n答案：ABCDE"},{"id":"lunli-x-003","subject":"伦理","section":"伦理知识","type":"x","no":"3","stem":"做知情同意时应遵循什么原则（  ）","options":[{"key":"A","text":"完全告知"},{"key":"B","text":"充分理解"},{"key":"C","text":"代替签字"},{"key":"D","text":"自愿选择"}],"answer":["A","B","D"],"raw":"3、做知情同意时应遵循什么原则（  ）\nA.完全告知\nB.充分理解\nC.代替签字\nD.自愿选择\n答案：ABD"},{"id":"lunli-x-004","subject":"伦理","section":"伦理知识","type":"x","no":"4","stem":"涉及人的生命科学和医学研究应当符合以下的基本要求，以下哪些是正确的（  ）","options":[{"key":"A","text":"控制风险，研究的科学和社会利益不得超越对研究参与者人身安全与健康权益的考虑，研究风险受益比应当合理，使研究参与者可能受到的风险最小化"},{"key":"B","text":"知情同意，尊重和保障研究参与者或者研究参与者监护人的知情权和参加研究的自主决定权，严格履行知情同意程序，不允许使用欺骗、利诱、胁迫等手段使研究参与者或者研究参与者监护人同意参加研究，允许研究参与者或者研究参与者监护人在任何阶段无条件退出研究"},{"key":"C","text":"公平公正，应当公平、合理地选择研究参与者，入选与排除标准具有明确的科学依据，公平合理分配研究受益、风险和负担；"},{"key":"D","text":"免费和补偿、赔偿，对研究参与者参加研究不得收取任何研究相关的费用，对于研究参与者在研究过程中因参与研究支出的合理费用应当给予适当补偿。研究参与者受到研究相关损害时，应当得到及时、免费的治疗，并依据法律法规及双方约定得到补偿或者赔偿；"},{"key":"E","text":"保护隐私权及个人信息，切实保护研究参与者的隐私权，如实将研究参与者个人信息的收集、储存、使用及保密措施情况告知研究参与者并得到许可，未经研究参与者授权不得将研究参与者个人信息向第三方透露；"},{"key":"F","text":"特殊保护，对涉及儿童、孕产妇、老年人、智力障碍者、精神障碍者等特定群体的研究参与者，应当予以特别保护；对涉及受精卵、胚胎、胎儿或者可能受辅助生殖技术影响的，应当予以特别关注。"}],"answer":["A","B","C","D","E","F"],"raw":"4、涉及人的生命科学和医学研究应当符合以下的基本要求，以下哪些是正确的（  ）\nA.控制风险，研究的科学和社会利益不得超越对研究参与者人身安全与健康权益的考虑，研究风险受益比应当合理，使研究参与者可能受到的风险最小化\nB.知情同意，尊重和保障研究参与者或者研究参与者监护人的知情权和参加研究的自主决定权，严格履行知情同意程序，不允许使用欺骗、利诱、胁迫等手段使研究参与者或者研究参与者监护人同意参加研究，允许研究参与者或者研究参与者监护人在任何阶段无条件退出研究\nC.公平公正，应当公平、合理地选择研究参与者，入选与排除标准具有明确的科学依据，公平合理分配研究受益、风险和负担；\nD.免费和补偿、赔偿，对研究参与者参加研究不得收取任何研究相关的费用，对于研究参与者在研究过程中因参与研究支出的合理费用应当给予适当补偿。研究参与者受到研究相关损害时，应当得到及时、免费的治疗，并依据法律法规及双方约定得到补偿或者赔偿；\nE.保护隐私权及个人信息，切实保护研究参与者的隐私权，如实将研究参与者个人信息的收集、储存、使用及保密措施情况告知研究参与者并得到许可，未经研究参与者授权不得将研究参与者个人信息向第三方透露；\nF.特殊保护，对涉及儿童、孕产妇、老年人、智力障碍者、精神障碍者等特定群体的研究参与者，应当予以特别保护；对涉及受精卵、胚胎、胎儿或者可能受辅助生殖技术影响的，应当予以特别关注。\n答案：ABCDEF"},{"id":"lunli-x-005","subject":"伦理","section":"伦理知识","type":"x","no":"5","stem":"伦理审查委员会收到申请材料后，应当及时受理、组织初始审查，重点审查以下哪些内容：（  ）","options":[{"key":"A","text":"研究是否违反法律法规、规章及有关规定的要求；研究者的资格、经验、技术能力等是否符合研究要求"},{"key":"B","text":"研究方案是否科学、具有社会价值，并符合伦理原则的要求；中医药研究方案的审查，还应当考虑其传统实践经验；研究参与者可能遭受的风险与研究预期的受益相比是否在合理范围之内"},{"key":"C","text":"知情同意书提供的有关信息是否充分、完整、易懂，获得知情同意的过程是否合规、恰当；研究参与者个人信息及相关资料的保密措施是否充分；研究参与者招募方式、途径、纳入和排除标准是否恰当、公平"},{"key":"D","text":"是否向研究参与者明确告知其应当享有的权益，包括在研究过程中可以随时无理由退出且不会因此受到不公正对待的权利，告知退出研究后的影响、其他治疗方法等；研究参与者参加研究的合理支出是否得到了适当补偿；研究参与者参加研究受到损害时，给予的治疗、补偿或者赔偿是否合理、合法"},{"key":"E","text":"是否有具备资格或者经培训后的研究者负责获取知情同意，并随时接受研究有关问题的咨询；对研究参与者在研究中可能承受的风险是否有预防和应对措施；研究是否涉及利益冲突；研究是否涉及社会敏感的伦理问题；研究结果是否发布，方式、时间是否恰当"}],"answer":["A","B","C","D","E"],"raw":"5、伦理审查委员会收到申请材料后，应当及时受理、组织初始审查，重点审查以下哪些内容：（  ）\nA.研究是否违反法律法规、规章及有关规定的要求；研究者的资格、经验、技术能力等是否符合研究要求\nB.研究方案是否科学、具有社会价值，并符合伦理原则的要求；中医药研究方案的审查，还应当考虑其传统实践经验；研究参与者可能遭受的风险与研究预期的受益相比是否在合理范围之内\nC.知情同意书提供的有关信息是否充分、完整、易懂，获得知情同意的过程是否合规、恰当；研究参与者个人信息及相关资料的保密措施是否充分；研究参与者招募方式、途径、纳入和排除标准是否恰当、公平\nD.是否向研究参与者明确告知其应当享有的权益，包括在研究过程中可以随时无理由退出且不会因此受到不公正对待的权利，告知退出研究后的影响、其他治疗方法等；研究参与者参加研究的合理支出是否得到了适当补偿；研究参与者参加研究受到损害时，给予的治疗、补偿或者赔偿是否合理、合法\nE.是否有具备资格或者经培训后的研究者负责获取知情同意，并随时接受研究有关问题的咨询；对研究参与者在研究中可能承受的风险是否有预防和应对措施；研究是否涉及利益冲突；研究是否涉及社会敏感的伦理问题；研究结果是否发布，方式、时间是否恰当\n答案：ABCDE"},{"id":"lunli-x-006","subject":"伦理","section":"伦理知识","type":"x","no":"6","stem":"申请免除知情同意应当满足以下必要充分条件:（  ）","options":[{"key":"A","text":"受试者可能遭受的风险不超过最低限度"},{"key":"B","text":"豁免征得受试者的知情同意并不会对受试者的权益产生负面影响"},{"key":"C","text":"利用可识别身份信息的人体材料或者数据进行研究，已无法找到受试者，且研究项目不涉及个人隐私和商业利益"},{"key":"D","text":"生物样本捐献者已经签署了知情同意书，同意所捐献样本及相关信息可用于所有医学研究"}],"answer":["A","B","C","D"],"raw":"6、申请免除知情同意应当满足以下必要充分条件:（  ）\nA.受试者可能遭受的风险不超过最低限度\nB.豁免征得受试者的知情同意并不会对受试者的权益产生负面影响\nC.利用可识别身份信息的人体材料或者数据进行研究，已无法找到受试者，且研究项目不涉及个人隐私和商业利益\nD.生物样本捐献者已经签署了知情同意书，同意所捐献样本及相关信息可用于所有医学研究\n答案：ABCD"},{"id":"lunli-x-007","subject":"伦理","section":"伦理知识","type":"x","no":"7","stem":"伦理审查委员会批准研究的基本标准，以下哪些是正确的：（  ）","options":[{"key":"A","text":"研究具有科学价值和社会价值，不违反法律法规的规定，不损害公共利益"},{"key":"B","text":"研究参与者权利得到尊重，隐私权和个人信息得到保护"},{"key":"C","text":"研究方案科学；研究参与者的纳入和排除的标准科学而公平"},{"key":"D","text":"风险受益比合理，风险最小化；知情同意规范、有效"},{"key":"E","text":"研究机构和研究者能够胜任；研究结果发布方式、内容、时间合理；研究者遵守科研规范与诚信"}],"answer":["A","B","C","D","E"],"raw":"7、伦理审查委员会批准研究的基本标准，以下哪些是正确的：（  ）\nA.研究具有科学价值和社会价值，不违反法律法规的规定，不损害公共利益\nB.研究参与者权利得到尊重，隐私权和个人信息得到保护\nC.研究方案科学；研究参与者的纳入和排除的标准科学而公平\nD.风险受益比合理，风险最小化；知情同意规范、有效\nE.研究机构和研究者能够胜任；研究结果发布方式、内容、时间合理；研究者遵守科研规范与诚信\n答案：ABCDE"},{"id":"lunli-x-008","subject":"伦理","section":"伦理知识","type":"x","no":"8","stem":"研究过程中发生哪些下列情形时，研究者应当再次获取研究参与者的知情同意：（  ）","options":[{"key":"A","text":"与研究参与者相关的研究内容发生实质性变化的"},{"key":"B","text":"与研究相关的风险实质性提高或者增加的"},{"key":"C","text":"研究参与者民事行为能力等级提高的"},{"key":"D","text":"新增研究单位或研究管理人员"}],"answer":["A","B","C"],"raw":"8、研究过程中发生哪些下列情形时，研究者应当再次获取研究参与者的知情同意：（  ）\nA.与研究参与者相关的研究内容发生实质性变化的\nB.与研究相关的风险实质性提高或者增加的\nC.研究参与者民事行为能力等级提高的\nD.新增研究单位或研究管理人员\n答案：ABC"},{"id":"lunli-x-009","subject":"伦理","section":"伦理知识","type":"x","no":"9","stem":"当审查决定为同意时，必须至少符合的标准有:（  ）","options":[{"key":"A","text":"研究具有科学和社会价值"},{"key":"B","text":"对预期的试验风险采取了相应的风险控制管理措施"},{"key":"C","text":"受试者的风险相对于预期受益来说是合理的"},{"key":"D","text":"受试者的选择是公平和公正的"},{"key":"E","text":"知情同意书告知信息充分，获取知情同意过程符合规定"},{"key":"F","text":"如有需要，试验方案应有充分的数据与安全监察计划，以保证受试者的安全"},{"key":"G","text":"保护受试者的隐私和保证数据的保密性"},{"key":"H","text":"涉及弱势群体的研究，具有相应的特殊保护措施"}],"answer":["A","B","C","D","E","F","G","H"],"raw":"9、当审查决定为同意时，必须至少符合的标准有:（  ）\nA.研究具有科学和社会价值\nB.对预期的试验风险采取了相应的风险控制管理措施\nC.受试者的风险相对于预期受益来说是合理的\nD.受试者的选择是公平和公正的\nE.知情同意书告知信息充分，获取知情同意过程符合规定\nF.如有需要，试验方案应有充分的数据与安全监察计划，以保证受试者的安全\nG.保护受试者的隐私和保证数据的保密性\nH.涉及弱势群体的研究，具有相应的特殊保护措施\n答案：ABCDEFGH"},{"id":"lunli-x-010","subject":"伦理","section":"伦理知识","type":"x","no":"10","stem":"研究参与者包括:（  ）","options":[{"key":"A","text":"人体研究的受试者"},{"key":"B","text":"提供个人生物样本用于涉及人的生命科学和医学研究的个体"},{"key":"C","text":"提供个人信息数据用于涉及人的生命科学和医学研究的个体"},{"key":"D","text":"提供个人健康记录用于涉及人的生命科学和医学研究的个体"},{"key":"E","text":"提供个人行为记录用于涉及人的生命科学和医学研究的个体"}],"answer":["A","B","C","D","E"],"raw":"10、研究参与者包括:（  ）\nA.人体研究的受试者\nB.提供个人生物样本用于涉及人的生命科学和医学研究的个体\nC.提供个人信息数据用于涉及人的生命科学和医学研究的个体\nD.提供个人健康记录用于涉及人的生命科学和医学研究的个体\nE.提供个人行为记录用于涉及人的生命科学和医学研究的个体\n答案：ABCDE"},{"id":"lunli-x-011","subject":"伦理","section":"伦理知识","type":"x","no":"11","stem":"医疗卫生机构的研究者违反《涉及人的生命科学和医学研究伦理审查办法》规定，有下列哪些情形之一的，由县级以上地方卫生健康主管部门对有关机构和人员依法给予行政处罚和处分：（  ）","options":[{"key":"A","text":"研究或者研究方案未获得伦理审查委员会审查批准擅自开展研究工作的；"},{"key":"B","text":"研究过程中发生严重不良反应或者严重不良事件未及时报告伦理审查委员会的；"},{"key":"C","text":"违反知情同意相关规定开展研究的；"},{"key":"D","text":"未及时提交相关研究报告的；"},{"key":"E","text":"未及时在国家医学研究登记备案信息系统上传信息的；"}],"answer":["A","B","C","D","E"],"raw":"11、医疗卫生机构的研究者违反《涉及人的生命科学和医学研究伦理审查办法》规定，有下列哪些情形之一的，由县级以上地方卫生健康主管部门对有关机构和人员依法给予行政处罚和处分：（  ）\nA.研究或者研究方案未获得伦理审查委员会审查批准擅自开展研究工作的；\nB.研究过程中发生严重不良反应或者严重不良事件未及时报告伦理审查委员会的；\nC.违反知情同意相关规定开展研究的；\nD.未及时提交相关研究报告的；\nE.未及时在国家医学研究登记备案信息系统上传信息的；\n答案：ABCDE"},{"id":"lunli-x-012","subject":"伦理","section":"伦理知识","type":"x","no":"12","stem":"伦理委员会的宗旨是通过对涉及人的生命科学和医学研究项目的（  ）方面提供独立、及时和公正透明的审查，确保受试者尊严、安全、权益和基本医疗得到保护，研究结果不损害公共利益，符合我国人类遗传资源管理相关规定，促进生物医学研究达到科学和伦理的高标准，增强公众对临床研究的信任和支持。","options":[{"key":"A","text":"科学性"},{"key":"B","text":"伦理合理性"},{"key":"C","text":"合法性"},{"key":"D","text":"规范性"}],"answer":["A","B"],"raw":"12、伦理委员会的宗旨是通过对涉及人的生命科学和医学研究项目的（  ）方面提供独立、及时和公正透明的审查，确保受试者尊严、安全、权益和基本医疗得到保护，研究结果不损害公共利益，符合我国人类遗传资源管理相关规定，促进生物医学研究达到科学和伦理的高标准，增强公众对临床研究的信任和支持。\nA.科学性\nB.伦理合理性\nC.合法性\nD.规范性\n答案：AB"},{"id":"lunli-x-013","subject":"伦理","section":"伦理知识","type":"x","no":"13","stem":"根据2024修订版《赫尔辛基宣言》关于“安慰剂使用”的条款，一种新的干预措施的获益、风险、负担和有效性，必须与已被证明的最佳干预措施进行对照试验，下列哪些情况除外：","options":[{"key":"A","text":"不存在已被证明的干预措施，使用安慰剂或不进行干预是可以接受的；"},{"key":"B","text":"出于令人信服的且科学合理的方法学原因，对于确定一种干预措施的有效性或安全性，使用已被证明的最佳干预措施之外的任何干预措施、使用安慰剂或不进行干预是必要的；同时，接受其他干预措施、安慰剂或不进行干预的参与者，不会承担因未接受已被证明的最佳干预措施而遭受严重或不可逆伤害的额外风险。必须格外注意避免滥用这一选择。"}],"answer":["A","B"],"raw":"13、根据2024修订版《赫尔辛基宣言》关于“安慰剂使用”的条款，一种新的干预措施的获益、风险、负担和有效性，必须与已被证明的最佳干预措施进行对照试验，下列哪些情况除外：\nA.不存在已被证明的干预措施，使用安慰剂或不进行干预是可以接受的；\nB.出于令人信服的且科学合理的方法学原因，对于确定一种干预措施的有效性或安全性，使用已被证明的最佳干预措施之外的任何干预措施、使用安慰剂或不进行干预是必要的；同时，接受其他干预措施、安慰剂或不进行干预的参与者，不会承担因未接受已被证明的最佳干预措施而遭受严重或不可逆伤害的额外风险。\n必须格外注意避免滥用这一选择。\n答案：AB"},{"id":"lunli-x-014","subject":"伦理","section":"伦理知识","type":"x","no":"14","stem":"根据2024修订版《赫尔辛基宣言》关于“自由和充分的知情同意”的条款，下列哪些描述是正确的：","options":[{"key":"A","text":"自由和充分的知情同意是尊重个人自主性的重要组成部分。有能力做出知情同意的个人参与医学研究必须是自愿的。虽然征求家庭成员或社群代表的意见可能是恰当的，但除非有知情同意能力的个人自由地表示同意，否则不能入组参与研究；"},{"key":"B","text":"在涉及有能力做出知情同意的人类参与者的医学研究中，必须以简明的语言充分告知每个潜在的参与者：目的、方法、预期获益与潜在的风险和负担、研究者资质、资金来源、任何潜在的利益冲突、隐私保护和信息保密规定、对参与者的激励、参与者因参与研究受到损害的治疗和/或补偿规定，以及研究的任何其他相关方面的信息。"},{"key":"C","text":"必须告知潜在的参与者其有权拒绝参与研究，或随时撤回参与研究的知情同意而不会受到报复。"},{"key":"D","text":"在确保潜在参与者理解了相关信息后，医生或其他有资质的个人必须设法获得潜在参与者自由表达的知情同意，并以书面或电子形式正式记录。如果不能以书面或电子方式表达同意，非书面的同意必须有正式的见证和记录。"},{"key":"E","text":"所有医学研究的参与者都应该有权选择是否被告知研究的总体成果和结果。"},{"key":"F","text":"如果潜在的参与者与医生存在依赖关系，或有可能被迫同意，在获取其参与研究的知情同意时，医生或其他研究者必须特别谨慎。在这种情况下，知情同意必须由一个合适的、具有资质的，且独立于这种关系之外的个人获取。"},{"key":"G","text":"对生物材料和可识别或可重新识别的数据进行收集、处理、存储，以及可预见的二次利用时，医生或其他有资质的个人必须获得研究参与者的自由和充分的知情同意。"}],"answer":["A","B","C","D","E","F","G"],"raw":"14、根据2024修订版《赫尔辛基宣言》关于“自由和充分的知情同意”的条款，下列哪些描述是正确的：\nA.自由和充分的知情同意是尊重个人自主性的重要组成部分。有能力做出知情同意的个人参与医学研究必须是自愿的。虽然征求家庭成员或社群代表的意见可能是恰当的，但除非有知情同意能力的个人自由地表示同意，否则不能入组参与研究；\nB.在涉及有能力做出知情同意的人类参与者的医学研究中，必须以简明的语言充分告知每个潜在的参与者：目的、方法、预期获益与潜在的风险和负担、研究者资质、资金来源、任何潜在的利益冲突、隐私保护和信息保密规定、对参与者的激励、参与者因参与研究受到损害的治疗和/或补偿规定，以及研究的任何其他相关方面的信息。\nC.必须告知潜在的参与者其有权拒绝参与研究，或随时撤回参与研究的知情同意而不会受到报复。\nD.在确保潜在参与者理解了相关信息后，医生或其他有资质的个人必须设法获得潜在参与者自由表达的知情同意，并以书面或电子形式正式记录。如果不能以书面或电子方式表达同意，非书面的同意必须有正式的见证和记录。\nE.所有医学研究的参与者都应该有权选择是否被告知研究的总体成果和结果。\nF.如果潜在的参与者与医生存在依赖关系，或有可能被迫同意，在获取其参与研究的知情同意时，医生或其他研究者必须特别谨慎。在这种情况下，知情同意必须由一个合适的、具有资质的，且独立于这种关系之外的个人获取。\nG.对生物材料和可识别或可重新识别的数据进行收集、处理、存储，以及可预见的二次利用时，医生或其他有资质的个人必须获得研究参与者的自由和充分的知情同意。\n答案：ABCDEFG"},{"id":"kangjun-a1-001","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"1","stem":"对铜绿假单胞菌治疗无效的药物是(  )","options":[{"key":"A","text":"头孢他定"},{"key":"B","text":"替加环素"},{"key":"C","text":"头孢哌酮"},{"key":"D","text":"环丙沙星"}],"answer":["B"],"raw":"1、对铜绿假单胞菌治疗无效的药物是(  )\nA.头孢他定\nB.替加环素\nC.头孢哌酮\nD.环丙沙星\n答案:B"},{"id":"kangjun-a1-002","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"2","stem":"下尿路感染中段尿培养为大肠埃希菌(ESBL阳性），下列抗菌药物中首选药物：(  )","options":[{"key":"A","text":"法罗培南"},{"key":"B","text":"呋喃妥因"},{"key":"C","text":"美罗培南"},{"key":"D","text":"阿奇霉素"}],"answer":["B"],"raw":"2、下尿路感染中段尿培养为大肠埃希菌(ESBL阳性），下列抗菌药物中首选药物：(  )\nA.法罗培南\nB.呋喃妥因\nC.美罗培南\nD.阿奇霉素\n答案:B"},{"id":"kangjun-a1-003","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"3","stem":"下列哪个抗菌药物血脑屏障穿透性最好(  )","options":[{"key":"A","text":"头孢唑啉"},{"key":"B","text":"罗红霉素"},{"key":"C","text":"头孢西丁"},{"key":"D","text":"头孢曲松"}],"answer":["D"],"raw":"3、下列哪个抗菌药物血脑屏障穿透性最好(  )\nA.头孢唑啉\nB.罗红霉素\nC.头孢西丁\nD.头孢曲松\n答案:D"},{"id":"kangjun-a1-004","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"4","stem":"细菌对阝-内酰胺类抗菌药物的主要耐药机制是产生(  )","options":[{"key":"A","text":"Ampc 酶"},{"key":"B","text":"阝-内酰胺酶"},{"key":"C","text":"氨基糖苷钝化酶"},{"key":"D","text":"超广谱阝-内酰胺酶"}],"answer":["B"],"raw":"4、细菌对阝-内酰胺类抗菌药物的主要耐药机制是产生(  )\nA.Ampc 酶\nB.阝-内酰胺酶\nC.氨基糖苷钝化酶\nD.超广谱阝-内酰胺酶\n答案:B"},{"id":"kangjun-a1-005","subject":"抗菌药物","section":"抗菌药物","type":"a1", E致病性大肠杆菌\n答案：D"},{"id":"kangjun-a1-033","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"33","stem":"不宜常规预防性应用抗菌药物的情况是(  )","options":[{"key":"A","text":"肿瘤患者"},{"key":"B","text":"普通感冒.麻疹.水痘等病毒性疾病"},{"key":"C","text":"昏迷.休克.心力衰竭患者"},{"key":"D","text":"以上都是"}],"answer":["D"],"raw":"33、不宜常规预防性应用抗菌药物的情况是(  )\nA.肿瘤患者\nB.普通感冒.麻疹.水痘等病毒性疾病\nC.昏迷.休克.心力衰竭患者\nD.以上都是\n答案：D"},{"id":"kangjun-a1-034","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"34","stem":"磷霉素氨丁三醇散的适应证主要是(  )","options":[{"key":"A","text":"下尿路感染"},{"key":"B","text":"肺部感染"},{"key":"C","text":"铜绿假单胞菌感染"},{"key":"D","text":"肠道感染"},{"key":"E","text":"皮肤软组织感染"}],"answer":["A"],"raw":"34、磷霉素氨丁三醇散的适应证主要是(  )\nA.下尿路感染\nB.肺部感染\nC.铜绿假单胞菌感染\nD.肠道感染\nE.皮肤软组织感染\n答案：A"},{"id":"kangjun-a1-035","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"35","stem":"男，10岁，因受涼后发热，最高温度38.5°C,伴咽痛及吞咽困难，扁桃体II度肿大，考虑“急性扁桃体炎”，首选的抗菌药物为(  )","options":[{"key":"A","text":"青霉素类"},{"key":"B","text":"大环内酯类"},{"key":"C","text":"喹诺酮类"},{"key":"D","text":"氨基糖昔类"},{"key":"E","text":"碳青霉素烯类"}],"answer":["A"],"raw":"35、男，10岁，因受涼后发热，最高温度38.5°C,伴咽痛及吞咽困难，扁桃体II度肿大，考虑“急性扁桃体炎”，首选的抗菌药物为(  )\nA.青霉素类\nB.大环内酯类\nC.喹诺酮类\nD.氨基糖昔类\nE.碳青霉素烯类\n答案：A"},{"id":"kangjun-a1-037","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"37","stem":"肝病时应避免选用的抗菌药物是(  )","options":[{"key":"A","text":"多粘菌素"},{"key":"B","text":"克林霉素"},{"key":"C","text":"红霉素酯化物"},{"key":"D","text":"红霉素"},{"key":"E","text":"两性霉素B"}],"answer":["C"],"raw":"37、肝病时应避免选用的抗菌药物是(  )\nA.多粘菌素\nB.克林霉素\nC.红霉素酯化物\nD.红霉素\nE.两性霉素B\n答案：C"},{"id":"kangjun-a1-040","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"40","stem":"下列说法正确的是(  )","options":[{"key":"A","text":"口服不吸收药物可以用于胃肠外感染的治疗"},{"key":"B","text":"使用氨基糖苷类抗生素时，应根据PK／PD特点，等时分次给药"},{"key":"C","text":"所有青霉素类.头胞菌素类药物都对铜绿假单胞菌都有抗菌作用"},{"key":"D","text":"治疗哺乳期妇女感染，应考虑抗菌药物在乳汁中的分泌可能对婴儿造成的影响"}],"answer":["D"],"raw":"40、下列说法正确的是(  )\nA.口服不吸收药物可以用于胃肠外感染的治疗\nB.使用氨基糖苷类抗生素时，应根据PK／PD特点，等时分次给药\nC.所有青霉素类.头胞菌素类药物都对铜绿假单胞菌都有抗菌作用\nD.治疗哺乳期妇女感染，应考虑抗菌药物在乳汁中的分泌可能对婴儿造成的影响\n答案：D"},{"id":"kangjun-a1-041","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"41","stem":"氯霉素目前临床应用较少，其实仍然是一个很好的抗菌药，只是临床使用时要注意不良反应。需要特别关注下列哪个不良反应？(  )","options":[{"key":"A","text":"肾功能损害"},{"key":"B","text":"肝功能损害"},{"key":"C","text":"骨髓抑制"},{"key":"D","text":"消化道反应"},{"key":"E","text":"中枢神经抑制"}],"answer":["C"],"raw":"41、氯霉素目前临床应用较少，其实仍然是一个很好的抗菌药，只是临床使用时要注意不良反应。需要特别关注下列哪个不良反应？(  )\nA.肾功能损害\nB.肝功能损害\nC.骨髓抑制\nD.消化道反应\nE.中枢神经抑制\n答案：C"},{"id":"kangjun-a1-042","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"42","stem":"HIV感染患者继发卡氏肺孢子菌肺炎，下列哪个或哪类抗菌药物是首选(  )","options":[{"key":"A","text":"氯霉素"},{"key":"B","text":"SMZco"},{"key":"C","text":"卡泊芬净"},{"key":"D","text":"利奈唑胺"},{"key":"E","text":"泊沙康唑"}],"answer":["B"],"raw":"42、HIV感染患者继发卡氏肺孢子菌肺炎，下列哪个或哪类抗菌药物是首选(  )\nA.氯霉素\nB.SMZco\nC.卡泊芬净\nD.利奈唑胺\nE.泊沙康唑\n答案：B"},{"id":"kangjun-a1-043","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"43","stem":"《抗菌药物临床应用管理办法》所称抗菌药物是指  (  )","options":[{"key":"A","text":"治疗细菌、支原体、衣原体、真菌、结核病、寄生虫病等病原微生物所致感染的药物"},{"key":"B","text":"治疗细菌、支原体、衣原体、真菌等病原微生物所致感染的药物"},{"key":"C","text":"A+治疗各种病毒所致感染药物"},{"key":"D","text":"A+具有抗菌作用的中药制剂"}],"answer":["B"],"raw":"43、《抗菌药物临床应用管理办法》所称抗菌药物是指  (  )\nA.治疗细菌、支原体、衣原体、真菌、结核病、寄生虫病等病原微生物所致感染的药物\nB.治疗细菌、支原体、衣原体、真菌等病原微生物所致感染的药物\nC.A+治疗各种病毒所致感染药物\nD.A+具有抗菌作用的中药制剂\n答案：B"},{"id":"kangjun-a1-044","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"44","stem":"对肺炎支原体的作用为最强的大环内酯类药物是(  )","options":[{"key":"A","text":"克拉霉素"},{"key":"B","text":"红霉素"},{"key":"C","text":"阿奇霉素"},{"key":"D","text":"罗红霉素"}],"answer":["C"],"raw":"44、对肺炎支原体的作用为最强的大环内酯类药物是(  )\nA.克拉霉素\nB.红霉素\nC.阿奇霉素\nD.罗红霉素\n答案：C"},{"id":"kangjun-a1-045","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"45","stem":"接受特殊使用级别抗菌药物治疗的住院患者抗菌药物使用前微生物送检率不低于(  )","options":[{"key":"A","text":"50%"},{"key":"B","text":"40%"},{"key":"C","text":"80%"},{"key":"D","text":"60%"}],"answer":["C"],"raw":"45、接受特殊使用级别抗菌药物治疗的住院患者抗菌药物使用前微生物送检率不低于(  )\nA.50%\nB.40%\nC.80%\nD.60%\n答案：C"},{"id":"kangjun-a1-046","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"46","stem":"不能以葡萄糖注射液作为溶媒的抗菌药物（影响药物稳定性）(  )","options":[{"key":"A","text":"庆大霉素"},{"key":"B","text":"头孢他啶"},{"key":"C","text":"美罗培南"},{"key":"D","text":"氨苄西林"}],"answer":["D"],"raw":"46、不能以葡萄糖注射液作为溶媒的抗菌药物（影响药物稳定性）(  )\nA.庆大霉素\nB.头孢他啶\nC.美罗培南\nD.氨苄西林\n答案：D"},{"id":"kangjun-a1-047","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"47","stem":"国家及医院有关制度规定，临床医生须经抗菌药物管理政策.制度，合理用药知识等相关培训并经考核合格后，方能授予相应级别的抗菌药物处方权限。下列关于接受培训和处方权的叙述不正确的是  (  )","options":[{"key":"A","text":"医院应定期组织对全体医生进行相应培训"},{"key":"B","text":"当年新进院医生经新职工相关知识培训后可授予抗菌药物处方权"},{"key":"C","text":"已经取得处方权的医生不必接受培训"},{"key":"D","text":"当年培训未获得规定学分或考试不合格的不得授予"}],"answer":["C"],"raw":"47、国家及医院有关制度规定，临床医生须经抗菌药物管理政策.制度，合理用药知识等相关培训并经考核合格后，方能授予相应级别的抗菌药物处方权限。下列关于接受培训和处方权的叙述不正确的是  (  )\nA.医院应定期组织对全体医生进行相应培训\nB.当年新进院医生经新职工相关知识培训后可授予抗菌药物处方权\nC.已经取得处方权的医生不必接受培训\nD.当年培训未获得规定学分或考试不合格的不得授予\n答案：C"},{"id":"kangjun-a1-048","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"48","stem":"防治青霉素过敏反应的措施及抢救方法不正确的是(  )","options":[{"key":"A","text":"详细询问过敏史"},{"key":"B","text":"用药前应做皮试"},{"key":"C","text":"注射皮试液后，等待20分钟观察结果，阴性反应者方可用药"},{"key":"D","text":"过敏性休克首选葡萄糖酸钙解救"}],"answer":["D"],"raw":"48、防治青霉素过敏反应的措施及抢救方法不正确的是(  )\nA.详细询问过敏史\nB.用药前应做皮试\nC.注射皮试液后，等待20分钟观察结果，阴性反应者方可用药\nD.过敏性休克首选葡萄糖酸钙解救\n答案：D"},{"id":"kangjun-a1-049","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"49","stem":"对厌氧菌有良好抗菌活性，不需要联合甲硝唑的药物包括：(  )","options":[{"key":"A","text":"β内酰胺酶抑制剂复方制剂；"},{"key":"B","text":"头霉素类；"},{"key":"C","text":"碳青霉烯类；"},{"key":"D","text":"以上都是；"}],"answer":["D"],"raw":"49、对厌氧菌有良好抗菌活性，不需要联合甲硝唑的药物包括：(  )\nA.β内酰胺酶抑制剂复方制剂；\nB.头霉素类；\nC.碳青霉烯类；\nD.以上都是；\n答案：D"},{"id":"kangjun-a1-050","subject":"抗菌药物","section":"抗菌药物","type":"a1","no":"50","stem":"围手术期预防性使用抗菌药物需要覆盖厌氧菌的类型不包括以下哪一个？(  )","options":[{"key":"A","text":"有梗阻的小肠手术"},{"key":"B","text":"肝胆手术"},{"key":"C","text":"直结肠手术"},{"key":"D","text":"经阴道的妇科手术"}],"answer":["B"],"raw":"50、围手术期预防性使用抗菌药物需要覆盖厌氧菌的类型不包括以下哪一个？(  )\nA.有梗阻的小肠手术\nB.肝胆手术\nC.直结肠手术\nD.经阴道的妇科手术\n答案：B"},{"id":"kangjun-x-001","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"1","stem":"产碳青霉烯酶的肺炎克雷伯菌可能敏感的抗菌药物(  )","options":[{"key":"A","text":"多粘菌素"},{"key":"B","text":"头孢吡肟"},{"key":"C","text":"替加环素"},{"key":"D","text":"头孢他啶"},{"key":"E","text":"头孢哌酮-舒巴坦"}],"answer":["A","C"],"raw":"1、产碳青霉烯酶的肺炎克雷伯菌可能敏感的抗菌药物(  )\nA.多粘菌素\nB.头孢吡肟\nC.替加环素\nD.头孢他啶\nE.头孢哌酮-舒巴坦\n答案:AC"},{"id":"kangjun-x-002","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"2","stem":"SMZco是下列哪些感染的首选治疗药物(  )","options":[{"key":"A","text":"伤寒"},{"key":"B","text":"肺孢子菌肺炎"},{"key":"C","text":"放线菌感染"},{"key":"D","text":"奴卡菌病"},{"key":"E","text":"嗜麦芽窄食单胞菌感染"}],"answer":["B","D","E"],"raw":"2、SMZco是下列哪些感染的首选治疗药物(  )\nA.伤寒\nB.肺孢子菌肺炎\nC.放线菌感染\nD.奴卡菌病\nE.嗜麦芽窄食单胞菌感染\n答案：BDE"},{"id":"kangjun-x-003","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"3","stem":"血培养标本采集送检正确的包括(  )","options":[{"key":"A","text":"推荐同时采集2套（不同部位）血培养标本（即双瓶双臂）可提高培养阳性率"},{"key":"B","text":"怀疑感染性心内膜炎时，最好采集动脉血送培养"},{"key":"C","text":"临床上疑诊败血症，不管是发热（≥38℃）或低体温（≤36℃）都应该进行血培养"},{"key":"D","text":"静脉留置导管者如果必须从留置导管内采血，也应同时从另一侧外周静脉采集另外一套血培养标本"}],"answer":["A","B","C","D"],"raw":"3、血培养标本采集送检正确的包括(  )\nA.推荐同时采集2套（不同部位）血培养标本（即双瓶双臂）可提高培养阳性率\nB.怀疑感染性心内膜炎时，最好采集动脉血送培养\nC.临床上疑诊败血症，不管是发热（≥38℃）或低体温（≤36℃）都应该进行血培养\nD.静脉留置导管者如果必须从留置导管内采血，也应同时从另一侧外周静脉采集另外一套血培养标本\n答案：ABCD"},{"id":"kangjun-x-004","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"4","stem":"围术期抗菌药物预防用药目的中预防手术部位感染包括哪些？(  )","options":[{"key":"A","text":"浅表切口感染"},{"key":"B","text":"深部切口感染"},{"key":"C","text":"手术所涉及的器官/腔隙感染"},{"key":"D","text":"与手术无直接关系"},{"key":"E","text":"术后发生的其他部位感染"}],"answer":["A","B","C"],"raw":"4、围术期抗菌药物预防用药目的中预防手术部位感染包括哪些？(  )\nA.浅表切口感染\nB.深部切口感染\nC.手术所涉及的器官/腔隙感染\nD.与手术无直接关系\nE.术后发生的其他部位感染\n答案：ABC"},{"id":"kangjun-x-005","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"5","stem":"肝、胆系统及胰腺围术期可用以下哪些预防抗菌药物？(  )","options":[{"key":"A","text":"第一、二代头孢菌素[3]"},{"key":"B","text":"氨基糖苷类"},{"key":"C","text":"头孢曲松[3]±[5]甲硝唑"},{"key":"D","text":"头霉素类"}],"answer":["A","C","D"],"raw":"5、肝、胆系统及胰腺围术期可用以下哪些预防抗菌药物？(  )\nA.第一、二代头孢菌素[3]\nB.氨基糖苷类\nC.头孢曲松[3]±[5]甲硝唑\nD.头霉素类\n答案：ACD"},{"id":"kangjun-x-006","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"6","stem":"下列对于头孢西丁的描述，正确的是(  )","options":[{"key":"A","text":"属于头霉素类抗生素"},{"key":"B","text":"对ESBls稳定"},{"key":"C","text":"对革兰阳性球菌具有较强抗菌活性"},{"key":"D","text":"对大肠埃希菌.肺炎克雷伯菌的抗菌活性不如头"},{"key":"E","text":"对厌氧菌抗菌活性较头孢美唑更强"}],"answer":["A","B","D","E"],"raw":"6、下列对于头孢西丁的描述，正确的是(  )\nA.属于头霉素类抗生素\nB.对ESBls稳定\nC.对革兰阳性球菌具有较强抗菌活性\nD.对大肠埃希菌.肺炎克雷伯菌的抗菌活性不如头\nE.对厌氧菌抗菌活性较头孢美唑更强\n答案：ABDE"},{"id":"kangjun-x-007","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"7","stem":"“抗菌药物临床应用指导原则（2015版）”推荐，胃肠道.腹腔及盆腔等II.III类切口手术可单用头霉素替代头孢菌素联合甲硝唑，原因有(  )","options":[{"key":"A","text":"甲硝唑副作用太大，病人耐受差"},{"key":"B","text":"头霉素对II.III类切口手术最常见的污染菌肠杆菌科细菌具有良好抗菌活性"},{"key":"C","text":"头霉素同时覆盖II.III类切口手术常见污染菌厌氧菌"},{"key":"D","text":"头霉素不需要皮试，而头孢菌素使用前需要皮试"},{"key":"E","text":"抗菌药应在皮肤切开前0.5-1h开始给药并在用完后才能开始手术。头霉素只需单独用药更方便，而普通头孢菌素需要联合甲硝唑，两药联合难保证术前预防用药时机"}],"answer":["B","C","E"],"raw":"7、“抗菌药物临床应用指导原则（2015版）”推荐，胃肠道.腹腔及盆腔等II.III类切口手术可单用头霉素替代头孢菌素联合甲硝唑，原因有(  )\nA.甲硝唑副作用太大，病人耐受差\nB.头霉素对II.III类切口手术最常见的污染菌肠杆菌科细菌具有良好抗菌活性\nC.头霉素同时覆盖II.III类切口手术常见污染菌厌氧菌\nD.头霉素不需要皮试，而头孢菌素使用前需要皮试\nE.抗菌药应在皮肤切开前0.5-1h开始给药并在用完后才能开始手术。头霉素只需单独用药更方便，而普通头孢菌素需要联合甲硝唑，两药联合难保证术前预防用药时机\n答案：BCE"},{"id":"kangjun-x-008","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"8","stem":"下列哪些抗菌药物同时具有良好抗厌氧菌作用，通常不需联合使用专性抗厌氧菌药物(  )","options":[{"key":"A","text":"阿莫西林／克拉维酸"},{"key":"B","text":"莫西沙星"},{"key":"C","text":"头孢米诺"},{"key":"D","text":"克林霉素"},{"key":"E","text":"头孢哌酮／舒巴坦"}],"answer":["A","B","C","D","E"],"raw":"8、下列哪些抗菌药物同时具有良好抗厌氧菌作用，通常不需联合使用专性抗厌氧菌药物(  )\nA.阿莫西林／克拉维酸\nB.莫西沙星\nC.头孢米诺\nD.克林霉素\nE.头孢哌酮／舒巴坦\n答案：ABCDE"},{"id":"kangjun-x-009","subject":"抗菌药物","section":"抗菌药物","type":"x","no":"9","stem":"下列哪些药物可用于治疗幽门螺杆菌感染？(  )","options":[{"key":"A","text":"克拉霉素"},{"key":"B","text":"阿奇霉素"},{"key":"C","text":"头孢克洛"},{"key":"D","text":"阿莫西林"},{"key":"E","text":"甲硝唑"}],"answer":["A","D","E"],"raw":"9、下列哪些药物可
