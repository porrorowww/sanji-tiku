"},{"key":"D","text":"以上都包括"}],"answer":["D"],"raw":"4、医务人员的权利包括（ ）\nA.医疗诊治权\nB.科学研究权\nC.继续教育权\nD.以上都包括\n答案：D"},{"id":"fagui-a1-005","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"5","stem":"医务人员的义务包括（ ）","options":[{"key":"A","text":"遵守医疗卫生管理法律、法规、规章和诊疗护理规范、常规"},{"key":"B","text":"树立敬业精神，遵守职业道德，履行医师职责，尽职尽责为患者服务"},{"key":"C","text":"关心、爱护、尊重患者，保护患者的隐私"},{"key":"D","text":"以上都包括"}],"answer":["D"],"raw":"5、医务人员的义务包括（ ）\nA.遵守医疗卫生管理法律、法规、规章和诊疗护理规范、常规\nB.树立敬业精神，遵守职业道德，履行医师职责，尽职尽责为患者服务\nC.关心、爱护、尊重患者，保护患者的隐私\nD.以上都包括\n答案：D"},{"id":"fagui-a1-006","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"6","stem":"《中华人民共和国民法典》规定：医疗机构及其医务人员不得违反实施不必要的检查（  ）","options":[{"key":"A","text":"医疗常识"},{"key":"B","text":"诊疗规范"},{"key":"C","text":"医院规定"},{"key":"D","text":"有关规定"}],"answer":["B"],"raw":"6、《中华人民共和国民法典》规定：医疗机构及其医务人员不得违反实施不必要的检查（  ）\nA.医疗常识\nB.诊疗规范\nC.医院规定\nD.有关规定\n答案：B"},{"id":"fagui-a1-007","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"7","stem":"《中华人民共和国刑法》第三百三十五条规定，医务人员由于 (  )  ，造成就诊人死亡或者严重损害就诊人身体健康的，成立医疗事故罪（ ）","options":[{"key":"A","text":"严重不负责任"},{"key":"B","text":"故意"},{"key":"C","text":"意外事件"},{"key":"D","text":"不可抗力"}],"answer":["A"],"raw":"7、《中华人民共和国刑法》第三百三十五条规定，医务人员由于 (  )  ，造成就诊人死亡或者严重损害就诊人身体健康的，成立医疗事故罪（ ）\nA.严重不负责任\nB.故意\nC.意外事件\nD.不可抗力\n答案： A"},{"id":"fagui-a1-008","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"8","stem":"医务人员的诊疗行为，侵犯患者知情权的是（  ）","options":[{"key":"A","text":"医务人员术前没有告知患者替代性医疗方案"},{"key":"B","text":"患者在手术中安装的假肢在正常使用情况下发生断裂"},{"key":"C","text":"医务人员为从事科学研究公开患者的病历资料"},{"key":"D","text":"医务人员对患者实施不必要的检查"}],"answer":["A"],"raw":"8、医务人员的诊疗行为，侵犯患者知情权的是（  ）\nA.医务人员术前没有告知患者替代性医疗方案\nB.患者在手术中安装的假肢在正常使用情况下发生断裂\nC.医务人员为从事科学研究公开患者的病历资料\nD.医务人员对患者实施不必要的检查\n答案：A"},{"id":"fagui-a1-009","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"9","stem":"《中华人民共和国民法典》规定：医务人员在诊疗活动中应当向患者说明病情和医疗措施。需要实施手术、特殊检查、特殊治疗的，医务人员应当及时向患者    医疗风险、替代医疗方案等情况，并取得其 （  ） ；不能或者不宜向患者说明的，应当向患者的近亲属说明，并取得其明确同意（）","options":[{"key":"A","text":"说明；同意"},{"key":"B","text":"具体说明；同意"},{"key":"C","text":"具体说明；明确同意"},{"key":"D","text":"说明；明确同意"}],"answer":["C"],"raw":"9、《中华人民共和国民法典》规定：医务人员在诊疗活动中应当向患者说明病情和医疗措施。需要实施手术、特殊检查、特殊治疗的，医务人员应当及时向患者    医疗风险、替代医疗方案等情况，并取得其 （  ） ；不能或者不宜向患者说明的，应当向患者的近亲属说明，并取得其明确同意（）\nA.说明；同意\nB.具体说明；同意\nC.具体说明；明确同意\nD.说明；明确同意\n答案： C"},{"id":"fagui-a1-010","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"10","stem":"关于患者知情权问题，在患者处于昏迷等无法自主作出决定的状态或者病情不宜向患者说明等情形下，应当向患者的近亲属说明，患者的近亲属不包括（ ）","options":[{"key":"A","text":"父母"},{"key":"B","text":"子女"},{"key":"C","text":"外甥、外甥女"},{"key":"D","text":"祖父母"}],"answer":["C"],"raw":"10、关于患者知情权问题，在患者处于昏迷等无法自主作出决定的状态或者病情不宜向患者说明等情形下，应当向患者的近亲属说明，患者的近亲属不包括（ ）\nA.父母\nB.子女\nC.外甥、外甥女\nD.祖父母\n答案： C"},{"id":"fagui-a1-011","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"11","stem":"下列属于侵犯患者隐私权的行为是（）","options":[{"key":"A","text":"医务人员将患者病历资料拍照发朋友圈"},{"key":"B","text":"病案专业人员因工作疏忽造成病案损坏、丢失、被盗而发生患者隐私泄露"},{"key":"C","text":"以书面形式（撰写医学论著、科研论文等）公开患者隐私"},{"key":"D","text":"以上都是"}],"answer":["D"],"raw":"11、下列属于侵犯患者隐私权的行为是（）\nA.医务人员将患者病历资料拍照发朋友圈\nB.病案专业人员因工作疏忽造成病案损坏、丢失、被盗而发生患者隐私泄露\nC.以书面形式（撰写医学论著、科研论文等）公开患者隐私\nD.以上都是\n答案： D"},{"id":"fagui-a1-012","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"12","stem":"因抢救生命垂危惠者在紧急情况下已经尽到合理诊疗义务，医务人员无过错造成患者损伤，医疗机构 (  ) 赔偿责任()","options":[{"key":"A","text":"承担"},{"key":"B","text":"视损害情况"},{"key":"C","text":"不承担"},{"key":"D","text":"部分承担"}],"answer":["C"],"raw":"12、因抢救生命垂危惠者在紧急情况下已经尽到合理诊疗义务，医务人员无过错造成患者损伤，医疗机构 (  ) 赔偿责任()\nA.承担\nB.视损害情况\nC.不承担\nD.部分承担\n答案： C"},{"id":"fagui-a1-013","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"13","stem":"需要向清醒患者实施手术、特殊检查、特殊治疗的，医务人员应当及时向 具体说明医疗风险、替代医疗方案等情况，并取得其明确同意( )","options":[{"key":"A","text":"兄弟姐妹"},{"key":"B","text":"父母"},{"key":"C","text":"患者本人"},{"key":"D","text":"配偶"}],"answer":["C"],"raw":"13、需要向清醒患者实施手术、特殊检查、特殊治疗的，医务人员应当及时向\n具体说明医疗风险、替代医疗方案等情况，并取得其明确同意( )\nA.兄弟姐妹\nB.父母\nC.患者本人\nD.配偶\n答案：C"},{"id":"fagui-a1-014","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"14","stem":"《中华人民共和国民法典》规定：为研制新药、医疗器械或者发展新的预防和治疗方法，需要进行临床试验的，应当依法经 (  ) 同意，向受试者或者受试者的监护人告知试验目的、用途和可能产生的风险等详细情况，并经其书面同意。进行临床试验的，不得向受试者收取试验费用（ ）","options":[{"key":"A","text":"相关主管部门批准"},{"key":"B","text":"相关主管部门批准并经伦理委员会审查"},{"key":"C","text":"伦理委员会审查"},{"key":"D","text":"医院负责人"}],"answer":["B"],"raw":"14、《中华人民共和国民法典》规定：为研制新药、医疗器械或者发展新的预防和治疗方法，需要进行临床试验的，应当依法经 (  ) 同意，向受试者或者受试者的监护人告知试验目的、用途和可能产生的风险等详细情况，并经其书面同意。进行临床试验的，不得向受试者收取试验费用（ ）\nA.相关主管部门批准\nB.相关主管部门批准并经伦理委员会审查\nC.伦理委员会审查\nD.医院负责人\n答案：B"},{"id":"fagui-a1-015","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"15","stem":"每年（   ）为中国医师节（ ）","options":[{"key":"A","text":"8月19日"},{"key":"B","text":"8月20日"},{"key":"C","text":"7月19日"},{"key":"D","text":"7月20日"}],"answer":["A"],"raw":"15、每年（   ）为中国医师节（ ）\nA.8月19日\nB.8月20日\nC.7月19日\nD.7月20日\n答案：A"},{"id":"fagui-a1-016","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"16","stem":"医疗法律责任的构成要件包括（）","options":[{"key":"A","text":"违法行为"},{"key":"B","text":"损害后果"},{"key":"C","text":"因果关系"},{"key":"D","text":"主观过错"},{"key":"E","text":"以上都是"}],"answer":["E"],"raw":"16、医疗法律责任的构成要件包括（）\nA.违法行为\nB.损害后果\nC.因果关系\nD.主观过错\nE以上都是\n答案：E"},{"id":"fagui-a1-017","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"17","stem":"医疗法律责任的分类不包括（ ）","options":[{"key":"A","text":"违宪责任"},{"key":"B","text":"民事责任"},{"key":"C","text":"刑事责任"},{"key":"D","text":"行政责任"}],"answer":["A"],"raw":"17、医疗法律责任的分类不包括（ ）\nA.违宪责任\nB.民事责任\nC.刑事责任\nD.行政责任\n答案： A"},{"id":"fagui-a1-018","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"18","stem":"《医疗事故处理条例》规定：医务人员在医疗活动中发生或者发现医疗事故、可能引起医疗事故的医疗过失行为或者发生医疗事故争议的，处理程序不包括（）","options":[{"key":"A","text":"凡发生医疗事故或事件，当时的医务人员应立即向本医疗单位的科室负责人报告。"},{"key":"B","text":"发生医疗事故或事件的医疗单位，应指派专人妥善保管有关的各种原始资料。"},{"key":"C","text":"医疗单位对发生的医疗事故或事件，应立即进行调查、处理，并报告上级卫生行政部门。"},{"key":"D","text":"凡发生医疗事故或事件、临床诊断不能明确死亡原因的，都必须进行尸检。应在患者死亡24小时以内进行。"},{"key":"E","text":"科室负责人应随即向本医疗单位负责人报告。"}],"answer":["D"],"raw":"18、《医疗事故处理条例》规定：医务人员在医疗活动中发生或者发现医疗事故、可能引起医疗事故的医疗过失行为或者发生医疗事故争议的，处理程序不包括（）\nA.凡发生医疗事故或事件，当时的医务人员应立即向本医疗单位的科室负责人报告。\nB.发生医疗事故或事件的医疗单位，应指派专人妥善保管有关的各种原始资料。\nC.医疗单位对发生的医疗事故或事件，应立即进行调查、处理，并报告上级卫生行政部门。\nD.凡发生医疗事故或事件、临床诊断不能明确死亡原因的，都必须进行尸检。应在患者死亡24小时以内进行。\nE.科室负责人应随即向本医疗单位负责人报告。\n答案： D"},{"id":"fagui-a1-019","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"19","stem":"《医疗事故处理条例》规定：根据对患者人身造成的损害程度，医疗事故分为四级，其中“造成患者轻度残疾、器官组织损伤导致一般功能障碍的”属于：（）","options":[{"key":"A","text":"一级医疗事故"},{"key":"B","text":"二级医疗事故"},{"key":"C","text":"三级医疗事故"},{"key":"D","text":"四级医疗事故"}],"answer":["C"],"raw":"19、《医疗事故处理条例》规定：根据对患者人身造成的损害程度，医疗事故分为四级，其中“造成患者轻度残疾、器官组织损伤导致一般功能障碍的”属于：（）\nA.一级医疗事故\nB.二级医疗事故\nC.三级医疗事故\nD.四级医疗事故\n答案： C"},{"id":"fagui-a1-020","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"20","stem":"医疗事故的赔偿标准包括（  ）","options":[{"key":"A","text":"医疗事故等级"},{"key":"B","text":"医疗过失行为在医疗事故损害后果中的责任程度"},{"key":"C","text":"医疗事故损害后果与患者原有疾病状况之间的关系"},{"key":"D","text":"以上都包括"}],"answer":["D"],"raw":"20、医疗事故的赔偿标准包括（  ）\nA.医疗事故等级\nB.医疗过失行为在医疗事故损害后果中的责任程度\nC.医疗事故损害后果与患者原有疾病状况之间的关系\nD.以上都包括\n答案：D"},{"id":"fagui-a1-021","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"21","stem":"《医疗纠纷预防和处理条例》规定：医疗机构及其医务人员应当按照国务院卫生主管部门的规定，填写并妥善保管病历资料。因紧急抢救未能及时填写病历的，医务人员应当在抢救结束后    小时内据实补记，并加以注明（）","options":[{"key":"A","text":"2小时"},{"key":"B","text":"4小时"},{"key":"C","text":"6小时"},{"key":"D","text":"8小时"}],"answer":["C"],"raw":"21、《医疗纠纷预防和处理条例》规定：医疗机构及其医务人员应当按照国务院卫生主管部门的规定，填写并妥善保管病历资料。因紧急抢救未能及时填写病历的，医务人员应当在抢救结束后    小时内据实补记，并加以注明（）\nA.2小时\nB.4小时\nC.6小时\nD.8小时\n答案： C"},{"id":"fagui-a1-022","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"22","stem":"为境外的机构、组织、人员窃取、刺探、收买、非法提供国家秘密或者情报的，依法（ ）","options":[{"key":"A","text":"追究刑事责任"},{"key":"B","text":"追究民事责任"},{"key":"C","text":"进行批评教育"}],"answer":["A"],"raw":"22、为境外的机构、组织、人员窃取、刺探、收买、非法提供国家秘密或者情报的，依法（ ）\nA.追究刑事责任\nB.追究民事责任\nC.进行批评教育\n答案：A"},{"id":"fagui-a1-023","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"23","stem":"以下哪个部位应当确定为保密要害部位（ ）","options":[{"key":"A","text":"传达室"},{"key":"B","text":"办公室"},{"key":"C","text":"档案室"}],"answer":["C"],"raw":"23、以下哪个部位应当确定为保密要害部位（ ）\nA.传达室\nB.办公室\nC.档案室\n答案：C"},{"id":"fagui-a1-024","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"24","stem":"《中华人民共和国献血法》规定：血站对献血者每次采集血液量一般为 (  )   毫升，最多不得超过    毫升，两次采集间隔期不少于(  ) 个月（ ）","options":[{"key":"A","text":"200；400；3"},{"key":"B","text":"200；600；6"},{"key":"C","text":"200；400；6"},{"key":"D","text":"300；500；4"},{"key":"E","text":"200；400；12"}],"answer":["C"],"raw":"24、《中华人民共和国献血法》规定：血站对献血者每次采集血液量一般为 (  )   毫升，最多不得超过    毫升，两次采集间隔期不少于(  ) 个月（ ）\nA.200；400；3\nB.200；600；6\nC.200；400；6\nD.300；500；4\nE.200；400；12\n答案：C"},{"id":"fagui-a1-025","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"25","stem":"依据《安全生产法》的规定，从业人员发现事故隐患或者其他不安全因素，应当 （  ）处理。（  ）","options":[{"key":"A","text":"立即向现场安全生产管理人员或者本单位负责人报告"},{"key":"B","text":"立即停止作业"},{"key":"C","text":"自己想办法排除隐患"},{"key":"D","text":"告诉工友注意安全继续作业"}],"answer":["A"],"raw":"25、依据《安全生产法》的规定，从业人员发现事故隐患或者其他不安全因素，应当 （  ）处理。（  ）\nA.立即向现场安全生产管理人员或者本单位负责人报告\nB.立即停止作业\nC.自己想办法排除隐患\nD.告诉工友注意安全继续作业\n答案： A"},{"id":"fagui-a1-026","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"26","stem":"重大生产安全事故是指造成（  ）以上（  ）以下死亡，或者50人以上100人以下重伤，或者5000万元以上1 亿元以下直接经济损失的事故 ( )","options":[{"key":"A","text":"1人、3人"},{"key":"B","text":"3人、10人"},{"key":"C","text":"10人、30人"}],"answer":["C"],"raw":"26、重大生产安全事故是指造成（  ）以上（  ）以下死亡，或者50人以上100人以下重伤，或者5000万元以上1 亿元以下直接经济损失的事故 ( )\nA.1人、3人\nB.3人、10人\nC.10人、30人\n答案： C"},{"id":"fagui-a1-027","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"27","stem":"《消防法》规定， 消防工作贯彻 （  ）的方针（  ）","options":[{"key":"A","text":"谁主管、谁负责"},{"key":"B","text":"以防为主、以消为辅"},{"key":"C","text":"预防为主、防消结合"}],"answer":["C"],"raw":"27、《消防法》规定， 消防工作贯彻 （  ）的方针（  ）\nA.谁主管、谁负责\nB.以防为主、以消为辅\nC.预防为主、防消结合\n答案： C"},{"id":"fagui-a1-028","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"28","stem":"在易燃易爆场所作业的人员不能穿戴 （  ）","options":[{"key":"A","text":"尼龙工作服"},{"key":"B","text":"棉布工作服"},{"key":"C","text":"防静电服"},{"key":"D","text":"耐高温鞋"}],"answer":["A"],"raw":"在易燃易爆场所作业的人员不能穿戴 （  ）\nA.尼龙工作服\nB.棉布工作服\nC.防静电服\nD.耐高温鞋\n答案：A"},{"id":"fagui-a1-029","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"29","stem":"工作场所发生火灾时，应 （  ）","options":[{"key":"A","text":"尽快乘搭电梯离开"},{"key":"B","text":"按防火通道标志离开"},{"key":"C","text":"各显其能， 凭自己的本领逃离"}],"answer":["B"],"raw":"工作场所发生火灾时，应 （  ）\nA.尽快乘搭电梯离开\nB.按防火通道标志离开\nC.各显其能， 凭自己的本领逃离\n答案： B"},{"id":"fagui-a1-030","subject":"法律法规","section":"医疗法律法规","type":"a1","no":"30","stem":"根据《中华人民共和国民法典》规定，依法成立的合同，（  ）生效，但是法律另有规定或者当事人另有约定的除外（）","options":[{"key":"A","text":"自编写时"},{"key":"B","text":"自签订时"},{"key":"C","text":"自成立时"}],"answer":["C"],"raw":"30、根据《中华人民共和国民法典》规定，依法成立的合同，（  ）生效，但是法律另有规定或者当事人另有约定的除外（）\nA.自编写时\nB.自签订时\nC.自成立时\n答案： C"},{"id":"fagui-x-001","subject":"法律法规","section":"医疗法律法规","type":"x","no":"1","stem":"国家大力发展中医药事业，坚持 （  ），发挥中医药在医疗卫生与健康事业中的独特作用：()","options":[{"key":"A","text":"中西医并重"},{"key":"B","text":"中医优先"},{"key":"C","text":"传承与创新相结合"},{"key":"D","text":"注重传统"}],"answer":["A","C"],"raw":"1、国家大力发展中医药事业，坚持 （  ），发挥中医药在医疗卫生与健康事业中的独特作用：()\nA.中西医并重\nB.中医优先\nC.传承与创新相结合\nD.注重传统\n答案：AC"},{"id":"fagui-x-002","subject":"法律法规","section":"医疗法律法规","type":"x","no":"2","stem":"违反《中华人民共和国基本医疗卫生与健康促进法》规定， （  ） 非法买卖、提供或者公开公民个人健康信息等，构成违反治安管理行为的依法给予治安管理处罚()","options":[{"key":"A","text":"扰乱医疗卫生机构执业场所秩序"},{"key":"B","text":"威胁、危害医疗卫生人员人身安全"},{"key":"C","text":"侵犯医疗卫生人员人格尊严"},{"key":"D","text":"非法收集、使用、加工、传输公民个人健康信息"}],"answer":["A","B","C","D"],"raw":"2、违反《中华人民共和国基本医疗卫生与健康促进法》规定， （  ） 非法买卖、提供或者公开公民个人健康信息等，构成违反治安管理行为的依法给予治安管理处罚()\nA.扰乱医疗卫生机构执业场所秩序\nB.威胁、危害医疗卫生人员人身安全\nC.侵犯医疗卫生人员人格尊严\nD.非法收集、使用、加工、传输公民个人健康信息\n答案：ABCD"},{"id":"fagui-x-003","subject":"法律法规","section":"医疗法律法规","type":"x","no":"3","stem":"发生医疗纠纷，医患双方可以通过下列途径解决（）","options":[{"key":"A","text":"双方自愿协商"},{"key":"B","text":"申请人民调解"},{"key":"C","text":"申请行政调解"},{"key":"D","text":"向人民法院提起诉讼"}],"answer":["A","B","C","D"],"raw":"3、发生医疗纠纷，医患双方可以通过下列途径解决（）\nA.双方自愿协商\nB.申请人民调解\nC.申请行政调解\nD.向人民法院提起诉讼\n答案：ABCD"},{"id":"fagui-x-004","subject":"法律法规","section":"医疗法律法规","type":"x","no":"4","stem":"患者在诊疗活动中受到损害，有下列情形之一的，医疗机构不承担赔偿责任（）","options":[{"key":"A","text":"患者或者其近亲属不配合医疗机构进行符合诊疗规范的诊疗"},{"key":"B","text":"医务人员在抢救生命垂危的患者等紧急情况下已经尽到合理诊疗义务"},{"key":"C","text":"限于当时的医疗水平难以诊疗"},{"key":"D","text":"患者或者其近亲属不配合医疗机构进行符合诊疗规范的诊疗但医务人员也存在一定过错"}],"answer":["A","B","C"],"raw":"4、患者在诊疗活动中受到损害，有下列情形之一的，医疗机构不承担赔偿责任（）\nA.患者或者其近亲属不配合医疗机构进行符合诊疗规范的诊疗\nB.医务人员在抢救生命垂危的患者等紧急情况下已经尽到合理诊疗义务\nC.限于当时的医疗水平难以诊疗\nD.患者或者其近亲属不配合医疗机构进行符合诊疗规范的诊疗但医务人员也存在一定过错\n答案：ABC"},{"id":"fagui-x-005","subject":"法律法规","section":"医疗法律法规","type":"x","no":"5","stem":"下列不属于侵犯患者隐私权的是(  )","options":[{"key":"A","text":"未经患者许可对其体检时让医学生观摩"},{"key":"B","text":"对疑难病例进行科室内探讨"},{"key":"C","text":"在征得患者允许下将其资料用于科研"},{"key":"D","text":"在患者病历上标注患有传染性疾病"}],"answer":["B","C","D"],"raw":"5、下列不属于侵犯患者隐私权的是(  )\nA.未经患者许可对其体检时让医学生观摩\nB.对疑难病例进行科室内探讨\nC.在征得患者允许下将其资料用于科研\nD.在患者病历上标注患有传染性疾病\n答案：BCD"},{"id":"fagui-x-006","subject":"法律法规","section":"医疗法律法规","type":"x","no":"6","stem":"如何预防个人信息泄露(  )","options":[{"key":"A","text":"发微博时对涉及个人信息的内容不作打码处理，直接发送"},{"key":"B","text":"增强个人安全意识，不将个人信息透露给无关人员"},{"key":"C","text":"快递包装先将个人信息销毁后再做进一步处理"},{"key":"D","text":"在网络上与陌生人聊天时不轻易透露自己的个人信息"}],"answer":["B","C","D"],"raw":"6、如何预防个人信息泄露(  )\nA.发微博时对涉及个人信息的内容不作打码处理，直接发送\nB.增强个人安全意识，不将个人信息透露给无关人员\nC.快递包装先将个人信息销毁后再做进一步处理\nD.在网络上与陌生人聊天时不轻易透露自己的个人信息\n答案：BCD"},{"id":"fagui-x-007","subject":"法律法规","section":"医疗法律法规","type":"x","no":"7","stem":"关于患者知情权问题，在患者处于昏迷等无法自主作出决定的状态或者病情不宜向患者说明等情形下，应当向患者的近亲属说明，患者的近亲属包括（）","options":[{"key":"A","text":"父母"},{"key":"B","text":"子女"},{"key":"C","text":"外甥、外甥女"},{"key":"D","text":"祖父母"}],"answer":["A","B","D"],"raw":"7、关于患者知情权问题，在患者处于昏迷等无法自主作出决定的状态或者病情不宜向患者说明等情形下，应当向患者的近亲属说明，患者的近亲属包括（）\nA.父母\nB.子女\nC.外甥、外甥女\nD.祖父母\n答案：ABD"},{"id":"fagui-x-008","subject":"法律法规","section":"医疗法律法规","type":"x","no":"8","stem":"公民接受医疗卫生服务，对 （  ） 等事项依法享有知情同意的权利（）","options":[{"key":"A","text":"病情"},{"key":"B","text":"诊疗方案"},{"key":"C","text":"医疗风险"},{"key":"D","text":"医疗费用"}],"answer":["A","B","C","D"],"raw":"8、公民接受医疗卫生服务，对 （  ） 等事项依法享有知情同意的权利（）\nA.病情\nB.诊疗方案\nC.医疗风险\nD.医疗费用\n答案：ABCD"},{"id":"fagui-x-009","subject":"法律法规","section":"医疗法律法规","type":"x","no":"9","stem":"《民法典》规定，因抢救生命垂危的患者等紧急情况，不能取得患者或者其近亲属意见的，经 （  ）批准，可以立即实施相应的医疗措施（）","options":[{"key":"A","text":"医疗机构负责人"},{"key":"B","text":"医疗机构授权的负责人"},{"key":"C","text":"急救医生"},{"key":"D","text":"急救护士"}],"answer":["A","B"],"raw":"9、《民法典》规定，因抢救生命垂危的患者等紧急情况，不能取得患者或者其近亲属意见的，经 （  ）批准，可以立即实施相应的医疗措施（）\nA.医疗机构负责人\nB.医疗机构授权的负责人\nC.急救医生\nD.急救护士\n答案：AB"},{"id":"fagui-x-010","subject":"法律法规","section":"医疗法律法规","type":"x","no":"10","stem":"《最高人民法院关于审理医疗损害责任纠纷案件适用法律若干问题的解释》规定：抢救生命垂危的患者等紧急情况且不能取得患者意见时，经法定人员批准，可以立即实施相应的医疗措施。以下属于不能取得患者或者其近亲属意见的包括：（）","options":[{"key":"A","text":"近亲属不明的"},{"key":"B","text":"不能及时联系到近亲属的"},{"key":"C","text":"近亲属拒绝发表意见的"},{"key":"D","text":"近亲属达不成一致意见的"}],"answer":["A","B","C","D"],"raw":"10、《最高人民法院关于审理医疗损害责任纠纷案件适用法律若干问题的解释》规定：抢救生命垂危的患者等紧急情况且不能取得患者意见时，经法定人员批准，可以立即实施相应的医疗措施。以下属于不能取得患者或者其近亲属意见的包括：（）\nA.近亲属不明的\nB.不能及时联系到近亲属的\nC.近亲属拒绝发表意见的\nD.近亲属达不成一致意见的\n答案：ABCD"},{"id":"fagui-x-011","subject":"法律法规","section":"医疗法律法规","type":"x","no":"11","stem":"医疗卫生人员有下列行为之一的 （  ） ，由县级以上人民政府卫生健康主管部门依照有关执业医师、护士管理和医疗纠纷预防处理等法律、行政法规的规定给予行政处罚：（）","options":[{"key":"A","text":"利用职务之便索要、非法收受财物或者牟取其他不正当利益；"},{"key":"B","text":"参照诊疗规范为患者进行诊疗；"},{"key":"C","text":"泄露公民个人健康信息；"},{"key":"D","text":"在开展医学研究或提供医疗卫生服务过程中未按照规定履行告知义务或者违反医学伦理规范。"}],"answer":["A","C","D"],"raw":"11、医疗卫生人员有下列行为之一的 （  ） ，由县级以上人民政府卫生健康主管部门依照有关执业医师、护士管理和医疗纠纷预防处理等法律、行政法规的规定给予行政处罚：（）\nA.利用职务之便索要、非法收受财物或者牟取其他不正当利益；\nB.参照诊疗规范为患者进行诊疗；\nC.泄露公民个人健康信息；\nD.在开展医学研究或提供医疗卫生服务过程中未按照规定履行告知义务或者违反医学伦理规范。\n答案：ACD"},{"id":"fagui-x-012","subject":"法律法规","section":"医疗法律法规","type":"x","no":"12","stem":"违反《中华人民共和国医师法》规定，医师在执业活动中有下列行为之一的 （  ） ，由县级以上人民政府卫生健康主管部门责令改正，给予警告；情节严重的，责令暂停六个月以上一年以下执业活动直至吊销医师执业证书：（）","options":[{"key":"A","text":"在提供医疗卫生服务或者开展医学临床研究中，未按照规定履行告知义务或者取得知情同意。"},{"key":"B","text":"对需要紧急救治的患者，拒绝急救处置，或者由于不负责任延误诊治。"},{"key":"C","text":"遇有自然灾害、事故灾难、公共卫生事件和社会安全事件等严重威胁人民生命健康的突发事件时，不服从卫生健康主管部门调遣。"},{"key":"D","text":"未按照规定报告有关情形。"},{"key":"E","text":"违反法律、法规、规章或者执业规范，造成医疗事故或者其他严重后果。"}],"answer":["A","B","C","D","E"],"raw":"12、违反《中华人民共和国医师法》规定，医师在执业活动中有下列行为之一的 （  ） ，由县级以上人民政府卫生健康主管部门责令改正，给予警告；情节严重的，责令暂停六个月以上一年以下执业活动直至吊销医师执业证书：（）\nA.在提供医疗卫生服务或者开展医学临床研究中，未按照规定履行告知义务或者取得知情同意。\nB.对需要紧急救治的患者，拒绝急救处置，或者由于不负责任延误诊治。\nC.遇有自然灾害、事故灾难、公共卫生事件和社会安全事件等严重威胁人民生命健康的突发事件时，不服从卫生健康主管部门调遣。\nD.未按照规定报告有关情形。\nE.违反法律、法规、规章或者执业规范，造成医疗事故或者其他严重后果。\n答案：ABCDE"},{"id":"fagui-x-013","subject":"法律法规","section":"医疗法律法规","type":"x","no":"13","stem":"发生医疗纠纷，医疗机构应当告知患者或者其近亲属下列事项:(）","options":[{"key":"A","text":"解决医疗纠纷的合法途径"},{"key":"B","text":"有关病历资料、现场实物封存和启封的规定"},{"key":"C","text":"有关病历资料查阅、复制的规定"},{"key":"D","text":"患者死亡的，应当告知其近亲属有关尸检的规定"}],"answer":["A","B","C","D"],"raw":"13、发生医疗纠纷，医疗机构应当告知患者或者其近亲属下列事项:(）\nA.解决医疗纠纷的合法途径\nB.有关病历资料、现场实物封存和启封的规定\nC.有关病历资料查阅、复制的规定\nD.患者死亡的，应当告知其近亲属有关尸检的规定\n答案：ABCD"},{"id":"fagui-x-014","subject":"法律法规","section":"医疗法律法规","type":"x","no":"14","stem":"《中华人民共和国传染病防治法》规定的传染病分为：（）","options":[{"key":"A","text":"甲类"},{"key":"B","text":"乙类"},{"key":"C","text":"丙类"},{"key":"D","text":"丁类"}],"answer":["A","B","C"],"raw":"14、《中华人民共和国传染病防治法》规定的传染病分为：（）\nA.甲类\nB.乙类\nC.丙类\nD.丁类\n答案：ABC"},{"id":"fagui-x-015","subject":"法律法规","section":"医疗法律法规","type":"x","no":"15","stem":"在执业活动中有下列情形之一的 （  ），医师应当按照有关规定及时向所在医疗卫生机构或者有关部门、机构报告：（）","options":[{"key":"A","text":"发现传染病、突发不明原因疾病或者异常健康事件"},{"key":"B","text":"发生或者发现医疗事故"},{"key":"C","text":"发现可能与药品、医疗器械有关的不良反应或者不良事件"},{"key":"D","text":"发现假药或者劣药"},{"key":"E","text":"发现患者涉嫌伤害事件或者非正常死亡"}],"answer":["A","B","C","D","E"],"raw":"15、在执业活动中有下列情形之一的 （  ），医师应当按照有关规定及时向所在医疗卫生机构或者有关部门、机构报告：（）\nA.发现传染病、突发不明原因疾病或者异常健康事件\nB.发生或者发现医疗事故\nC.发现可能与药品、医疗器械有关的不良反应或者不良事件\nD.发现假药或者劣药\nE.发现患者涉嫌伤害事件或者非正常死亡\n答案：ABCDE"},{"id":"fagui-tf-001","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"1","stem":"因药品、消毒产品、医疗器械的缺陷，或者输入不合格的血液造成患者损害的，患者只能向药品上市许可持有人、生产者、血液提供机构请求赔偿，不可以向医疗机构请求赔偿（  ）","options":[],"answer":["F"],"raw":"1、因药品、消毒产品、医疗器械的缺陷，或者输入不合格的血液造成患者损害的，患者只能向药品上市许可持有人、生产者、血液提供机构请求赔偿，不可以向医疗机构请求赔偿（  ）\n答案：错误"},{"id":"fagui-tf-002","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"2","stem":"发生医疗纠纷需要封存、启封病历资料的，应当在医患双方在场的情况下进行（  ）","options":[],"answer":["T"],"raw":"2、发生医疗纠纷需要封存、启封病历资料的，应当在医患双方在场的情况下进行（  ）\n答案：正确"},{"id":"fagui-tf-003","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"3","stem":"一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻（  ）","options":[],"answer":["T"],"raw":"3、一方患有重大疾病的，应当在结婚登记前如实告知另一方；不如实告知的，另一方可以向人民法院请求撤销婚姻（  ）\n答案：正确"},{"id":"fagui-tf-004","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"4","stem":"患者有权复印或者复制自己的门诊病历、住院志、体温单、医嘱单、化验单、医学影像检查资料、特殊检查同意书、手术同意书、手术及麻醉记录单、病理资料、护理记录等病历资料（  ）","options":[],"answer":["T"],"raw":"4、患者有权复印或者复制自己的门诊病历、住院志、体温单、医嘱单、化验单、医学影像检查资料、特殊检查同意书、手术同意书、手术及麻醉记录单、病理资料、护理记录等病历资料（  ）\n答案：正确"},{"id":"fagui-tf-005","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"5","stem":"医疗事故争议经医患双方当事人自行协商解决的，医疗机构不需要将有关情况报告当地卫生行政部门( )","options":[],"answer":["F"],"raw":"5、医疗事故争议经医患双方当事人自行协商解决的，医疗机构不需要将有关情况报告当地卫生行政部门( )\n答案：错误"},{"id":"fagui-tf-006","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"6","stem":"《处方管理办法》规定，为门急诊患者开具麻醉药品、第一类精神药品控缓释制剂，每张处方不得超过3日常用量（  ）","options":[],"answer":["F"],"raw":"6、《处方管理办法》规定，为门急诊患者开具麻醉药品、第一类精神药品控缓释制剂，每张处方不得超过3日常用量（  ）\n答案：错误"},{"id":"fagui-tf-007","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"7","stem":"参加术前讨论的人员应对手术指征、手术方案及步骤、术中可能出现的情况及对策、可能发生的意外及防范措施、术后观察及护理提出针对性意见和建议（）","options":[],"answer":["T"],"raw":"7、参加术前讨论的人员应对手术指征、手术方案及步骤、术中可能出现的情况及对策、可能发生的意外及防范措施、术后观察及护理提出针对性意见和建议（）\n答案：正确"},{"id":"fagui-tf-008","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"8","stem":"为保障公民临床急救用血的需要，国家提倡并指导择期手术的患者自身储血，动员家庭、亲友、所在单位以及社会互助献血(   )","options":[],"answer":["T"],"raw":"8、为保障公民临床急救用血的需要，国家提倡并指导择期手术的患者自身储血，动员家庭、亲友、所在单位以及社会互助献血(   )\n答案：正确"},{"id":"fagui-tf-009","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"9","stem":"发生重大灾害、事故、疾病流行或者其他意外情况时，医疗机构及其卫生技术人员必须服从县级以上人民政府卫生行政部门的调遣( )","options":[],"answer":["T"],"raw":"9、发生重大灾害、事故、疾病流行或者其他意外情况时，医疗机构及其卫生技术人员必须服从县级以上人民政府卫生行政部门的调遣( )\n答案：正确"},{"id":"fagui-tf-010","subject":"法律法规","section":"医疗法律法规","type":"tf","no":"10","stem":"发生医疗事故争议时，死亡病例讨论记录、疑难病例讨论记录、上级医师查房记录、会诊意见、病程记录应当在医患双方在场的情况下封存和启封。封存的病历资料由医疗机构保管，不可以是复印件（ ）","options":[],"answer":["F"],"raw":"10、发生医疗事故争议时，死亡病例讨论记录、疑难病例讨论记录、上级医师查房记录、会诊意见、病程记录应当在医患双方在场的情况下封存和启封。封存的病历资料由医疗机构保管，不可以是复印件（ ）\n答案：错误"},{"id":"fagui-a1-031","subject":"法律法规","section":"核心制度","type":"a1","no":"1","stem":"死亡病例，一般情况下应在病人死亡后多长时间内组织讨论？特殊病例（存在医疗纠纷的病例）应在死亡后多长时间组织讨论？(  )","options":[{"key":"A","text":"5天；24小时"},{"key":"B","text":"5天；3天"},{"key":"C","text":"1周；3天"},{"key":"D","text":"1周；24小时"}],"answer":["D"],"raw":"1、死亡病例，一般情况下应在病人死亡后多长时间内组织讨论？特殊病例（存在医疗纠纷的病例）应在死亡后多长时间组织讨论？(  )\nA.5天；24小时\nB.5天；3天\nC.1周；3天\nD.1周；24小时\n答案：D"},{"id":"fagui-a1-032","subject":"法律法规","section":"核心制度","type":"a1","no":"2","stem":"住院医师工作日每天至少查房几次？主治医师每周至少查房几次？(  )","options":[{"key":"A","text":"1次；3 次"},{"key":"B","text":"2次；3次"},{"key":"C","text":"3次；2次"},{"key":"D","text":"2次；2次"}],"answer":["B"],"raw":"2、住院医师工作日每天至少查房几次？主治医师每周至少查房几次？(  )\nA.1次；3 次\nB.2次；3次\nC.3次；2次\nD.2次；2次\n答案：B"},{"id":"fagui-a1-033","subject":"法律法规","section":"核心制度","type":"a1","no":"3","stem":"三级手术由____审批？ 四级手术由____审批？(  )","options":[{"key":"A","text":"科主任；医务部"},{"key":"B","text":"副主任医师；科主任"},{"key":"C","text":"医务部；业务院长"},{"key":"D","text":"医疗组长；医务部"}],"answer":["A"],"raw":"3、三级手术由____审批？ 四级手术由____审批？(  )\nA.科主任；医务部\nB.副主任医师；科主任\nC.医务部；业务院长\nD.医疗组长；医务部\n答案：A"},{"id":"fagui-a1-034","subject":"法律法规","section":"核心制度","type":"a1","no":"4","stem":"限制使用级的抗菌药物，住院病人由具有_______及以上专业技术资格医师开具处方或医嘱？(  )","options":[{"key":"A","text":"主治医师"},{"key":"B","text":"副主任医师"},{"key":"C","text":"科主任"},{"key":"D","text":"感染科住院医师"}],"answer":["B"],"raw":"4、限制使用级的抗菌药物，住院病人由具有_______及以上专业技术资格医师开具处方或医嘱？(  )\nA.主治医师\nB.副主任医师\nC.科主任\nD.感染科住院医师\n答案：B"},{"id":"fagui-a1-035","subject":"法律法规","section":"核心制度","type":"a1","no":"5","stem":"以下说法不正确的是？(  )","options":[{"key":"A","text":"首诊医师对患者的检查、诊断、治疗、抢救、转院和转科等工作负责。"},{"key":"B","text":"首诊医师下班前，应将患者移交接班医师，把患者的病情及需注意的事项交待清楚，并认真做好交接班记录。"},{"key":"C","text":"所有相关科室须执行危重病人抢救制度，协同抢救，不得推诿。"},{"key":"D","text":"对已接诊的病人，需要会诊及转诊的，首诊医师应先转到有关科室会诊及治疗，后写好病历。"}],"answer":["D"],"raw":"5、以下说法不正确的是？(  )\nA.首诊医师对患者的检查、诊断、治疗、抢救、转院和转科等工作负责。\nB.首诊医师下班前，应将患者移交接班医师，把患者的病情及需注意的事项交待清楚，并认真做好交接班记录。\nC.所有相关科室须执行危重病人抢救制度，协同抢救，不得推诿。\nD.对已接诊的病人，需要会诊及转诊的，首诊医师应先转到有关科室会诊及治疗，后写好病历。\n答案：D"},{"id":"fagui-a1-036","subject":"法律法规","section":"核心制度","type":"a1","no":"6","stem":"申请血量>1600ml应由哪一级审核签字？(  )","options":[{"key":"A","text":"副主任医师"},{"key":"B","text":"科主任"},{"key":"C","text":"医务部"},{"key":"D","text":"输血科主任"}],"answer":["C"],"raw":"6、申请血量>1600ml应由哪一级审核签字？(  )\nA.副主任医师\nB.科主任\nC.医务部\nD.输血科主任\n答案：C"},{"id":"fagui-a1-037","subject":"法律法规","section":"核心制度","type":"a1","no":"7","stem":"关于术前讨论描述最准确的是？(  )","options":[{"key":"A","text":"对重大、疑难及新开展的手术、科研项目手术需进行术前讨论。"},{"key":"B","text":"较大的毁损性手术，择期非计划再手术、有可能严重影响患者生命质量的手术需进行术前讨论。"},{"key":"C","text":"所有住院患者非急诊抢救的手术必须实施术前讨论，术者必须参加。"},{"key":"D","text":"需修改重要操作常规的手术及有严重基础疾病的手术需进行术前讨论。"}],"answer":["C"],"raw":"7、关于术前讨论描述最准确的是？(  )\nA.对重大、疑难及新开展的手术、科研项目手术需进行术前讨论。\nB.较大的毁损性手术，择期非计划再手术、有可能严重影响患者生命质量的手术需进行术前讨论。\nC.所有住院患者非急诊抢救的手术必须实施术前讨论，术者必须参加。\nD.需修改重要操作常规的手术及有严重基础疾病的手术需进行术前讨论。\n答案：C"},{"id":"fagui-a1-038","subject":"法律法规","section":"核心制度","type":"a1","no":"8","stem":"术前讨论内容不包括：(  )","options":[{"key":"A","text":"病情、诊断及其依据；"},{"key":"B","text":"手术适应证；手术方式、要点及注意事项；"},{"key":"C","text":"手术可能发生的危险、意外、并发症及其预防措施；替代方案；"},{"key":"D","text":"麻醉方式的选择，手术室的配合要求；术后注意事项，患者思想情况与要求等；检查术前各项准备工作的完成情况"},{"key":"E","text":"病人经济承受能力"}],"answer":["E"],"raw":"8、术前讨论内容不包括：(  )\nA.病情、诊断及其依据；\nB.手术适应证；手术方式、要点及注意事项；\nC.手术可能发生的危险、意外、并发症及其预防措施；替代方案；\nD.麻醉方式的选择，手术室的配合要求；术后注意事项，患者思想情况与要求等；检查术前各项准备工作的完成情况\nE.病人经济承受能力\n答案：E"},{"id":"fagui-a1-039","subject":"法律法规","section":"核心制度","type":"a1","no":"9","stem":"某患者在普通门诊就诊期间，突然发生病情变化，生命体征不稳定，需要抢救，首先应该由谁负责？(  )","options":[{"key":"A","text":"急诊科医生"},{"key":"B","text":"门诊部主任"},{"key":"C","text":"门诊接诊医师"},{"key":"D","text":"内科二线"}],"answer":["C"],"raw":"9、某患者在普通门诊就诊期间，突然发生病情变化，生命体征不稳定，需要抢救，首先应该由谁负责？(  )\nA.急诊科医生\nB.门诊部主任\nC.门诊接诊医师\nD.内科二线\n答案：C"},{"id":"fagui-a1-040","subject":"法律法规","section":"核心制度","type":"a1","no":"10","stem":"四级手术是指？(  )","options":[{"key":"A","text":"手术操作过程复杂，手术技术难度大，高风险的各种手术。"},{"key":"B","text":"手术过程较复杂，手术技术有一定难度，中等风险的各种重大手术。"},{"key":"C","text":"手术过程不复杂，手术技术难度不大，低风险的各种中等手术。"},{"key":"D","text":"手术过程简单，手术技术难度低的普通常见小手术。"}],"answer":["A"],"raw":"10、四级手术是指？(  )\nA.手术操作过程复杂，手术技术难度大，高风险的各种手术。\nB.手术过程较复杂，手术技术有一定难度，中等风险的各种重大手术。\nC.手术过程不复杂，手术技术难度不大，低风险的各种中等手术。\nD.手术过程简单，手术技术难度低的普通常见小手术。\n答案：A"},{"id":"fagui-a1-041","subject":"法律法规","section":"核心制度","type":"a1","no":"11","stem":"一般对轻度与局部感染患者应首先选用哪个级别抗菌药物进行治疗？(   )","options":[{"key":"A","text":"非限制使用级抗菌药物"},{"key":"B","text":"限制使用级抗菌药物"},{"key":"C","text":"特殊使用级抗菌药物"}],"answer":["A"],"raw":"11、一般对轻度与局部感染患者应首先选用哪个级别抗菌药物进行治疗？(   )\nA.非限制使用级抗菌药物\nB.限制使用级抗菌药物\nC.特殊使用级抗菌药物\n答案：A"},{"id":"fagui-a1-042","subject":"法律法规","section":"核心制度","type":"a1","no":"12","stem":"特殊手术按哪一级手术管理？(  )","options":[{"key":"A","text":"四级"},{"key":"B","text":"三级"},{"key":"C","text":"二级"},{"key":"D","text":"一级"}],"answer":["A"],"raw":"12、特殊手术按哪一级手术管理？(  )\nA.四级\nB.三级\nC.二级\nD.一级\n答案：A"},{"id":"fagui-a1-043","subject":"法律法规","section":"核心制度","type":"a1","no":"13","stem":"紧急情况下住院医师可越级使用高于权限的抗菌药物多长时间的用量？(  )","options":[{"key":"A","text":"1次"},{"key":"B","text":"1天"},{"key":"C","text":"2天"},{"key":"D","text":"3天"}],"answer":["B"],"raw":"13、紧急情况下住院医师可越级使用高于权限的抗菌药物多长时间的用量？(  )\nA.1次\nB.1天\nC.2天\nD.3天\n答案：B"},{"id":"fagui-a1-044","subject":"法律法规","section":"核心制度","type":"a1","no":"14","stem":"嘉中病历书写“十条”包括以下内容，除外(  )","options":[{"key":"A","text":"出现与本患者不符合的病历内容（如姓名、性别、主诉等）。"},{"key":"B","text":"医疗文书出现解剖部位（如左右、上下、单双侧）写错。"},{"key":"C","text":"患方未签署需要告知的相关知情同意书（手术、输血、有创操作、病情告知、术式改变等）。"},{"key":"D","text":"抢救记录未在抢救结束8小时内完成（有抢救医嘱的）。"}],"answer":["D"],"raw":"14、嘉中病历书写“十条”包括以下内容，除外(  )\nA.出现与本患者不符合的病历内容（如姓名、性别、主诉等）。\nB.医疗文书出现解剖部位（如左右、上下、单双侧）写错。\nC.患方未签署需要告知的相关知情同意书（手术、输血、有创操作、病情告知、术式改变等）。\nD.抢救记录未在抢救结束8小时内完成（有抢救医嘱的）。\n答案：D"},{"id":"fagui-a1-045","subject":"法律法规","section":"核心制度","type":"a1","no":"15","stem":"急诊会诊，相关科室在接到会诊通知后，应在多长时间内到位？普通会诊，相关科室在接到会诊通知后，应在多长时间内到位？(  )","options":[{"key":"A","text":"10分钟；48小时"},{"key":"B","text":"20分钟；24小时"},{"key":"C","text":"10分钟；24小时"},{"key":"D","text":"20分钟；48小时"}],"answer":["C"],"raw":"15、急诊会诊，相关科室在接到会诊通知后，应在多长时间内到位？普通会诊，相关科室在接到会诊通知后，应在多长时间内到位？(  )\nA.10分钟；48小时\nB.20分钟；24小时\nC.10分钟；24小时\nD.20分钟；48小时\n答案：C"},{"id":"fagui-a1-046","subject":"法律法规","section":"核心制度","type":"a1","no":"16","stem":"我院RRT、创伤中心的电话分别是：(  )","options":[{"key":"A","text":"661111、664000"},{"key":"B","text":"663000、665000"},{"key":"C","text":"663000、669999（日间）/662222（夜间由外科二线兼）"},{"key":"D","text":"664000、662222"}],"answer":["C"],"raw":"16、我院RRT、创伤中心的电话分别是：(  )\nA.661111、664000\nB.663000、665000\nC.663000、669999（日间）/662222（夜间由外科二线兼）\nD.664000、662222\n答案：C"},{"id":"fagui-a1-047","subject":"法律法规","section":"核心制度","type":"a1","no":"17","stem":"关于医师值班、交接班正确的是：(  )","options":[{"key":"A","text":"接班人员未及时到岗，交班人员到时间后可以下班"},{"key":"B","text":"值班医师因急会诊离开岗位未告知护士去向"},{"key":"C","text":"值班医师将值班情况记入交接班本，接班人员无须签字确认"},{"key":"D","text":"医技科室值班人员应将设备运行情况记录签字后交班"}],"answer":["D"],"raw":"17、关于医师值班、交接班正确的是：(  )\nA.接班人员未及时到岗，交班人员到时间后可以下班\nB.值班医师因急会诊离开岗位未告知护士去向\nC.值班医师将值班情况记入交接班本，接班人员无须签字确认\nD.医技科室值班人员应将设备运行情况记录签字后交班\n答案：D"},{"id":"fagui-a1-048","subject":"法律法规","section":"核心制度","type":"a1","no":"18","stem":"下列做法不符合新技术准入制度的是：(  )","options":[{"key":"A","text":"申报资料中有新技术开展实施方案和风险预案"},{"key":"B","text":"新业务、新技术的实施须同患者签署相应协议，并应履行相应告知义务"},{"key":"C","text":"可能引起严重不良后果的新技术也可以应用"},{"key":"D","text":"限制性新技术应在限定范围内应用。"}],"answer":["C"],"raw":"18、下列做法不符合新技术准入制度的是：(  )\nA.申报资料中有新技术开展实施方案和风险预案\nB.新业务、新技术的实施须同患者签署相应协议，并应履行相应告知义务\nC.可能引起严重不良后果的新技术也可以应用\nD.限制性新技术应在限定范围内应用。\n答案：C"},{"id":"fagui-a1-049","subject":"法律法规","section":"核心制度","type":"a1","no":"19","stem":"不属于医疗核心制度的是：(  )","options":[{"key":"A","text":"首诊负责制度"},{"key":"B","text":"查对制度"},{"key":"C","text":"病情评估制度"},{"key":"D","text":"病历管理制度"}],"answer":["C"],"raw":"19、不属于医疗核心制度的是：(  )\nA.首诊负责制度\nB.查对制度\nC.病情评估制度\nD.病历管理制度\n答案：C"},{"id":"fagui-a1-050","subject":"法律法规","section":"核心制度","type":"a1","no":"20","stem":"抢救完成后_____小时内应当将抢救记录记入病历，记录时间应具体到分钟。","options":[{"key":"A","text":"6"},{"key":"B","text":"5"},{"key":"C","text":"3"},{"key":"D","text":"2"}],"answer":["A"],"raw":"20、抢救完成后_____小时内应当将抢救记录记入病历，记录时间应具体到分钟。\nA.6\nB.5\nC.3\nD.2\n答案：A"},{"id":"fagui-a1-051","subject":"法律法规","section":"核心制度","type":"a1","no":"21","stem":"急诊死亡病历由医院负责保管不少于多少时间？ 住院病历由医院病案室负责保管不少于多少时间？(  )","options":[{"key":"A","text":"10年；15年"},{"key":"B","text":"15年；30年"},{"key":"C","text":"10年；20年"},{"key":"D","text":"15年；20年"}],"answer":["B"],"raw":"21、急诊死亡病历由医院负责保管不少于多少时间？ 住院病历由医院病案室负责保管不少于多少时间？(  )\nA.10年；15年\nB.15年；30年\nC.10年；20年\nD.15年；20年\n答案：B"},{"id":"fagui-a1-052","subject":"法律法规","section":"核心制度","type":"a1","no":"22","stem":"在各项诊疗活动，须至少使用两种以上方式核对患者身份，以下哪种核对方式是错误的？（  ）","options":[{"key":"A","text":"姓名加住院号"},{"key":"B","text":"姓名加门诊卡号"},{"key":"C","text":"姓名加床号"}],"answer":["C"],"raw":"22、在各项诊疗活动，须至少使用两种以上方式核对患者身份，以下哪种核对方式是错误的？（  ）\nA.姓名加住院号\nB.姓名加门诊卡号\nC.姓名加床号\n答案：C"},{"id":"fagui-a1-053","subject":"法律法规","section":"核心制度","type":"a1","no":"23","stem":"肌钙蛋白T的危急值（  ）","options":[{"key":"A","text":"≥52pg/ml"},{"key":"B","text":"≥52ng/L"},{"key":"C","text":"＞52ng/L"},{"key":"D","text":"≥0.4ng/ml"}],"answer":["B"],"raw":"23、肌钙蛋白T的危急值（  ）\nA.≥52pg/ml\nB.≥52ng/L\nC.＞52ng/L\nD.≥0.4ng/ml\n答案：B"},{"id":"fagui-x-016","subject":"法律法规","section":"核心制度","type":"x","no":"1","stem":"以下哪几项是2023版的危急值？（  ）","options":[{"key":"A","text":"血常规HGB<50g/L。"},{"key":"B","text":"放射影像检查为空气栓塞。"},{"key":"C","text":"心电图提示室性心动过速心室率≥150次/min，持续≥30s以上。"},{"key":"D","text":"超声检查提示异位妊娠。"}],"answer":["A","B","C"],"raw":"1、以下哪几项是2023版的危急值？（  ）\nA.血常规HGB<50g/L。\nB.放射影像检查为空气栓塞。\nC.心电图提示室性心动过速心室率≥150次/min，持续≥30s以上。\nD.超声检查提示异位妊娠。\n答案：ABC"},{"id":"fagui-x-017","subject":"法律法规","section":"核心制度","type":"x","no":"2","stem":"以下哪几项属于疑难病例的讨论范围？（  ）","options":[{"key":"A","text":"患者当前有明确的症状体征或异常检验检查结果，但没有明确的诊断或诊疗方案难以确定。"},{"key":"B","text":"疾病在应有明确疗效的周期内未能达到预期疗效。"},{"key":"C","text":"31天非计划再次住院；非计划再次手术。"},{"key":"D","text":"诊疗过程中存在过失或告知义务未尽，易引起医疗争议的情况"},{"key":"E","text":"患者的诊疗效果与患方预期不符，存在医疗纠纷倾向。"}],"answer":["A","B","C","D","E"],"raw":"2、以下哪几项属于疑难病例的讨论范围？（  ）\nA.患者当前有明确的症状体征或异常检验检查结果，但没有明确的诊断或诊疗方案难以确定。\nB.疾病在应有明确疗效的周期内未能达到预期疗效。\nC.31天非计划再次住院；非计划再次手术。\nD.诊疗过程中存在过失或告知义务未尽，易引起医疗争议的情况\nE.患者的诊疗效果与患方预期不符，存在医疗纠纷倾向。\n答案：ABCDE"},{"id":"fagui-x-018","subject":"法律法规","section":"核心制度","type":"x","no":"3","stem":"关于交接班制度正确的有哪些？（  ）","options":[{"key":"A","text":"各科室主班医生在下班前将新病人、急危重病人（包括当日有检验、检查危急值患者）、   手术及侵入性操作病人等重点病人病情和处理事项向值班医生做好交班工作。"},{"key":"B","text":"每日晨交班，值班医师将新病员和重点病员情况和处理向主管医师口头交接清楚。"},{"key":"C","text":"四级手术患者手术当日、I级护理患者、急危重患者必须床旁交班，交接内容主要包括病情介绍、目前诊断及处理情况等。"},{"key":"D","text":"交接班内容专册记录在交接班记录本，并由交班人员和接班人员共同签字确认、并注明签字时间。"}],"answer":["A","B","D"],"raw":"3、关于交接班制度正确的有哪些？（  ）\nA.各科室主班医生在下班前将新病人、急危重病人（包括当日有检验、检查危急值患者）、   手术及侵入性操作病人等重点病人病情和处理事项向值班医生做好交班工作。\nB.每日晨交班，值班医师将新病员和重点病员情况和处理向主管医师口头交接清楚。\nC.四级手术患者手术当日、I级护理患者、急危重患者必须床旁交班，交接内容主要包括病情介绍、目前诊断及处理情况等。\nD.交接班内容专册记录在交接班记录本，并由交班人员和接班人员共同签字确认、并注明签字时间。\n答案：ABD"},{"id":"fagui-x-019","subject":"法律法规","section":"核心制度","type":"x","no":"4","stem":"住院医师查房的具体要求正确的有哪些？（  ）","options":[{"key":"A","text":"住院医师对新入院病员须及时查看。"},{"key":"B","text":"工作日每天至少查房2次；"},{"key":"C","text":"非工作日每天至少查房1次。"},{"key":"D","text":"住院医师不能单独查房。"}],"answer":["A","B","C"],"raw":"4、住院医师查房的具体要求正确的有哪些？（  ）\nA.住院医师对新入院病员须及时查看。\nB.工作日每天至少查房2次；\nC.非工作日每天至少查房1次。\nD.住院医师不能单独查房。\n答案：ABC"},{"id":"fagui-x-020","subject":"法律法规","section":"核心制度","type":"x","no":"5","stem":"手术安全核查是由哪三方开展的核查？（  ）","options":[{"key":"A","text":"手术医生"},{"key":"B","text":"麻醉医生"},{"key":"C","text":"手术室护士"},{"key":"D","text":"实习医生"}],"answer":["A","B","C"],"raw":"5、手术安全核查是由哪三方开展的核查？（  ）\nA.手术医生\nB.麻醉医生\nC.手术室护士\nD.实习医生\n答案：ABC"},{"id":"fagui-x-021","subject":"法律法规","section":"核心制度","type":"x","no":"6","stem":"手术安全核查的时机有哪些？（  ）","options":[{"key":"A","text":"麻醉实施前"},{"key":"B","text":"手术切皮前"},{"key":"C","text":"手术开始前"},{"key":"D","text":"患者离开手术室前"}],"answer":["A","C","D"],"raw":"6、手术安全核查的时机有哪些？（  ）\nA.麻醉实施前\nB.手术切皮前\nC.手术开始前\nD.患者离开手术室前\n答案：ACD"},{"id":"fagui-x-022","subject":"法律法规","section":"核心制度","type":"x","no":"7","stem":"以下关于抗菌药物分级管理制度正确的有哪些？（  ）","options":[{"key":"A","text":"非限制使用级抗菌药物：各级医师经考核授权后可使用。"},{"key":"B","text":"限制使用级的抗菌药物：门急诊病人由中级以上专业技术职务任职资格医师开具处方或医嘱。"},{"key":"C","text":"特殊使用级的抗菌药物，须经医院药事管理委员会认定的专家会诊同意后，由具有相应处方权的医师开具处方（医嘱），可在门诊使用。"},{"key":"D","text":"感染性疾病科、呼吸科、重症医学科专业医师在使用限制使用级抗菌药物、特殊使用级抗菌药物时，其专业技术职务任职资格要求可降低一个等级。"}],"answer":["A","B","D"],"raw":"7、以下关于抗菌药物分级管理制度正确的有哪些？（  ）\nA.非限制使用级抗菌药物：各级医师经考核授权后可使用。\nB.限制使用级的抗菌药物：门急诊病人由中级以上专业技术职务任职资格医师开具处方或医嘱。\nC.特殊使用级的抗菌药物，须经医院药事管理委员会认定的专家会诊同意后，由具有相应处方权的医师开具处方（医嘱），可在门诊使用。\nD.感染性疾病科、呼吸科、重症医学科专业医师在使用限制使用级抗菌药物、特殊使用级抗菌药物时，其专业技术职务任职资格要求可降低一个等级。\n答案：ABD"},{"id":"fagui-x-023","subject":"法律法规","section":"核心制度","type":"x","no":"8","stem":"手术安全核查是保障____、_____、_____、____4个基本要求的必要手段。","options":[{"key":"A","text":"正确的患者"},{"key":"B","text":"正确的麻醉"},{"key":"C","text":"正确的手术部位"},{"key":"D","text":"正确的手术方式"},{"key":"E","text":"正确的医生"}],"answer":["A","B","C","D"],"raw":"8、手术安全核查是保障____、_____、_____、____4个基本要求的必要手段。\nA.正确的患者\nB.正确的麻醉\nC.正确的手术部位\nD.正确的手术方式\nE.正确的医生\n答案：ABCD"},{"id":"fagui-x-024","subject":"法律法规","section":"核心制度","type":"x","no":"9","stem":"下列三级医师查房制度说法正确的是：","options":[{"key":"A","text":"三个不同级别的医师可以包括但不限于主任医师或副主任医师-主治医师-住院医师。"},{"key":"B","text":"科主任、（副）主任医师每周至少查房 2 次，对危重患者，及时查房。"},{"key":"C","text":"三级医师查房时原则上医疗组全体医师、责任护士等有关人员均应参加。"},{"key":"D","text":"主治医师对新入院患者首次查房应于24 小时内完成，一般查房每周至少 3 次。"}],"answer":["A","B","C"],"raw":"9、下列三级医师查房制度说法正确的是：\nA.三个不同级别的医师可以包括但不限于主任医师或副主任医师-主治医师-住院医师。\nB.科主任、（副）主任医师每周至少查房 2 次，对危重患者，及时查房。\nC.三级医师查房时原则上医疗组全体医师、责任护士等有关人员均应参加。\nD.主治医师对新入院患者首次查房应于24 小时内完成，一般查房每周至少 3 次。\n答案：ABC"},{"id":"fagui-x-025","subject":"法律法规","section":"核心制度","type":"x","no":"10","stem":"医疗技术管理委员会对新技术、新项目进行审核内容包括：(  )","options":[{"key":"A","text":"该项技术项目是否在医院执业许可证允许开展的诊疗科目范围内以及开展该技术项目的成员是否具有相应资质。申报者资质，新技术、新项目是否符合国家相关法律法规和规章制度、诊疗规范及操作常规。"},{"key":"B","text":"参与人员的专业能力和职称及针对该项目的分工及职责，是否能够满足开展该新技术新项目的需要。"},{"key":"C","text":"是否涉及院感高危因素以及相应的院感安全保障措施及应急处理预案进行审查。"},{"key":"D","text":"申报技术项目所涉及的相关设备耗材使用情况进行审查（包括需要应用设备是否为现有设备,应用的耗材种类、规格、型号、价格及是否在招标范围等情况）"}],"answer":["A","B","C","D"],"raw":"10、医疗技术管理委员会对新技术、新项目进行审核内容包括：(  )\nA.该项技术项目是否在医院执业许可证允许开展的诊疗科目范围内以及开展该技术项目的成员是否具有相应资质。申报者资质，新技术、新项目是否符合国家相关法律法规和规章制度、诊疗规范及操作常规。\nB.参与人员的专业能力和职称及针对该项目的分工及职责，是否能够满足开展该新技术新项目的需要。\nC.是否涉及院感高危因素以及相应的院感安全保障措施及应急处理预案进行审查。\nD.申报技术项目所涉及的相关设备耗材使用情况进行审查（包括需要应用设备是否为现有设备,应用的耗材种类、规格、型号、价格及是否在招标范围等情况）\n答案：ABCD"},{"id":"fagui-x-026","subject":"法律法规","section":"核心制度","type":"x","no":"11","stem":"输注新鲜冰冻血浆的指征有哪些？(  )","options":[{"key":"A","text":"PT、INR、APTT 时间>正常 1.5 倍，创面弥漫性渗血。"},{"key":"B","text":"病史或临床过程表现有先天性或获得性凝血功能障碍。"},{"key":"C","text":"输入超过人体一个血容量的血液。"},{"key":"D","text":"紧急对抗华法令的抗凝血作用。"}],"answer":["A","B","C","D"],"raw":"11、输注新鲜冰冻血浆的指征有哪些？(  )\nA.PT、INR、APTT 时间>正常 1.5 倍，创面弥漫性渗血。\nB.病史或临床过程表现有先天性或获得性凝血功能障碍。\nC.输入超过人体一个血容量的血液。\nD.紧急对抗华法令的抗凝血作用。\n答案：ABCD"},{"id":"fagui-x-027","subject":"法律法规","section":"核心制度","type":"x","no":"12","stem":"信息安全管理制度在诊疗信息管理与隐私保护方面有哪些措施？(       )","options":[{"key":"A","text":"启用防统方设备、桌面管理系统、准入设备管理、杀毒软件、的内网准入环境，配置补  丁自动更新，加强网络环境安全。"},{"key":"B","text":"加强对患者的隐私保护，患者姓名脱敏处理，敏感科室启用屏幕保护，检验、检查  报告凭条码打印，手机端查阅体检信息进行短信验证等。"},{"key":"C","text":"通过机房门禁系统来防范外来人员进入、通过每周巡检来确保在用设备的健康、通过环  境监控来监测机房温湿度安全。"},{"key":"D","text":"信息科负责保障“防统方”系统的网络通畅，使用和维护由纪委负责，监视、记录、跟踪设备用于医院局域网中的所有计算机上。"}],"answer":["A","B","C","D"],"raw":"12、信息安全管理制度在诊疗信息管理与隐私保护方面有哪些措施？(       )\nA.启用防统方设备、桌面管理系统、准入设备管理、杀毒软件、的内网准入环境，配置补  丁自动更新，加强网络环境安全。\nB.加强对患者的隐私保护，患者姓名脱敏处理，敏感科室启用屏幕保护，检验、检查  报告凭条码打印，手机端查阅体检信息进行短信验证等。\nC.通过机房门禁系统来防范外来人员进入、通过每周巡检来确保在用设备的健康、通过环  境监控来监测机房温湿度安全。\nD.信息科负责保障“防统方”系统的网络通畅，使用和维护由纪委负责，监视、记录、跟踪设备用于医院局域网中的所有计算机上。\n答案：ABCD"},{"id":"yuangan-a1-001","subject":"院感","section":"院感知识","type":"a1","no":"1","stem":"《传染病防治法》规定的甲类传染病是（  ）","options":[{"key":"A","text":"艾滋病、新型冠状病毒肺炎"},{"key":"B","text":"鼠疫、霍乱"},{"key":"C","text":"传染性非典型肺炎、炭疽"},{"key":"D","text":"病毒性肝炎、登革热"}],"answer":["B"],"raw":"1、《传染病防治法》规定的甲类传染病是（  ）\nA. 艾滋病、新型冠状病毒肺炎\nB. 鼠疫、霍乱\nC. 传染性非典型肺炎、炭疽\nD. 病毒性肝炎、登革热\n答案：B"},{"id":"yuangan-a1-002","subject":"院感","section":"院感知识","type":"a1","no":"2","stem":"下列哪项不是脏污织物收集及暂存的要求：（  ）","options":[{"key":"A","text":"病区暂存的储存桶应一周至少清洗一次"},{"key":"B","text":"采用污染的床单等污染物来包裹"},{"key":"C","text":"严禁在病房及过道清点"},{"key":"D","text":"暂存时间不超过48小时"}],"answer":["B"],"raw":"2、下列哪项不是脏污织物收集及暂存的要求：（  ）\nA.病区暂存的储存桶应一周至少清洗一次\nB.采用污染的床单等污染物来包裹\nC.严禁在病房及过道清点\nD.暂存时间不超过48小时\n答案：B"},{"id":"yuangan-a1-003","subject":"院感","section":"院感知识","type":"a1","no":"3","stem":"下列哪项不是感染性织物洗涤消毒的原则：(  )","options":[{"key":"A","text":"专机洗涤.消毒"},{"key":"B","text":"先消毒后洗涤"},{"key":"C","text":"首选热洗涤方法"},{"key":"D","text":"首选冷洗涤方法"}],"answer":["D"],"raw":"3、下列哪项不是感染性织物洗涤消毒的原则：(  )\nA.专机洗涤.消毒\nB.先消毒后洗涤\nC.首选热洗涤方法\nD.首选冷洗涤方法\n答案：D"},{"id":"yuangan-a1-004","subject":"院感","section":"院感知识","type":"a1","no":"4","stem":"小包装的棉球.纱布等一经打开多少时间内有效（  ）","options":[{"key":"A","text":"8小时"},{"key":"B","text":"24小时"},{"key":"C","text":"1周"},{"key":"D","text":"1个月"}],"answer":["B"],"raw":"4、小包装的棉球.纱布等一经打开多少时间内有效（  ）\nA.8小时\nB.24小时\nC.1周\nD.1个月\n答案：B"},{"id":"yuangan-a1-005","subject":"院感","section":"院感知识","type":"a1","no":"5","stem":"盛装的医疗废物达到包装物或者容器的多少时，应当进行有效的封口。（  ）","options":[{"key":"A","text":"1/2"},{"key":"B","text":"2/3"},{"key":"C","text":"3/4"},{"key":"D","text":"为了节约应装满"}],"answer":["C"],"raw":"5、盛装的医疗废物达到包装物或者容器的多少时，应当进行有效的封口。（  ）\nA.1/2\nB.2/3\nC.3/4\nD.为了节约应装满\n答案：C"},{"id":"yuangan-a1-006","subject":"院感","section":"院感知识","type":"a1","no":"6","stem":"病人使用过的吸氧面罩属于哪种医疗废物？（  ）","options":[{"key":"A","text":"感染性废物"},{"key":"B","text":"病理性废物"},{"key":"C","text":"损伤性废物"},{"key":"D","text":"药物性废物"}],"answer":["A"],"raw":"6、病人使用过的吸氧面罩属于哪种医疗废物？（  ）\nA.感染性废物\nB.病理性废物\nC.损伤性废物\nD.药物性废物\n答案：A"},{"id":"yuangan-a1-007","subject":"院感","section":"院感知识","type":"a1","no":"7","stem":"成人外周静脉导管多久更换一次：(  )","options":[{"key":"A","text":"1周"},{"key":"B","text":"2周"},{"key":"C","text":"3-4天"},{"key":"D","text":"7-10天"}],"answer":["C"],"raw":"7、成人外周静脉导管多久更换一次：(  )\nA.1周\nB.2周\nC.3-4天\nD.7-10天\n答案：C"},{"id":"yuangan-a1-008","subject":"院感","section":"院感知识","type":"a1","no":"8","stem":"多重耐药菌患者采取的隔离措施是(  )","options":[{"key":"A","text":"标准预防+空气隔离"},{"key":"B","text":"标准预防+飞沫隔离"},{"key":"C","text":"标准预防+接触隔离"},{"key":"D","text":"标准预防+保护性隔离"}],"answer":["C"],"raw":"8、多重耐药菌患者采取的隔离措施是(  )\nA．标准预防+空气隔离\nB．标准预防+飞沫隔离\nC．标准预防+接触隔离\nD．标准预防+保护性隔离\n答案：C"},{"id":"yuangan-a1-009","subject":"院感","section":"院感知识","type":"a1","no":"9","stem":"医疗机构内医疗废物暂时贮存时间不得超过几天(  )","options":[{"key":"A","text":"1天"},{"key":"B","text":"2天"},{"key":"C","text":"3天"},{"key":"D","text":"4天"}],"answer":["B"],"raw":"9、医疗机构内医疗废物暂时贮存时间不得超过几天(  )\nA.1天\nB.2天\nC.3天\nD.4天\n答案：B"},{"id":"yuangan-a1-010","subject":"院感","section":"院感知识","type":"a1","no":"10","stem":"一旦发生HIV暴露，除局部应做紧急处理外，最好在几小时内预防用药（  ）","options":[{"key":"A","text":"4"},{"key":"B","text":"8"},{"key":"C","text":"12"},{"key":"D","text":"24"}],"answer":["A"],"raw":"10、一旦发生HIV暴露，除局部应做紧急处理外，最好在几小时内预防用药（  ）\nA.4\nB.8\nC.12\nD.24\n答案：A"},{"id":"yuangan-a1-011","subject":"院感","section":"院感知识","type":"a1","no":"11","stem":"医生为病人进行胸穿.腰穿等操作时应选戴：（  ）","options":[{"key":"A","text":"一次性薄膜手套"},{"key":"B","text":"一次性乳胶手套"},{"key":"C","text":"一次性灭菌外科手套"},{"key":"D","text":"丁腈手套"}],"answer":["C"],"raw":"11、医生为病人进行胸穿.腰穿等操作时应选戴：（  ）\nA.一次性薄膜手套\nB.一次性乳胶手套\nC.一次性灭菌外科手套\nD.丁腈手套\n答案：C"},{"id":"yuangan-a1-012","subject":"院感","section":"院感知识","type":"a1","no":"12","stem":"以下关于标本留取方法描述错误的是：（  ）","options":[{"key":"A","text":"留置尿管留取尿培养标本应消毒尿管近心端，弃去前段尿液用无菌注射器抽取尿液"},{"key":"B","text":"开放性伤口采集创面标本应先用消毒剂进行创面消毒后再采取病灶深部的脓液或分泌物"},{"key":"C","text":"标本尽量在抗菌药物使用前采集，并严格执行无菌操作，采集后立即送实验室"},{"key":"D","text":"痰培养最好是通过人工气道吸引采集，如让病人自行留取的宜采集清晨漱口后第一次咳出的深部痰液"}],"answer":["B"],"raw":"12、以下关于标本留取方法描述错误的是：（  ）\nA.留置尿管留取尿培养标本应消毒尿管近心端，弃去前段尿液用无菌注射器抽取尿液\nB.开放性伤口采集创面标本应先用消毒剂进行创面消毒后再采取病灶深部的脓液或分泌物\nC.标本尽量在抗菌药物使用前采集，并严格执行无菌操作，采集后立即送实验室\nD.痰培养最好是通过人工气道吸引采集，如让病人自行留取的宜采集清晨漱口后第一次咳出的深部痰液\n答案：B"},{"id":"yuangan-a1-013","subject":"院感","section":"院感知识","type":"a1","no":"13","stem":"现在有三个病人需要换药：甲：下肢肌腱清创缝合术后；乙：胫骨骨折切开内固定术后；丙：腰椎术后切口MRSA感染换药，你如果安排换药次序?（  ）","options":[{"key":"A","text":"乙→甲→丙"},{"key":"B","text":"甲→丙→乙"},{"key":"C","text":"乙→丙→甲"},{"key":"D","text":"丙→甲→乙"}],"answer":["A"],"raw":"13、现在有三个病人需要换药：甲：下肢肌腱清创缝合术后；乙：胫骨骨折切开内固定术后；丙：腰椎术后切口MRSA感染换药，你如果安排换药次序?（  ）\nA.乙→甲→丙\nB.甲→丙→乙\nC.乙→丙→甲\nD.丙→甲→乙\n答案：A"},{"id":"yuangan-a1-014","subject":"院感","section":"院感知识","type":"a1","no":"14","stem":"在对环境表面进行清洁消毒时，以下做法正确的是？（  ）","options":[{"key":"A","text":"清洁工作按照由上到下，由里到外.由轻度污染到重度污染的顺序进行"},{"key":"B","text":"呼吸机控制面板可使用含季铵盐类的消毒湿巾擦拭"},{"key":"C","text":"进行吸痰操作后，应立即对周边环境表面进行清洁消毒"},{"key":"D","text":"以上都是"}],"answer":["D"],"raw":"14、在对环境表面进行清洁消毒时，以下做法正确的是？（  ）\nA.清洁工作按照由上到下，由里到外.由轻度污染到重度污染的顺序进行\nB.呼吸机控制面板可使用含季铵盐类的消毒湿巾擦拭\nC.进行吸痰操作后，应立即对周边环境表面进行清洁消毒\nD.以上都是\n答案：D"},{"id":"yuangan-a1-015","subject":"院感","section":"院感知识","type":"a1","no":"15","stem":"接触结核病人时医护人员应如何佩戴口罩？（  ）","options":[{"key":"A","text":"一次性普通医用口罩"},{"key":"B","text":"医用外科口罩"},{"key":"C","text":"医用防护口罩"},{"key":"D","text":"二个医用外科口罩"}],"answer":["C"],"raw":"15、接触结核病人时医护人员应如何佩戴口罩？（  ）\nA.一次性普通医用口罩\nB.医用外科口罩\nC.医用防护口罩\nD.二个医用外科口罩\n答案：C"},{"id":"yuangan-a1-016","subject":"院感","section":"院感知识","type":"a1","no":"16","stem":"耐热.耐湿的物品应首选什么灭菌方法：（  ）","options":[{"key":"A","text":"化学消毒剂浸泡"},{"key":"B","text":"压力蒸汽灭菌"},{"key":"C","text":"环氧乙烷灭菌"},{"key":"D","text":"低温等离子灭菌"}],"answer":["B"],"raw":"16、耐热.耐湿的物品应首选什么灭菌方法：（  ）\nA.化学消毒剂浸泡\nB.压力蒸汽灭菌\nC.环氧乙烷灭菌\nD.低温等离子灭菌\n答案：B"},{"id":"yuangan-a1-017","subject":"院感","section":"院感知识","type":"a1","no":"17","stem":"医生或护士发现病区内有3例及以上医院感染聚集性应立即报告科主任、护士长，科室应在几小时内报告感控与公共卫生部（  ）","options":[{"key":"A","text":"4"},{"key":"B","text":"8"},{"key":"C","text":"24"},{"key":"D","text":"48"}],"answer":["C"],"raw":"17、医生或护士发现病区内有3例及以上医院感染聚集性应立即报告科主任、护士长，科室应在几小时内报告感控与公共卫生部（  ）\nA.4\nB.8\nC.24\nD.48\n答案：C"},{"id":"yuangan-a1-018","subject":"院感","section":"院感知识","type":"a1","no":"18","stem":"进行外科手消毒后监测的细菌菌落总数应达到多少？（  ）","options":[{"key":"A","text":"≤5cfu/cm2"},{"key":"B","text":"≤10cfu/cm2"},{"key":"C","text":"≤50cfu/cm2"},{"key":"D","text":"≤100cfu/cm2"}],"answer":["A"],"raw":"18、进行外科手消毒后监测的细菌菌落总数应达到多少？（  ）\nA.≤5cfu/cm2\nB.≤10cfu/cm2\nC.≤50cfu/cm2\nD.≤100cfu/cm2\n答案：A"},{"id":"yuangan-a1-019","subject":"院感","section":"院感知识","type":"a1","no":"19","stem":"普通门诊空气净化方案首选（  ）","options":[{"key":"A","text":"紫外线消毒"},{"key":"B","text":"空气净化器消毒"},{"key":"C","text":"中央空调空气消毒机"},{"key":"D","text":"自然通风"}],"answer":["D"],"raw":"19、普通门诊空气净化方案首选（  ）\nA.紫外线消毒\nB.空气净化器消毒\nC.中央空调空气消毒机\nD.自然通风\n答案：D"},{"id":"yuangan-a1-020","subject":"院感","section":"院感知识","type":"a1","no":"20","stem":"抽出的药液和配制好的静脉输注用无菌液体要求在多长时间内使用？（  ）","options":[{"key":"A","text":"≤2小时"},{"key":"B","text":"≤4小时"},{"key":"C","text":"≤8小时"},{"key":"D","text":"≤24小时"}],"answer":["A"],"raw":"20、抽出的药液和配制好的静脉输注用无菌液体要求在多长时间内使用？（  ）\nA.≤2小时\nB.≤4小时\nC.≤8小时\nD.≤24小时\n答案：A"},{"id":"yuangan-a1-021","subject":"院感","section":"院感知识","type":"a1","no":"21","stem":"血培养采血的最佳时机（  ）","options":[{"key":"A","text":"入院时"},{"key":"B","text":"发热和寒战时"},{"key":"C","text":"发热和寒战后"},{"key":"D","text":"寒战或发热初期时采集，抗菌药物应用之前采集"}],"answer":["D"],"raw":"21、血培养采血的最佳时机（  ）\nA.入院时\nB.发热和寒战时\nC.发热和寒战后\nD.寒战或发热初期时采集，抗菌药物应用之前采集\n答案：D"},{"id":"yuangan-a1-022","subject":"院感","section":"院感知识","type":"a1","no":"22","stem":"预防医务人员血源性病原体职业暴露的基本措施中，不正确的是(  )","options":[{"key":"A","text":"严格执行标准预防措施"},{"key":"B","text":"针对接触的不同疾病的传播途径采取相应的隔离措施"},{"key":"C","text":"对医务人员健康状况评估，进行预防接种"},{"key":"D","text":"穿双层隔离衣"},{"key":"E","text":"加强医务人员血源性病原体职业暴露防护知识的培训"}],"answer":["D"],"raw":"22、预防医务人员血源性病原体职业暴露的基本措施中，不正确的是(  )\nA．严格执行标准预防措施\nB.针对接触的不同疾病的传播途径采取相应的隔离措施\nC．对医务人员健康状况评估，进行预防接种\nD．穿双层隔离衣\nE.加强医务人员血源性病原体职业暴露防护知识的培训\n答案：D"},{"id":"yuangan-a1-023","subject":"院感","section":"院感知识","type":"a1","no":"23","stem":"医院感染暴发指在医疗机构或其科室患者中，短时间内发生（  ）例以上同种同源感染病例的现象。(  )","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"4"},{"key":"D","text":"5"}],"answer":["B"],"raw":"23、医院感染暴发指在医疗机构或其科室患者中，短时间内发生（  ）例以上同种同源感染病例的现象。(  )\nA.2\nB.3\nC.4\nD.5\n答案：B"},{"id":"yuangan-a1-024","subject":"院感","section":"院感知识","type":"a1","no":"24","stem":"关于血培养的送检要求，说法错误的是（  ）","options":[{"key":"A","text":"采集完成后，尽量在2小时内送检"},{"key":"B","text":"如果不能及时送检，应该血培养瓶置于室温下"},{"key":"C","text":"如果不能及时送检，应该将血培养瓶放置在4℃冰箱中"},{"key":"D","text":"应采用密封的塑料袋和硬质防漏的容器转运标本"}],"answer":["C"],"raw":"24、关于血培养的送检要求，说法错误的是（  ）\nA.采集完成后，尽量在2小时内送检\nB.如果不能及时送检，应该血培养瓶置于室温下\nC.如果不能及时送检，应该将血培养瓶放置在4℃冰箱中\nD.应采用密封的塑料袋和硬质防漏的容器转运标本\n答案：C"},{"id":"yuangan-a1-025","subject":"院感","section":"院感知识","type":"a1","no":"25","stem":"以下选项不是外源性医院感染的感染源的为(  )","options":[{"key":"A","text":"病人"},{"key":"B","text":"病人自身的常居菌"},{"key":"C","text":"污染的医疗器械"},{"key":"D","text":"病原菌携带者"},{"key":"E","text":"污染的血液制品"}],"answer":["B"],"raw":"25、以下选项不是外源性医院感染的感染源的为(  )\nA.病人\nB.病人自身的常居菌\nC.污染的医疗器械\nD.病原菌携带者\nE.污染的血液制品\n答案：B"},{"id":"yuangan-a1-026","subject":"院感","section":"院感知识","type":"a1","no":"26","stem":"下列属于医院感染的是(  )","options":[{"key":"A","text":"患者住院次日晨尿常规检查显示，WBC 30个/高倍镜视野。"},{"key":"B","text":"患儿住院48小时内出现麻疹。"},{"key":"C","text":"皮肤黏膜开放性伤口只有细菌定植而无炎症表现。"},{"key":"D","text":"手术后30天以内发生，切口局部红.肿.热.痛，并可见化脓性分泌物。"},{"key":"E","text":"手术缝线通过处有轻微炎症。"}],"answer":["D"],"raw":"26、下列属于医院感染的是(  )\nA.患者住院次日晨尿常规检查显示，WBC 30个/高倍镜视野。\nB.患儿住院48小时内出现麻疹。\nC.皮肤黏膜开放性伤口只有细菌定植而无炎症表现。\nD.手术后30天以内发生，切口局部红.肿.热.痛，并可见化脓性分泌物。\nE.手术缝线通过处有轻微炎症。\n答案：D"},{"id":"yuangan-a1-027","subject":"院感","section":"院感知识","type":"a1","no":"27","stem":"下列哪项不符合呼吸机相关肺炎诊断的是(  )","options":[{"key":"A","text":"患者施行人工机械通气治疗后出现肺部感染临床表现，并伴发热。"},{"key":"B","text":"患者解除机械通气48小时内出现黏液.肺部啰音.并伴发热。"},{"key":"C","text":"患者住院期间行面罩吸氧治疗，5天后出现肺部感染临床表现，并伴发热。"},{"key":"D","text":"病人在原有肺部感染基础上施行人工机械通气治疗，3天后送痰培养，结果证实有新的病原体感染。"},{"key":"E","text":"患者解除机械通气48小时内出现黏液.肺部啰音，X线显示肺部有炎性侵润性病变。"}],"answer":["C"],"raw":"27、下列哪项不符合呼吸机相关肺炎诊断的是(  )\nA.患者施行人工机械通气治疗后出现肺部感染临床表现，并伴发热。\nB.患者解除机械通气48小时内出现黏液.肺部啰音.并伴发热。\nC.患者住院期间行面罩吸氧治疗，5天后出现肺部感染临床表现，并伴发热。\nD.病人在原有肺部感染基础上施行人工机械通气治疗，3天后送痰培养，结果证实有新的病原体感染。\nE.患者解除机械通气48小时内出现黏液.肺部啰音，X线显示肺部有炎性侵润性病变。\n答案：C"},{"id":"yuangan-a1-028","subject":"院感","section":"院感知识","type":"a1","no":"28","stem":"诊断抗菌药物相关性腹泻，下列哪些是错误的(  )","options":[{"key":"A","text":"临床表现为假膜性肠炎和腹泻。"},{"key":"B","text":"可由艰难梭菌引起。"},{"key":"C","text":"与应用抗菌药物有关。"},{"key":"D","text":"大便涂片有菌群失调或培养出有意义的优势菌群。"},{"key":"E","text":"与使用免疫抑制剂有关。"}],"answer":["E"],"raw":"28、诊断抗菌药物相关性腹泻，下列哪些是错误的(  )\nA.临床表现为假膜性肠炎和腹泻。\nB.可由艰难梭菌引起。\nC.与应用抗菌药物有关。\nD.大便涂片有菌群失调或培养出有意义的优势菌群。\nE.与使用免疫抑制剂有关。\n答案：E"},{"id":"yuangan-a1-029","subject":"院感","section":"院感知识","type":"a1","no":"29","stem":"有关医院感染诊断，下列哪项是正确的(  )","options":[{"key":"A","text":"无症状性菌尿不属于医院感染。"},{"key":"B","text":"1周内有留置导尿史，现尿液培养出革兰阳性球菌浓度≥104cfu/ml，虽无尿路刺激症，但属于医院感染。"},{"key":"C","text":"拔除血管内导管48小时以后出现的菌血症或真菌血症，属于导管相关血流感染。"},{"key":"D","text":"创口感染就是手术切口感染。"},{"key":"E","text":"病人化疗后出现活动性肺结核，不属于医院感染。"}],"answer":["B"],"raw":"29、有关医院感染诊断，下列哪项是正确的(  )\nA.无症状性菌尿不属于医院感染。\nB.1周内有留置导尿史，现尿液培养出革兰阳性球菌浓度≥104cfu/ml，虽无尿路刺激症，但属于医院感染。\nC.拔除血管内导管48小时以后出现的菌血症或真菌血症，属于导管相关血流感染。\nD.创口感染就是手术切口感染。\nE.病人化疗后出现活动性肺结核，不属于医院感染。\n答案：B"},{"id":"yuangan-a1-030","subject":"院感","section":"院感知识","type":"a1","no":"30","stem":"下列哪项不是常见的多重耐药菌感染部位(  )","options":[{"key":"A","text":"泌尿道感染"},{"key":"B","text":"胃肠道感染"},{"key":"C","text":"外科手术部位感染"},{"key":"D","text":"医院获得性肺炎"},{"key":"E","text":"导管相关血流感染"}],"answer":["B"],"raw":"30、下列哪项不是常见的多重耐药菌感染部位(  )\nA.泌尿道感染\nB.胃肠道感染\nC.外科手术部位感染\nD.医院获得性肺炎\nE.导管相关血流感染\n答案：B"},{"id":"yuangan-a1-031","subject":"院感","section":"院感知识","type":"a1","no":"31","stem":"关于微生物标本采集，以下说法错误的是(  )","options":[{"key":"A","text":"避免常居菌群污染"},{"key":"B","text":"在感染急性期"},{"key":"C","text":"使用抗生素后采集标本"},{"key":"D","text":"选择正确的采集部位"},{"key":"E","text":"标本采集后应立即送检"}],"answer":["C"],"raw":"31、关于微生物标本采集，以下说法错误的是(  )\nA.避免常居菌群污染\nB.在感染急性期\nC.使用抗生素后采集标本\nD.选择正确的采集部位\nE.标本采集后应立即送检\n答案：C"},{"id":"yuangan-a1-032","subject":"院感","section":"院感知识","type":"a1","no":"32","stem":"对传染病患者或疑似传染病患者产生的医疗废物处理正确的是（  ）","options":[{"key":"A","text":"用单层专用包装袋，及时密封"},{"key":"B","text":"于专用容器内，及时密封"},{"key":"C","text":"用双层专用包装袋，及时密封"},{"key":"D","text":"装于黄色塑料袋内，扎紧袋口"}],"answer":["C"],"raw":"32、对传染病患者或疑似传染病患者产生的医疗废物处理正确的是（  ）\nA．用单层专用包装袋，及时密封\nB．于专用容器内，及时密封\nC．用双层专用包装袋，及时密封\nD．装于黄色塑料袋内，扎紧袋口\n答案：C"},{"id":"yuangan-a1-033","subject":"院感","section":"院感知识","type":"a1","no":"33","stem":"医院获得性肺炎预防与控制措施中哪项错误(   )","options":[{"key":"A","text":"严格掌握气管插管，气管切开适应症"},{"key":"B","text":"湿化器添加无菌水并每天更换"},{"key":"C","text":"呼吸机管路和配件应一人一用一消毒"},{"key":"D","text":"螺纹管内冷凝水不必清除"}],"answer":["D"],"raw":"33、医院获得性肺炎预防与控制措施中哪项错误(   )\nA.严格掌握气管插管，气管切开适应症\nB.湿化器添加无菌水并每天更换\nC.呼吸机管路和配件应一人一用一消毒\nD.螺纹管内冷凝水不必清除\n答案：D"},{"id":"yuangan-a1-034","subject":"院感","section":"院感知识","type":"a1","no":"34","stem":"感染性腹泻临床诊断中哪项错误?(  )","options":[{"key":"A","text":"1天腹泻10次以上"},{"key":"B","text":"1天腹泻5次以上"},{"key":"C","text":"每天腹泻3次以上持续2天以上"},{"key":"D","text":"粪便镜检白细胞数≧10个/高倍视野"}],"answer":["A"],"raw":"34、感染性腹泻临床诊断中哪项错误?(  )\nA.1天腹泻10次以上\nB.1天腹泻5次以上\nC.每天腹泻3次以上持续2天以上\nD.粪便镜检白细胞数≧10个/高倍视野\n答案：A"},{"id":"yuangan-a1-035","subject":"院感","section":"院感知识","type":"a1","no":"35","stem":"下面哪项不是标准预防的措施?(  )","options":[{"key":"A","text":"手卫生，包括洗手及手消毒"},{"key":"B","text":"呼吸卫生/咳嗽礼仪"},{"key":"C","text":"接触患者血液、体液、分泌物时做好个人防护"},{"key":"D","text":"接触到非传染性疾病患者分泌物的医疗仪器不必进行处理"},{"key":"E","text":"正确地处理污染的医疗器械、物品、织物和环境，防止其成为感染原的传播媒介"}],"answer":["D"],"raw":"35、下面哪项不是标准预防的措施?(  )\nA.手卫生，包括洗手及手消毒\nB.呼吸卫生/咳嗽礼仪\nC.接触患者血液、体液、分泌物时做好个人防护\nD.接触到非传染性疾病患者分泌物的医疗仪器不必进行处理\nE.正确地处理污染的医疗器械、物品、织物和环境，防止其成为感染原的传播媒介\n答案：D"},{"id":"yuangan-a1-036","subject":"院感","section":"院感知识","type":"a1","no":"36","stem":"下面有关WHO提出的手卫生的“五个重要时刻”正确的是?(  )","options":[{"key":"A","text":"清洁（无菌）操作前 清洁（无菌）操作后 接触体液后 接触患者后 接触患者环境后"},{"key":"B","text":"接触患者前 清洁（无菌）操作前 接触体液后 接触患者环境前 接触患者环境后"},{"key":"C","text":"接触患者前 清洁（无菌）操作前 接触体液后 接触患者后 接触患者环境后"},{"key":"D","text":"清洁（无菌）操作前 接触体液前 接触体液后 接触患者后 接触患者环境后"},{"key":"E","text":"接触患者前 清洁（无菌）操作前 接触体液前 接触体液后 接触患者后"}],"answer":["C"],"raw":"36、下面有关WHO提出的手卫生的“五个重要时刻”正确的是?(  )\nA.清洁（无菌）操作前 清洁（无菌）操作后 接触体液后 接触患者后 接触患者环境后\nB.接触患者前 清洁（无菌）操作前 接触体液后 接触患者环境前 接触患者环境后\nC.接触患者前 清洁（无菌）操作前 接触体液后 接触患者后 接触患者环境后\nD.清洁（无菌）操作前 接触体液前 接触体液后 接触患者后 接触患者环境后\nE.接触患者前 清洁（无菌）操作前 接触体液前 接触体液后 接触患者后\n答案：C"},{"id":"yuangan-a1-037","subject":"院感","section":"院感知识","type":"a1","no":"37","stem":"王医师为阑尾炎术后患者换药时，下列不正确的是(  )","options":[{"key":"A","text":"换药前进行手卫生"},{"key":"B","text":"换药前戴口罩"},{"key":"C","text":"使用一次性无菌换药包"},{"key":"D","text":"换药后摘手套可不用手卫生"}],"answer":["D"],"raw":"37、王医师为阑尾炎术后患者换药时，下列不正确的是(  )\nA.换药前进行手卫生\nB.换药前戴口罩\nC.使用一次性无菌换药包\nD.换药后摘手套可不用手卫生\n答案：D"},{"id":"yuangan-a1-038","subject":"院感","section":"院感知识","type":"a1","no":"38","stem":"关于洗手不正确的描述是(  )","options":[{"key":"A","text":"要有充足的水洗手不必考虑是否为流动的"},{"key":"B","text":"取适量肥皂或者皂液，均匀涂抹至整个手掌.手背.手指和指缝"},{"key":"C","text":"按“六步洗手法”认真揉搓双手至少15秒"},{"key":"D","text":"应注意清洗指背.指尖和指缝"},{"key":"E","text":"在流动水下彻底冲净双手，用干手巾或纸擦干，取适量护手液护肤"}],"answer":["A"],"raw":"38、关于洗手不正确的描述是(  )\nA.要有充足的水洗手不必考虑是否为流动的\nB.取适量肥皂或者皂液，均匀涂抹至整个手掌.手背.手指和指缝\nC.按“六步洗手法”认真揉搓双手至少15秒\nD.应注意清洗指背.指尖和指缝\nE.在流动水下彻底冲净双手，用干手巾或纸擦干，取适量护手液护肤\n答案：A"},{"id":"yuangan-a1-039","subject":"院感","section":"院感知识","type":"a1","no":"39","stem":"预防导管相关血流感染，循证医学不推荐的预防措施有        （  ）","options":[{"key":"A","text":"常规对拔出的导管进行细菌培养"},{"key":"B","text":"穿刺部位涂抗菌药膏"},{"key":"C","text":"全身用抗菌药物来预防管相关血流感染"},{"key":"D","text":"以上均是"}],"answer":["D"],"raw":"39、预防导管相关血流感染，循证医学不推荐的预防措施有        （  ）\nA.常规对拔出的导管进行细菌培养\nB.穿刺部位涂抗菌药膏\nC.全身用抗菌药物来预防管相关血流感染\nD.以上均是\n答案：D"},{"id":"yuangan-a1-040","subject":"院感","section":"院感知识","type":"a1","no":"40","stem":"关于手术前手术部位皮肤的准备，正确的是(  )","options":[{"key":"A","text":"清除手术切口局部的污染即可"},{"key":"B","text":"术前均应去除手术部位毛发"},{"key":"C","text":"术前备皮应在手术前一日进行"},{"key":"D","text":"术前备皮应在手术当日进行"},{"key":"E","text":"应使用刀片刮除手术部位的毛发"}],"answer":["D"],"raw":"40、关于手术前手术部位皮肤的准备，正确的是(  )\nA.清除手术切口局部的污染即可\nB.术前均应去除手术部位毛发\nC.术前备皮应在手术前一日进行\nD.术前备皮应在手术当日进行\nE.应使用刀片刮除手术部位的毛发\n答案：D"},{"id":"yuangan-a1-041","subject":"院感","section":"院感知识","type":"a1","no":"41","stem":"小张，女，42岁，因乳腺结节就诊，医师取活检术，医师的处置错误的是 （  ）","options":[{"key":"A","text":"严格无菌操作"},{"key":"B","text":"外科手消毒"},{"key":"C","text":"戴无菌手套"},{"key":"D","text":"预防使用头孢唑林"}],"answer":["D"],"raw":"41、小张，女，42岁，因乳腺结节就诊，医师取活检术，医师的处置错误的是 （  ）\nA.严格无菌操作\nB.外科手消毒\nC.戴无菌手套\nD.预防使用头孢唑林\n答案：D"},{"id":"yuangan-a1-042","subject":"院感","section":"院感知识","type":"a1","no":"42","stem":"下列哪些是医务人员感染控制职责(  )","options":[{"key":"A","text":"掌握自我防护知识"},{"key":"B","text":"正确进行各项技术操作"},{"key":"C","text":"严格执行医疗废弃物的分类收集"},{"key":"D","text":"以上均是"}],"answer":["D"],"raw":"42、下列哪些是医务人员感染控制职责(  )\nA.掌握自我防护知识\nB.正确进行各项技术操作\nC.严格执行医疗废弃物的分类收集\nD.以上均是\n答案：D"},{"id":"yuangan-a1-043","subject":"院感","section":"院感知识","type":"a1","no":"43","stem":"关于中心静脉导管穿刺点敷料的使用，不正确的是(  )","options":[{"key":"A","text":"尽量使用无菌透明.透气性好的敷料"},{"key":"B","text":"无菌透明敷料1-2次/周更换"},{"key":"C","text":"无菌纱布1次/2天更换"},{"key":"D","text":"穿刺点有出血渗出应每日更换"},{"key":"E","text":"更换敷料时，应当严格执行手卫生规范"}],"answer":["D"],"raw":"43、关于中心静脉导管穿刺点敷料的使用，不正确的是(  )\nA.尽量使用无菌透明.透气性好的敷料\nB.无菌透明敷料1-2次/周更换\nC.无菌纱布1次/2天更换\nD.穿刺点有出血渗出应每日更换\nE.更换敷料时，应当严格执行手卫生规范\n答案：D"},{"id":"yuangan-a1-044","subject":"院感","section":"院感知识","type":"a1","no":"44","stem":"关于中心静脉置管患者输液管路的维护，正确的是(  )","options":[{"key":"A","text":"输液1天或停止输液后，及时更换输液管路"},{"key":"B","text":"输注脂肪乳剂后，应于48小时内更换输液管路"},{"key":"C","text":"持续输血每8小时更换输液管路一次"},{"key":"D","text":"输液开始时用生理盐水或肝素盐水封管，预防导管内血栓形成"},{"key":"E","text":"输液过程中定时用生理盐水或肝素盐水冲管，预防导管内血栓形成"}],"answer":["A"],"raw":"44、关于中心静脉置管患者输液管路的维护，正确的是(  )\nA.输液1天或停止输液后，及时更换输液管路\nB.输注脂肪乳剂后，应于48小时内更换输液管路\nC.持续输血每8小时更换输液管路一次\nD.输液开始时用生理盐水或肝素盐水封管，预防导管内血栓形成\nE.输液过程中定时用生理盐水或肝素盐水冲管，预防导管内血栓形成\n答案：A"},{"id":"yuangan-a1-045","subject":"院感","section":"院感知识","type":"a1","no":"45","stem":"关于预防导尿管相关尿路感染，错误的是(  )","options":[{"key":"A","text":"应根据患者年龄.性别.尿道等情况选择合适的导尿管"},{"key":"B","text":"医务人员要认真洗手，戴无菌手套实施导尿术"},{"key":"C","text":" 细菌定植而无炎症表现\nB.由于创伤或非生物因子刺激而产生的炎症表现\nC.新生儿经胎盘获得（出生后48小时内）的感染\nD.患者原有的慢性感染急性发作\n答案：ABCD"},{"id":"yuangan-x-004","subject":"院感","section":"院感知识","type":"x","no":"4","stem":"预防导管相关血流感染的措施有:（  ）","options":[{"key":"A","text":"留置导管术时最大无菌屏障"},{"key":"B","text":"用洗必泰进行皮肤消毒"},{"key":"C","text":"尽可能选择股静脉部位穿刺"},{"key":"D","text":"严格执行手卫生"},{"key":"E","text":"每天评估是否需要继续留置导管，尽早拔管"}],"answer":["A","B","D","E"],"raw":"4、预防导管相关血流感染的措施有:（  ）\nA.留置导管术时最大无菌屏障\nB.用洗必泰进行皮肤消毒\nC.尽可能选择股静脉部位穿刺\nD.严格执行手卫生\nE.每天评估是否需要继续留置导管，尽早拔管\n答案：ABDE"},{"id":"yuangan-x-005","subject":"院感","section":"院感知识","type":"x","no":"5","stem":"灭菌后的物品在何种情况下视为不合格：（  ）","options":[{"key":"A","text":"手感潮湿"},{"key":"B","text":"与潮湿物接触或浸水"},{"key":"C","text":"包内指示卡变色不均匀"},{"key":"D","text":"包装松散"},{"key":"E","text":"无菌包不慎掉地"}],"answer":["A","B","C","D","E"],"raw":"5、灭菌后的物品在何种情况下视为不合格：（  ）\nA.手感潮湿\nB.与潮湿物接触或浸水\nC.包内指示卡变色不均匀\nD.包装松散\nE.无菌包不慎掉地\n答案：ABCDE"},{"id":"yuangan-x-006","subject":"院感","section":"院感知识","type":"x","no":"6","stem":"登革病毒共有4个血清型，可感染人的有（  ）","options":[{"key":"A","text":"DENV-1"},{"key":"B","text":"DENV-2"},{"key":"C","text":"DENV-3"},{"key":"D","text":"DENV-4"}],"answer":["A","B","C","D"],"raw":"6、登革病毒共有4个血清型，可感染人的有（  ）\nA.DENV-1\nB.DENV-2\nC.DENV-3\nD.DENV-4\n答案：ABCD"},{"id":"yuangan-x-007","subject":"院感","section":"院感知识","type":"x","no":"7","stem":"符合下列何种条件可确诊登革热（  ）","options":[{"key":"A","text":"从急性期患者血清.脑脊液.血细胞或组织等中分离到登革病毒"},{"key":"B","text":"应用RT-PCR或实时荧光定量PCR检出登革病毒基因序列"},{"key":"C","text":"从急性期患者血清中检测到登革病毒NS1抗原"},{"key":"D","text":"恢复期血清特异性抗体滴度比急性期有4倍及以上增长"}],"answer":["A","B","C","D"],"raw":"7、符合下列何种条件可确诊登革热（  ）\nA.从急性期患者血清.脑脊液.血细胞或组织等中分离到登革病毒\nB.应用RT-PCR或实时荧光定量PCR检出登革病毒基因序列\nC.从急性期患者血清中检测到登革病毒NS1抗原\nD.恢复期血清特异性抗体滴度比急性期有4倍及以上增长\n答案：ABCD"},{"id":"yuangan-x-008","subject":"院感","section":"院感知识","type":"x","no":"8","stem":"登革热的治疗措施有（  ）","options":[{"key":"A","text":"卧床休息，清淡饮食"},{"key":"B","text":"退热"},{"key":"C","text":"补液"},{"key":"D","text":"可给予安定.颅痛定等对症处理"},{"key":"E","text":"伴有胃出血时可给予插胃管引流"}],"answer":["A","B","C","D"],"raw":"8、登革热的治疗措施有（  ）\nA.卧床休息，清淡饮食\nB.退热\nC.补液\nD.可给予安定.颅痛定等对症处理\nE.伴有胃出血时可给予插胃管引流\n答案：ABCD"},{"id":"yuangan-x-009","subject":"院感","section":"院感知识","type":"x","no":"9","stem":"列入我院监测与管理的多重耐药菌有（  ）","options":[{"key":"A","text":"耐甲氧西林金黄色葡萄球菌（MRSA）"},{"key":"B","text":"耐万古霉素肠球菌（VRE）"},{"key":"C","text":"耐碳青霉烯类大肠埃希菌（CREC）"},{"key":"D","text":"耐碳青霉烯类鲍曼不动杆菌（CRAB）"},{"key":"E","text":"耐碳青霉烯类铜绿假单胞菌（CRPA)"},{"key":"F","text":"耐碳青霉烯类肺炎克雷伯杆菌（CRKP）"}],"answer":["A","B","C","D","E","F"],"raw":"9、列入我院监测与管理的多重耐药菌有（  ）\nA．耐甲氧西林金黄色葡萄球菌（MRSA）\nB．耐万古霉素肠球菌（VRE）\nC．耐碳青霉烯类大肠埃希菌（CREC）\nD．耐碳青霉烯类鲍曼不动杆菌（CRAB）\nE.耐碳青霉烯类铜绿假单胞菌（CRPA)\nF.耐碳青霉烯类肺炎克雷伯杆菌（CRKP）\n答案：ABCDEF"},{"id":"yuangan-x-010","subject":"院感","section":"院感知识","type":"x","no":"10","stem":"无菌物品的存放要求有（  ）","options":[{"key":"A","text":"存放于阴凉干燥.通风良好的物架上"},{"key":"B","text":"距地面≥20CM"},{"key":"C","text":"距天花板≥50CM"},{"key":"D","text":"距墙壁≥5CM"}],"answer":["A","B","C","D"],"raw":"10、无菌物品的存放要求有（  ）\nA.存放于阴凉干燥.通风良好的物架上\nB.距地面≥20CM\nC.距天花板≥50CM\nD.距墙壁≥5CM\n答案：ABCD"},{"id":"yuangan-x-011","subject":"院感","section":"院感知识","type":"x","no":"11","stem":"预防医院获得性肺炎，下列措施正确的是？（  ）","options":[{"key":"A","text":"床头抬高30-45°"},{"key":"B","text":"应当尽早使用预防应激性溃疡的药物"},{"key":"C","text":"吸痰时严格无菌操作"},{"key":"D","text":"指导患者正确咳嗽，协助其翻身拍背，以利于痰液引流"},{"key":"E","text":"术后患者尽早下床活动"}],"answer":["A","C","D","E"],"raw":"11、预防医院获得性肺炎，下列措施正确的是？（  ）\nA.床头抬高30-45°\nB.应当尽早使用预防应激性溃疡的药物\nC.吸痰时严格无菌操作\nD.指导患者正确咳嗽，协助其翻身拍背，以利于痰液引流\nE.术后患者尽早下床活动\n答案：ACDE"},{"id":"yuangan-x-012","subject":"院感","section":"院感知识","type":"x","no":"12","stem":"下列属于病区工作人员职责要求的是：(  )","options":[{"key":"A","text":"应积极参加医院感染管理相关知识和技能的培训。"},{"key":"B","text":"应遵守标准预防的原则，落实标准预防的具体措施，手卫生应遵循WS/T313的要求；隔离工作应遵循WS/T311的要求；消毒灭菌工作应遵循WS/T367的要求。"},{"key":"C","text":"应开展医院感染的监测，按照医院的要求进行报告。"},{"key":"D","text":"应了解本病区.本专业相关医院感染特点，包括感染率.感染部位.感染病原体及多重耐药菌感染情况。"},{"key":"E","text":"在从事无菌技术诊疗操作如注射.治疗.换药等时，应遵守无菌技术操作规程。"}],"answer":["A","B","C","D","E"],"raw":"12、下列属于病区工作人员职责要求的是：(  )\nA.应积极参加医院感染管理相关知识和技能的培训。\nB.应遵守标准预防的原则，落实标准预防的具体措施，手卫生应遵循WS/T313的要求；隔离工作应遵循WS/T311的要求；消毒灭菌工作应遵循WS/T367的要求。\nC.应开展医院感染的监测，按照医院的要求进行报告。\nD.应了解本病区.本专业相关医院感染特点，包括感染率.感染部位.感染病原体及多重耐药菌感染情况。\nE.在从事无菌技术诊疗操作如注射.治疗.换药等时，应遵守无菌技术操作规程。\n答案：ABCDE"},{"id":"yuangan-x-013","subject":"院感","section":"院感知识","type":"x","no":"13","stem":"重复使用的诊疗器械被下列哪些病原体污染时应先消毒，后清洗、灭菌（  ）","options":[{"key":"A","text":"乙型肝炎病毒"},{"key":"B","text":"朊毒体"},{"key":"C","text":"气性坏疽"},{"key":"D","text":"突发不明原因的病原体"}],"answer":["B","C","D"],"raw":"13、重复使用的诊疗器械被下列哪些病原体污染时应先消毒，后清洗、灭菌（  ）\nA.乙型肝炎病毒\nB.朊毒体\nC.气性坏疽\nD.突发不明原因的病原体\n答案：BCD"},{"id":"yuangan-x-014","subject":"院感","section":"院感知识","type":"x","no":"14","stem":"下列属于高度危险物品的有：（   ）","options":[{"key":"A","text":"胃肠道内镜"},{"key":"B","text":"呼吸机螺纹管"},{"key":"C","text":"腹腔镜"},{"key":"D","text":"口腔科牙钻"},{"key":"E","text":"导尿管"}],"answer":["C","D","E"],"raw":"14、下列属于高度危险物品的有：（   ）\nA.胃肠道内镜\nB.呼吸机螺纹管\nC.腹腔镜\nD.口腔科牙钻\nE.导尿管\n答案：CDE"},{"id":"yuangan-x-015","subject":"院感","section":"院感知识","type":"x","no":"15","stem":"手术部位切口感染可以分为？（  ）","options":[{"key":"A","text":"表浅切口感染"},{"key":"B","text":"深部切口感染"},{"key":"C","text":"器官/腔隙感染"},{"key":"D","text":"皮肤感染"}],"answer":["A","B","C"],"raw":"15、手术部位切口感染可以分为？（  ）\nA.表浅切口感染\nB.深部切口感染\nC.器官/腔隙感染\nD.皮肤感染\n答案：ABC"},{"id":"yuangan-x-016","subject":"院感","section":"院感知识","type":"x","no":"16","stem":"病原学信息的收集包括（  ）","options":[{"key":"A","text":"细菌学培养结果"},{"key":"B","text":"病毒学结果"},{"key":"C","text":"病理学结果"},{"key":"D","text":"血清学检查结果"}],"answer":["A","B","C","D"],"raw":"16、病原学信息的收集包括（  ）\nA.细菌学培养结果\nB.病毒学结果\nC.病理学结果\nD.血清学检查结果\n答案：ABCD"},{"id":"yuangan-x-017","subject":"院感","section":"院感知识","type":"x","no":"17","stem":"临床抗菌药物使用调查,其目的是（  ）","options":[{"key":"A","text":"了解抗菌药物使用情况"},{"key":"B","text":"促进抗菌药物的临床合理应用"},{"key":"C","text":"延缓耐药性的产生"},{"key":"D","text":"以上都不是"}],"answer":["A","B","C"],"raw":"17、临床抗菌药物使用调查,其目的是（  ）\nA.了解抗菌药物使用情况\nB.促进抗菌药物的临床合理应用\nC.延缓耐药性的产生\nD.以上都不是\n答案：ABC"},{"id":"yuangan-x-018","subject":"院感","section":"院感知识","typ
