tions":[],"answer":["T"],"raw":"16、禁止用手直接接触使用后的针头、刀片等锐器。\n答案：正确"},{"id":"yuangan-tf-017","subject":"院感","section":"院感知识","type":"tf","no":"17","stem":"多重耐药菌是指对临床使用的二类或二类以上抗菌药物同时呈现耐药的细菌。","options":[],"answer":["F"],"raw":"17、多重耐药菌是指对临床使用的二类或二类以上抗菌药物同时呈现耐药的细菌。\n答案：错误"},{"id":"yuangan-tf-018","subject":"院感","section":"院感知识","type":"tf","no":"18","stem":"手术进入呼吸道、消化道、泌尿生殖道及口咽部位，但不伴有明显污染，属于污染性切口。","options":[],"answer":["F"],"raw":"18、手术进入呼吸道、消化道、泌尿生殖道及口咽部位，但不伴有明显污染，属于污染性切口。\n答案：错误"},{"id":"yuangan-tf-019","subject":"院感","section":"院感知识","type":"tf","no":"19","stem":"术后保持引流通畅，为患者尽量长时间留置引流管。","options":[],"answer":["F"],"raw":"19、术后保持引流通畅，为患者尽量长时间留置引流管。\n答案：错误"},{"id":"yuangan-tf-020","subject":"院感","section":"院感知识","type":"tf","no":"20","stem":"围手术期抗菌药物的预防性应用不能代替严格的消毒、灭菌技术和精细的无菌操作。","options":[],"answer":["T"],"raw":"20、围手术期抗菌药物的预防性应用不能代替严格的消毒、灭菌技术和精细的无菌操作。\n答案：正确"},{"id":"zhinan-a1-001","subject":"院级指南","section":"院级指南","type":"a1","no":"1","stem":"以下哪项不属于“BEFAST——快速识别脑卒中”口诀的内容？（  ）","options":[{"key":"A","text":"难平衡"},{"key":"B","text":"臂不平"},{"key":"C","text":"面不正"},{"key":"D","text":"意不清"},{"key":"E","text":"语不灵"},{"key":"F","text":"时间"}],"answer":["D"],"raw":"1、以下哪项不属于“BEFAST——快速识别脑卒中”口诀的内容？（  ）\nA.难平衡\nB.臂不平\nC.面不正\nD.意不清\nE.语不灵\nF.时间\n答案：D"},{"id":"zhinan-a1-002","subject":"院级指南","section":"院级指南","type":"a1","no":"2","stem":"缺血性卒中使用阿替普酶静脉溶栓的时间窗是多少？（  ）","options":[{"key":"A","text":"0-3小时"},{"key":"B","text":"0-4.5小时"},{"key":"C","text":"6小时以内"},{"key":"D","text":"9小时以内"}],"answer":["B"],"raw":"2、缺血性卒中使用阿替普酶静脉溶栓的时间窗是多少？（  ）\nA.0-3小时\nB.0-4.5小时\nC.6小时以内\nD.9小时以内\n答案：B"},{"id":"zhinan-a1-003","subject":"院级指南","section":"院级指南","type":"a1","no":"3","stem":"下面哪些临床表现是Ⅱ级严重过敏反应？（  ）","options":[{"key":"A","text":"皮肤黏膜系统症状和胃肠系统症状，血流动力学稳定，呼吸系统功能稳定"},{"key":"B","text":"出现明显呼吸系统症状或血压下降"},{"key":"C","text":"出现以下任一症状：神志不清、嗜睡、意识丧失、严重的支气管痉挛和/或喉头水肿、发绀、重度血压下降（收缩压<80mmHg或比基础值下降>40%）、大小便失禁等"},{"key":"D","text":"发生心跳和/或呼吸骤停"}],"answer":["B"],"raw":"3、下面哪些临床表现是Ⅱ级严重过敏反应？（  ）\nA.皮肤黏膜系统症状和胃肠系统症状，血流动力学稳定，呼吸系统功能稳定\nB.出现明显呼吸系统症状或血压下降\nC.出现以下任一症状：神志不清、嗜睡、意识丧失、严重的支气管痉挛和/或喉头水肿、发绀、重度血压下降（收缩压<80mmHg或比基础值下降>40%）、大小便失禁等\nD.发生心跳和/或呼吸骤停\n答案：B"},{"id":"zhinan-a1-004","subject":"院级指南","section":"院级指南","type":"a1","no":"4","stem":"液体复苏可用于严重过敏反应伴循环系统不稳定的患者，液体用量一般为（  ），根据患者情况调整剂量。","options":[{"key":"A","text":"10ml/kg"},{"key":"B","text":"15ml/kg"},{"key":"C","text":"20ml/kg"},{"key":"D","text":"25ml/kg"},{"key":"E","text":"30ml/kg"}],"answer":["C"],"raw":"4、液体复苏可用于严重过敏反应伴循环系统不稳定的患者，液体用量一般为（  ），根据患者情况调整剂量。\nA.10ml/kg\nB.15ml/kg\nC.20ml/kg\nD.25ml/kg\nE.30ml/kg\n答案：C"},{"id":"zhinan-a1-005","subject":"院级指南","section":"院级指南","type":"a1","no":"5","stem":"严重过敏反应救治成功后应监护至少多长时间？（  ）","options":[{"key":"A","text":"4小时"},{"key":"B","text":"6小时"},{"key":"C","text":"8小时"},{"key":"D","text":"12小时"},{"key":"E","text":"24小时"}],"answer":["D"],"raw":"5、严重过敏反应救治成功后应监护至少多长时间？（  ）\nA.4小时\nB.6小时\nC.8小时\nD.12小时\nE.24小时\n答案：D"},{"id":"zhinan-a1-006","subject":"院级指南","section":"院级指南","type":"a1","no":"6","stem":"肾上腺素的使用时机是什么？（  ）","options":[{"key":"A","text":"应在患者被确诊为Ⅰ级及以上的严重过敏反应后尽早使用"},{"key":"B","text":"应在患者被确诊为Ⅱ级及以上的严重过敏反应后尽早使用"},{"key":"C","text":"应在患者被确诊为Ⅲ级及以上的严重过敏反应后尽早使用"},{"key":"D","text":"应在患者被确诊严重过敏反应后尽早使用"}],"answer":["B"],"raw":"6、肾上腺素的使用时机是什么？（  ）\nA.应在患者被确诊为Ⅰ级及以上的严重过敏反应后尽早使用\nB.应在患者被确诊为Ⅱ级及以上的严重过敏反应后尽早使用\nC.应在患者被确诊为Ⅲ级及以上的严重过敏反应后尽早使用\nD.应在患者被确诊严重过敏反应后尽早使用\n答案：B"},{"id":"zhinan-a1-007","subject":"院级指南","section":"院级指南","type":"a1","no":"7","stem":"对于Ⅱ、Ⅲ级过敏反应推荐肾上腺素肌肉注射，其剂量、浓度、使用间隔时间是多少？（  ）","options":[{"key":"A","text":"肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5mg，14岁以下患者单次最大剂量不超过0.3mg；浓度：1mg/ml(1:1000），等同于1ml：1mg规格的肾上腺素注射液浓度；5~15min后效果不理想者可重复给药。"},{"key":"B","text":"肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5mg，14岁以下患者单次最大剂量不超过0.3mg；浓度：1mg/ml(1:10000），即现有1ml：1mg规格的肾上腺素注射液稀释10倍；5~15 min后效果不理想者可重复给药。"},{"key":"C","text":"肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5 mg，14岁以下患者单次最大剂量不超过0.3 mg；浓度：1mg/ml(1:1000），等同于1ml：1 mg规格的肾上腺素注射液浓度；3~5 min后效果不理想者可重复给药。"},{"key":"D","text":"肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过1.0mg，14岁以下患者单次最大剂量不超过0.5mg；浓度：1mg/ml(1:1000），即现有1ml：1mg规格的肾上腺素注射液稀释10倍；3~5min后效果不理想者可重复给药。"}],"answer":["A"],"raw":"7、对于Ⅱ、Ⅲ级过敏反应推荐肾上腺素肌肉注射，其剂量、浓度、使用间隔时间是多少？（  ）\nA.肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5mg，14岁以下患者单次最大剂量不超过0.3mg；浓度：1mg/ml(1:1000），等同于1ml：1mg规格的肾上腺素注射液浓度；5~15min后效果不理想者可重复给药。\nB.肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5mg，14岁以下患者单次最大剂量不超过0.3mg；浓度：1mg/ml(1:10000），即现有1ml：1mg规格的肾上腺素注射液稀释10倍；5~15 min后效果不理想者可重复给药。\nC.肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过0.5 mg，14岁以下患者单次最大剂量不超过0.3 mg；浓度：1mg/ml(1:1000），等同于1ml：1 mg规格的肾上腺素注射液浓度；3~5 min后效果不理想者可重复给药。\nD.肾上腺素按0.01mg/kg体重给予，14岁及以上患者单次最大剂量不超过1.0mg，14岁以下患者单次最大剂量不超过0.5mg；浓度：1mg/ml(1:1000），即现有1ml：1mg规格的肾上腺素注射液稀释10倍；3~5min后效果不理想者可重复给药。\n答案：A"},{"id":"zhinan-a1-008","subject":"院级指南","section":"院级指南","type":"a1","no":"8","stem":"急性胸痛患者首次医疗接触后多少分钟内完成12/18导心电图？（  ）","options":[{"key":"A","text":"8分钟"},{"key":"B","text":"10分钟"},{"key":"C","text":"15分钟"},{"key":"D","text":"20分钟"}],"answer":["B"],"raw":"8、急性胸痛患者首次医疗接触后多少分钟内完成12/18导心电图？（  ）\nA.8分钟\nB.10分钟\nC.15分钟\nD.20分钟\n答案：B"},{"id":"zhinan-a1-009","subject":"院级指南","section":"院级指南","type":"a1","no":"9","stem":"以下不是STEMI的心电图表现的是（  ）","options":[{"key":"A","text":"2个或以上导联ST段弓背抬高"},{"key":"B","text":"新发的左束支传导阻滞"},{"key":"C","text":"缺血相关导联的T波高耸"},{"key":"D","text":"2个相邻导联ST段压低≥0.1mv或者T波改变"}],"answer":["D"],"raw":"9、以下不是STEMI的心电图表现的是（  ）\nA.2个或以上导联ST段弓背抬高\nB.新发的左束支传导阻滞\nC.缺血相关导联的T波高耸\nD.2个相邻导联ST段压低≥0.1mv或者T波改变\n答案：D"},{"id":"zhinan-a1-010","subject":"院级指南","section":"院级指南","type":"a1","no":"10","stem":"患者首次医疗接触到实施再灌注的时间：（  ）","options":[{"key":"A","text":"溶栓≤20分钟，直接PCI≤90分钟"},{"key":"B","text":"溶栓≤30分钟，直接PCI≤60分钟"},{"key":"C","text":"溶栓≤20分钟，直接PCI≤60分钟"},{"key":"D","text":"溶栓≤20分钟，直接PCI≤120分钟"},{"key":"E","text":"溶栓≤30分钟，直接PCI≤90分钟"}],"answer":["E"],"raw":"10、患者首次医疗接触到实施再灌注的时间：（  ）\nA.溶栓≤20分钟，直接PCI≤90分钟\nB.溶栓≤30分钟，直接PCI≤60分钟\nC.溶栓≤20分钟，直接PCI≤60分钟\nD.溶栓≤20分钟，直接PCI≤120分钟\nE.溶栓≤30分钟，直接PCI≤90分钟\n答案：E"},{"id":"zhinan-a1-011","subject":"院级指南","section":"院级指南","type":"a1","no":"11","stem":"急性心肌梗死解除疼痛首选（  ）","options":[{"key":"A","text":"吗啡"},{"key":"B","text":"罂粟碱"},{"key":"C","text":"可待因"},{"key":"D","text":"硝酸甘油"}],"answer":["A"],"raw":"11、急性心肌梗死解除疼痛首选（  ）\nA.吗啡\nB.罂粟碱\nC.可待因\nD.硝酸甘油\n答案：A"},{"id":"zhinan-a1-012","subject":"院级指南","section":"院级指南","type":"a1","no":"12","stem":"心肌梗死的基本病因是（  ）","options":[{"key":"A","text":"左心功能不全"},{"key":"B","text":"右心衰竭"},{"key":"C","text":"血动力学改变"},{"key":"D","text":"冠状动脉粥样硬化"}],"answer":["D"],"raw":"12、心肌梗死的基本病因是（  ）\nA.左心功能不全\nB.右心衰竭\nC.血动力学改变\nD.冠状动脉粥样硬化\n答案：D"},{"id":"zhinan-a1-013","subject":"院级指南","section":"院级指南","type":"a1","no":"13","stem":"STEMI 的初始诊断通常是基于哪两项情况？（  ）","options":[{"key":"A","text":"持续性心肌缺血症状和心肌损伤标志物检查。"},{"key":"B","text":"持续性心肌缺血症状和心电图检查。"},{"key":"C","text":"心肌损伤标志物检查和心电图检查。"},{"key":"D","text":"心肌损伤标志物检查和超声心动图等影像学检查。"}],"answer":["B"],"raw":"13、STEMI 的初始诊断通常是基于哪两项情况？（  ）\nA.持续性心肌缺血症状和心肌损伤标志物检查。\nB.持续性心肌缺血症状和心电图检查。\nC.心肌损伤标志物检查和心电图检查。\nD.心肌损伤标志物检查和超声心动图等影像学检查。\n答案：B"},{"id":"zhinan-a1-014","subject":"院级指南","section":"院级指南","type":"a1","no":"14","stem":"对于需使用血管活性药物的脓毒性休克患者，推荐以平均动脉压（MAP）多少作为初始复苏目标？（  ）","options":[{"key":"A","text":"≥65mmHg"},{"key":"B","text":"≥60mmHg"},{"key":"C","text":"65~85mmHg"},{"key":"D","text":"≥70mmHg"}],"answer":["A"],"raw":"14、对于需使用血管活性药物的脓毒性休克患者，推荐以平均动脉压（MAP）多少作为初始复苏目标？（  ）\nA.≥65mmHg\nB.≥60mmHg\nC.65~85mmHg\nD.≥70mmHg\n答案：A"},{"id":"zhinan-a1-015","subject":"院级指南","section":"院级指南","type":"a1","no":"15","stem":"推荐抗菌药物在入院后或判断脓毒症以后尽快使用，最佳时间是多少，延迟不超过多少？（  ）","options":[{"key":"A","text":"1h，2h"},{"key":"B","text":"1h，3h"},{"key":"C","text":"2h，4h"},{"key":"D","text":"2h，6h"}],"answer":["B"],"raw":"15、推荐抗菌药物在入院后或判断脓毒症以后尽快使用，最佳时间是多少，延迟不超过多少？（  ）\nA.1h，2h\nB.1h，3h\nC.2h，4h\nD.2h，6h\n答案：B"},{"id":"zhinan-a1-016","subject":"院级指南","section":"院级指南","type":"a1","no":"16","stem":"疑似脓毒症诊断标准包含哪些？（  ）","options":[{"key":"A","text":"感染或疑似感染患者"},{"key":"B","text":"qSOFA≥2"},{"key":"C","text":"SOFA=1分"},{"key":"D","text":"NEWS评分4-6分。"},{"key":"E","text":"A项加BCD项中任意一项"}],"answer":["E"],"raw":"16、疑似脓毒症诊断标准包含哪些？（  ）\nA.感染或疑似感染患者\nB.qSOFA≥2\nC.SOFA=1分\nD.NEWS评分4-6分。\nE.A项加BCD项中任意一项\n答案：E"},{"id":"zhinan-a1-017","subject":"院级指南","section":"院级指南","type":"a1","no":"17","stem":"肝功能不全的患者预防VTE抗凝药物首选哪个？（  ）","options":[{"key":"A","text":"低分子肝素"},{"key":"B","text":"普通肝素"},{"key":"C","text":"利伐沙班"},{"key":"D","text":"华法林"}],"answer":["A"],"raw":"17、肝功能不全的患者预防VTE抗凝药物首选哪个？（  ）\nA.低分子肝素\nB.普通肝素\nC.利伐沙班\nD.华法林\n答案：A"},{"id":"zhinan-a1-018","subject":"院级指南","section":"院级指南","type":"a1","no":"18","stem":"心脏骤停发生后（  ）内为抢救的最佳时机 ，给患者实施有效CPR。","options":[{"key":"A","text":"4min"},{"key":"B","text":"6min"},{"key":"C","text":"8min"},{"key":"D","text":"10min"}],"answer":["A"],"raw":"18、心脏骤停发生后（  ）内为抢救的最佳时机 ，给患者实施有效CPR。\nA.4min\nB.6min\nC.8min\nD.10min\n答案：A"},{"id":"zhinan-a1-019","subject":"院级指南","section":"院级指南","type":"a1","no":"19","stem":"心脏骤停根据其机制可分为4种情况，除外以下哪项？（  ）","options":[{"key":"A","text":"心室颤动"},{"key":"B","text":"心室扑动"},{"key":"C","text":"无脉性室性心动过速"},{"key":"D","text":"心脏静止"},{"key":"E","text":"电机械分离"}],"answer":["B"],"raw":"19、心脏骤停根据其机制可分为4种情况，除外以下哪项？（  ）\nA.心室颤动\nB.心室扑动\nC.无脉性室性心动过速\nD.心脏静止\nE.电机械分离\n答案：B"},{"id":"zhinan-a1-020","subject":"院级指南","section":"院级指南","type":"a1","no":"20","stem":"心脏骤停为可除颤心律时，药物的使用以下哪项是错误的？（  ）","options":[{"key":"A","text":"若第2次除颤不成功，CPR同时应静脉注射肾上腺素1mg（再推注生理盐水20ml），推注后再次除颤。"},{"key":"B","text":"肾上腺素可间隔3-5min多次重复使用，每次1-3mg。"},{"key":"C","text":"当推注1～2次肾上腺素并除颤后仍无效时，可静脉迅速推注胺碘酮300mg（或5mg/kg），以提高再次电复律的成功率。"},{"key":"D","text":"胺碘酮可重复使用1次，第2剂150mg（或2.5mg/kg）静脉推注，若电复律仍无效，则不再使用。"}],"answer":["B"],"raw":"20、心脏骤停为可除颤心律时，药物的使用以下哪项是错误的？（  ）\nA.若第2次除颤不成功，CPR同时应静脉注射肾上腺素1mg（再推注生理盐水20ml），推注后再次除颤。\nB.肾上腺素可间隔3-5min多次重复使用，每次1-3mg。\nC.当推注1～2次肾上腺素并除颤后仍无效时，可静脉迅速推注胺碘酮300mg（或5mg/kg），以提高再次电复律的成功率。\nD.胺碘酮可重复使用1次，第2剂150mg（或2.5mg/kg）静脉推注，若电复律仍无效，则不再使用。\n答案：B"},{"id":"zhinan-a1-021","subject":"院级指南","section":"院级指南","type":"a1","no":"21","stem":"成人心跳呼吸骤停的可逆原因下列哪组不正确？（  ）","options":[{"key":"A","text":"低血容量、低氧、酸中毒"},{"key":"B","text":"高钾血症、低钾血症、低体温"},{"key":"C","text":"张力性气胸、心包填塞、中毒"},{"key":"D","text":"肺栓塞、冠状动脉血栓、多脏器功能衰竭"}],"answer":["D"],"raw":"21、成人心跳呼吸骤停的可逆原因下列哪组不正确？（  ）\nA.低血容量、低氧、酸中毒\nB.高钾血症、低钾血症、低体温\nC.张力性气胸、心包填塞、中毒\nD.肺栓塞、冠状动脉血栓、多脏器功能衰竭\n答案：D"},{"id":"zhinan-a1-022","subject":"院级指南","section":"院级指南","type":"a1","no":"22","stem":"癌痛常规评估，应当在患者入院后几小时内进行首次评估？（  ）","options":[{"key":"A","text":"3"},{"key":"B","text":"6"},{"key":"C","text":"8"},{"key":"D","text":"10"}],"answer":["C"],"raw":"22、癌痛常规评估，应当在患者入院后几小时内进行首次评估？（  ）\nA.3\nB.6\nC.8\nD.10\n答案：C"},{"id":"zhinan-a1-023","subject":"院级指南","section":"院级指南","type":"a1","no":"23","stem":"NRS法评为0～10分，中度疼痛为几分？（  ）","options":[{"key":"A","text":"0～10分"},{"key":"B","text":"1～4分"},{"key":"C","text":"4～6分"},{"key":"D","text":"7～10分"}],"answer":["C"],"raw":"23、NRS法评为0～10分，中度疼痛为几分？（  ）\nA.0～10分\nB.1～4分\nC.4～6分\nD.7～10分\n答案：C"},{"id":"zhinan-a1-024","subject":"院级指南","section":"院级指南","type":"a1","no":"24","stem":"慢性疼痛是指持续或反复疼痛时间？（  ）","options":[{"key":"A","text":">0.5个月"},{"key":"B","text":">1个月"},{"key":"C","text":">2个月"},{"key":"D","text":">3个月"}],"answer":["D"],"raw":"24、慢性疼痛是指持续或反复疼痛时间？（  ）\nA.>0.5个月\nB.>1个月\nC.>2个月\nD.>3个月\n答案：D"},{"id":"zhinan-a1-025","subject":"院级指南","section":"院级指南","type":"a1","no":"25","stem":"对癌症病人最常用的首选给药方法是？（  ）","options":[{"key":"A","text":"口服给药"},{"key":"B","text":"直肠给药"},{"key":"C","text":"注射给药"},{"key":"D","text":"静脉给药"}],"answer":["A"],"raw":"25、对癌症病人最常用的首选给药方法是？（  ）\nA.口服给药\nB.直肠给药\nC.注射给药\nD.静脉给药\n答案：A"},{"id":"zhinan-a1-026","subject":"院级指南","section":"院级指南","type":"a1","no":"26","stem":"何种麻醉药品注射剂不宜长期用于癌症疼痛和其他慢性疼痛治疗？（  ）","options":[{"key":"A","text":"盐酸吗啡"},{"key":"B","text":"罗通定"},{"key":"C","text":"磷酸可待因"},{"key":"D","text":"盐酸哌替啶"}],"answer":["D"],"raw":"26、何种麻醉药品注射剂不宜长期用于癌症疼痛和其他慢性疼痛治疗？（  ）\nA.盐酸吗啡\nB.罗通定\nC.磷酸可待因\nD.盐酸哌替啶\n答案：D"},{"id":"zhinan-a1-027","subject":"院级指南","section":"院级指南","type":"a1","no":"27","stem":"WHO将哪一种药物的用量作为衡量各国癌痛改善状况的重要指标？（  ）","options":[{"key":"A","text":"吗啡"},{"key":"B","text":"美沙酮"},{"key":"C","text":"芬太尼"},{"key":"D","text":"盐酸哌替啶"}],"answer":["A"],"raw":"27、WHO将哪一种药物的用量作为衡量各国癌痛改善状况的重要指标？（  ）\nA.吗啡\nB.美沙酮\nC.芬太尼\nD.盐酸哌替啶\n答案：A"},{"id":"zhinan-a1-028","subject":"院级指南","section":"院级指南","type":"a1","no":"28","stem":"在癌痛治疗中，关于药物治疗的叙述错误的是？（  ）","options":[{"key":"A","text":"初次使用阿片类药物止痛的患者，建议用吗啡缓释片5-15mg，每4h一次，口服。"},{"key":"B","text":"阿片类药物是中、重度癌痛治疗的首选药物。"},{"key":"C","text":"对于慢性癌痛治疗，推荐选择阿片受体激动剂类药物。"},{"key":"D","text":"癌症骨转移引起的疼痛，应该联合使用双膦酸盐类药物，抑制溶骨活动。"}],"answer":["A"],"raw":"28、在癌痛治疗中，关于药物治疗的叙述错误的是？（  ）\nA.初次使用阿片类药物止痛的患者，建议用吗啡缓释片5-15mg，每4h一次，口服。\nB.阿片类药物是中、重度癌痛治疗的首选药物。\nC.对于慢性癌痛治疗，推荐选择阿片受体激动剂类药物。\nD.癌症骨转移引起的疼痛，应该联合使用双膦酸盐类药物，抑制溶骨活动。\n答案：A"},{"id":"zhinan-a1-029","subject":"院级指南","section":"院级指南","type":"a1","no":"29","stem":"疼痛程度分级法（VRS），以下描述错误的是哪项？（  ）","options":[{"key":"A","text":"轻度疼痛：有疼痛，但可忍受，生活正常，睡眠未受到干扰。"},{"key":"B","text":"轻中度疼痛：疼痛较明显，不能忍受，需要服用药物，睡眠未受到干扰。"},{"key":"C","text":"中度疼痛：疼痛明显，不能忍受，要求服用镇痛药物，睡眠受到干扰。"},{"key":"D","text":"重度疼痛：疼痛剧烈，不能忍受，需用镇痛药物，睡眠受到严重干扰，可伴有植物神经功能紊乱或被动体位。"}],"answer":["B"],"raw":"29、疼痛程度分级法（VRS），以下描述错误的是哪项？（  ）\nA.轻度疼痛：有疼痛，但可忍受，生活正常，睡眠未受到干扰。\nB.轻中度疼痛：疼痛较明显，不能忍受，需要服用药物，睡眠未受到干扰。\nC.中度疼痛：疼痛明显，不能忍受，要求服用镇痛药物，睡眠受到干扰。\nD.重度疼痛：疼痛剧烈，不能忍受，需用镇痛药物，睡眠受到严重干扰，可伴有植物神经功能紊乱或被动体位。\n答案：B"},{"id":"zhinan-a1-030","subject":"院级指南","section":"院级指南","type":"a1","no":"30","stem":"慢性疼痛总的诊治原则以下哪项是错误的？（  ）","options":[{"key":"A","text":"明确诊断"},{"key":"B","text":"综合治疗"},{"key":"C","text":"安全有效"},{"key":"D","text":"长期规范"}],"answer":["D"],"raw":"30、慢性疼痛总的诊治原则以下哪项是错误的？（  ）\nA.明确诊断\nB.综合治疗\nC.安全有效\nD.长期规范\n答案：D"},{"id":"zhinan-a1-031","subject":"院级指南","section":"院级指南","type":"a1","no":"31","stem":"癌痛病人使用麻醉药物控、缓释剂时，每次门诊处方量不得超过的常用量为（  ）","options":[{"key":"A","text":"10天"},{"key":"B","text":"5天"},{"key":"C","text":"7天"},{"key":"D","text":"15天"}],"answer":["D"],"raw":"31、癌痛病人使用麻醉药物控、缓释剂时，每次门诊处方量不得超过的常用量为（  ）\nA.10天\nB.5天\nC.7天\nD.15天\n答案：D"},{"id":"zhinan-a1-032","subject":"院级指南","section":"院级指南","type":"a1","no":"32","stem":"下列镇痛药物中具有“天花板效应”的是？（  ）","options":[{"key":"A","text":"曲马多"},{"key":"B","text":"塞来昔布"},{"key":"C","text":"吗啡"},{"key":"D","text":"可待因"}],"answer":["B"],"raw":"32、下列镇痛药物中具有“天花板效应”的是？（  ）\nA.曲马多\nB.塞来昔布\nC.吗啡\nD.可待因\n答案：B"},{"id":"zhinan-a1-033","subject":"院级指南","section":"院级指南","type":"a1","no":"33","stem":"急性重症胰腺炎患者不推荐使用阿片类药物中哪种药物（）","options":[{"key":"A","text":"吗啡"},{"key":"B","text":"哌替啶"},{"key":"C","text":"芬太尼"},{"key":"D","text":"可待因"}],"answer":["A"],"raw":"33、急性重症胰腺炎患者不推荐使用阿片类药物中哪种药物（）\nA.吗啡\nB.哌替啶\nC.芬太尼\nD.可待因\n答案：A"},{"id":"zhinan-a1-034","subject":"院级指南","section":"院级指南","type":"a1","no":"34","stem":"腹部创伤急诊手术指征表述，不正确的是：（）","options":[{"key":"A","text":"腹痛和腹膜刺激征有进行性加重或范围扩大"},{"key":"B","text":"全身情况有恶化趋势，出现口渴、烦躁、脉率增快或体温及白细胞计数上升"},{"key":"C","text":"膈下有游离气体表现"},{"key":"D","text":"血压由不稳定转为稳定"},{"key":"E","text":"腹腔穿刺吸出气体、不凝血液、胆汁或胃肠内容物"}],"answer":["D"],"raw":"34、腹部创伤急诊手术指征表述，不正确的是：（）\nA.腹痛和腹膜刺激征有进行性加重或范围扩大\nB.全身情况有恶化趋势，出现口渴、烦躁、脉率增快或体温及白细胞计数上升\nC.膈下有游离气体表现\nD.血压由不稳定转为稳定\nE.腹腔穿刺吸出气体、不凝血液、胆汁或胃肠内容物\n答案：D"},{"id":"zhinan-a1-035","subject":"院级指南","section":"院级指南","type":"a1","no":"35","stem":"脾脏损伤的治疗原则，错误的是：（  ）","options":[{"key":"A","text":"保留脾脏第一、抢救生命第二"},{"key":"B","text":"损伤控制"},{"key":"C","text":"必要时果断切除脾脏，以免因过度延长手术时间、增加术中出血而导致严重后果"},{"key":"D","text":"年龄越小越优先保脾"},{"key":"E","text":"施行脾保留手术后应注意严密观察，防止出现延迟性脾破裂"}],"answer":["A"],"raw":"35、脾脏损伤的治疗原则，错误的是：（  ）\nA.保留脾脏第一、抢救生命第二\nB.损伤控制\nC.必要时果断切除脾脏，以免因过度延长手术时间、增加术中出血而导致严重后果\nD.年龄越小越优先保脾\nE.施行脾保留手术后应注意严密观察，防止出现延迟性脾破裂\n答案：A"},{"id":"zhinan-a1-036","subject":"院级指南","section":"院级指南","type":"a1","no":"36","stem":"烧伤的致伤因素：（  ）","options":[{"key":"A","text":"热力"},{"key":"B","text":"电烧伤"},{"key":"C","text":"化学烧伤"},{"key":"D","text":"放射烧伤"},{"key":"E","text":"以上都是"}],"answer":["E"],"raw":"36、烧伤的致伤因素：（  ）\nA.热力\nB.电烧伤\nC.化学烧伤\nD.放射烧伤\nE.以上都是\n答案：E"},{"id":"zhinan-a1-037","subject":"院级指南","section":"院级指南","type":"a1","no":"37","stem":"大面积烧伤造成的全身变化，哪个是错误的：（  ）","options":[{"key":"A","text":"血容量减少"},{"key":"B","text":"能量消耗和正氮平衡"},{"key":"C","text":"红细胞破坏"},{"key":"D","text":"免疫力下降"},{"key":"E","text":"心肺肝肾胃肠等脏器影响"}],"answer":["B"],"raw":"37、大面积烧伤造成的全身变化，哪个是错误的：（  ）\nA.血容量减少\nB.能量消耗和正氮平衡\nC.红细胞破坏\nD.免疫力下降\nE.心肺肝肾胃肠等脏器影响\n答案：B"},{"id":"zhinan-a1-038","subject":"院级指南","section":"院级指南","type":"a1","no":"38","stem":"气道烧伤早期急诊处理，不包括：（  ）","options":[{"key":"A","text":"口咽通气管"},{"key":"B","text":"气管插管"},{"key":"C","text":"准备插管前，做好万全准备，少用影响呼吸、循环类药物"},{"key":"D","text":"气管切开"},{"key":"E","text":"有条件在成功插管后纤支镜评估气道烧伤情况"}],"answer":["A"],"raw":"38、气道烧伤早期急诊处理，不包括：（  ）\nA.口咽通气管\nB.气管插管\nC.准备插管前，做好万全准备，少用影响呼吸、循环类药物\nD.气管切开\nE.有条件在成功插管后纤支镜评估气道烧伤情况\n答案：A"},{"id":"zhinan-a1-039","subject":"院级指南","section":"院级指南","type":"a1","no":"39","stem":"颅脑创伤手术原则，错误的是：（  ）","options":[{"key":"A","text":"开放性颅脑损伤、颅骨凹陷性骨折引起急性脑受压或脑疝均需紧急手术"},{"key":"B","text":"颅脑创伤合并内脏出血、开放性骨折、休克应同时紧急处理"},{"key":"C","text":"手术治疗是整个救治工作的重要组成部分"},{"key":"D","text":"颅脑创伤合并其他脏器严重创伤时，原则上应优先处理危及生命的损伤，纠正和维持患者的基本呼吸、循环，才能为下一步救治赢得时间"},{"key":"E","text":"TCA复苏后GCS3分的年轻患者，应尽量避免急诊手术"}],"answer":["E"],"raw":"39、颅脑创伤手术原则，错误的是：（  ）\nA.开放性颅脑损伤、颅骨凹陷性骨折引起急性脑受压或脑疝均需紧急手术\nB.颅脑创伤合并内脏出血、开放性骨折、休克应同时紧急处理\nC.手术治疗是整个救治工作的重要组成部分\nD.颅脑创伤合并其他脏器严重创伤时，原则上应优先处理危及生命的损伤，纠正和维持患者的基本呼吸、循环，才能为下一步救治赢得时间\nE.TCA复苏后GCS3分的年轻患者，应尽量避免急诊手术\n答案：E"},{"id":"zhinan-a1-040","subject":"院级指南","section":"院级指南","type":"a1","no":"40","stem":"骨筋膜室综合征的早期表现，下列说法错误的是：（  ）","options":[{"key":"A","text":"局部持续性、进行性加剧的剧烈疼痛"},{"key":"B","text":"患处肿胀明显，皮肤张力增高，触之有紧绷感"},{"key":"C","text":"指（趾）呈屈曲状态，被动牵伸时剧烈疼痛"},{"key":"D","text":"指（趾）感觉异常，如麻木、针刺感"},{"key":"E","text":"早期即出现远端动脉搏动减弱或消失"}],"answer":["E"],"raw":"40、骨筋膜室综合征的早期表现，下列说法错误的是：（  ）\nA.局部持续性、进行性加剧的剧烈疼痛\nB.患处肿胀明显，皮肤张力增高，触之有紧绷感\nC.指（趾）呈屈曲状态，被动牵伸时剧烈疼痛\nD.指（趾）感觉异常，如麻木、针刺感\nE.早期即出现远端动脉搏动减弱或消失\n答案：E"},{"id":"zhinan-a1-041","subject":"院级指南","section":"院级指南","type":"a1","no":"41","stem":"泌尿系统创伤，哪项不需要急诊手术：（  ）","options":[{"key":"A","text":"肾破裂出血"},{"key":"B","text":"睾丸扭转"},{"key":"C","text":"尿道断裂"},{"key":"D","text":"膀胱穿孔（腹膜外型）"},{"key":"E","text":"阴茎骨折"}],"answer":["D"],"raw":"41、泌尿系统创伤，哪项不需要急诊手术：（  ）\nA.肾破裂出血\nB.睾丸扭转\nC.尿道断裂\nD.膀胱穿孔（腹膜外型）\nE.阴茎骨折\n答案：D"},{"id":"zhinan-a1-042","subject":"院级指南","section":"院级指南","type":"a1","no":"42","stem":"关于胸膜腔内进行性出血的描述，哪项是错误的：（  ）","options":[{"key":"A","text":"胸腔引流量：行胸腔引流时，如果引流出大量血液，且每小时大于200ml，持续5小时不见减少，可以诊断为进行性胸腔内出血"},{"key":"B","text":"血压：胸部损伤或者突发胸痛的患者，出现血压偏低的情况，经过及时补液，甚至输血，血压仍然不稳定或者持续性降低，需要高度怀疑进行性胸腔出血"},{"key":"C","text":"血红蛋白：胸部损伤，或者突发胸痛、胸闷后，连续进行多次血常规检查，提示血红蛋白持续性下降，也可以判断为进行性胸腔内出血"},{"key":"D","text":"胸腔穿刺：行胸腔穿刺检查时，抽出血性胸腔内液体，并且很快凝固，或与外周血相同，考虑进行性胸腔内出血"},{"key":"E","text":"影像检查：主要是动态检查胸部摄片，出现阴影局部增大的情况，需要考虑进行性胸腔内出血"}],"answer":["A"],"raw":"42、关于胸膜腔内进行性出血的描述，哪项是错误的：（  ）\nA.胸腔引流量：行胸腔引流时，如果引流出大量血液，且每小时大于200ml，持续5小时不见减少，可以诊断为进行性胸腔内出血\nB.血压：胸部损伤或者突发胸痛的患者，出现血压偏低的情况，经过及时补液，甚至输血，血压仍然不稳定或者持续性降低，需要高度怀疑进行性胸腔出血\nC.血红蛋白：胸部损伤，或者突发胸痛、胸闷后，连续进行多次血常规检查，提示血红蛋白持续性下降，也可以判断为进行性胸腔内出血\nD.胸腔穿刺：行胸腔穿刺检查时，抽出血性胸腔内液体，并且很快凝固，或与外周血相同，考虑进行性胸腔内出血\nE.影像检查：主要是动态检查胸部摄片，出现阴影局部增大的情况，需要考虑进行性胸腔内出血\n答案：A"},{"id":"zhinan-a1-043","subject":"院级指南","section":"院级指南","type":"a1","no":"43","stem":"致死性骨科创伤，常见原因不包括：（  ）","options":[{"key":"A","text":"交通事故"},{"key":"B","text":"故意伤害"},{"key":"C","text":"碰撞"},{"key":"D","text":"自杀"},{"key":"E","text":"高处坠落"}],"answer":["C"],"raw":"43、致死性骨科创伤，常见原因不包括：（  ）\nA.交通事故\nB.故意伤害\nC.碰撞\nD.自杀\nE.高处坠落\n答案：C"},{"id":"zhinan-x-001","subject":"院级指南","section":"院级指南","type":"x","no":"1","stem":"脑卒中潜在可干预危险因素有哪些？（  ）","options":[{"key":"A","text":"高血压、高血脂、高血糖"},{"key":"B","text":"社会压力、缺乏体育活动"},{"key":"C","text":"心脏疾病"},{"key":"D","text":"吸烟、饮酒"},{"key":"E","text":"高龄"},{"key":"F","text":"肥胖、不健康饮食"},{"key":"G","text":"家族遗传史"}],"answer":["A","B","C","D","F"],"raw":"1、脑卒中潜在可干预危险因素有哪些？（  ）\nA.高血压、高血脂、高血糖\nB.社会压力、缺乏体育活动\nC.心脏疾病\nD.吸烟、饮酒\nE.高龄\nF.肥胖、不健康饮食\nG.家族遗传史\n答案：ABCDF"},{"id":"zhinan-x-002","subject":"院级指南","section":"院级指南","type":"x","no":"2","stem":"以下哪些症状考虑脑卒中可能？（  ）","options":[{"key":"A","text":"一侧肢体无力或（伴面部）麻木"},{"key":"B","text":"双眼向一侧凝视"},{"key":"C","text":"言语不清或理解困难"},{"key":"D","text":"视力模糊或丧失"},{"key":"E","text":"既往少见的严重头痛、呕吐"},{"key":"F","text":"意识障碍或抽搐"},{"key":"G","text":"眩晕伴呕吐"}],"answer":["A","B","C","D","E","F","G"],"raw":"2、以下哪些症状考虑脑卒中可能？（  ）\nA.一侧肢体无力或（伴面部）麻木\nB.双眼向一侧凝视\nC.言语不清或理解困难\nD.视力模糊或丧失\nE.既往少见的严重头痛、呕吐\nF.意识障碍或抽搐\nG.眩晕伴呕吐\n答案：ABCDEFG"},{"id":"zhinan-x-003","subject":"院级指南","section":"院级指南","type":"x","no":"3","stem":"早期肌力下降可通过哪些试验进行判断？（  ）","options":[{"key":"A","text":"上肢平伸试验"},{"key":"B","text":"外旋征"},{"key":"C","text":"膝下垂试验"},{"key":"D","text":"下肢下落试验"},{"key":"E","text":"数指试验"},{"key":"F","text":"小指征"},{"key":"G","text":"分指试验"}],"answer":["A","B","C","D","E","F","G"],"raw":"3、早期肌力下降可通过哪些试验进行判断？（  ）\nA.上肢平伸试验\nB.外旋征\nC.膝下垂试验\nD.下肢下落试验\nE.数指试验\nF.小指征\nG.分指试验\n答案：ABCDEFG"},{"id":"zhinan-x-004","subject":"院级指南","section":"院级指南","type":"x","no":"4","stem":"高危胸痛症状包括哪些？（  ）","options":[{"key":"A","text":"剧烈、压榨样、撕裂样疼痛、向后背、腹部放射或转移"},{"key":"B","text":"大汗、晕厥或近似晕厥"},{"key":"C","text":"呼吸困难"},{"key":"D","text":"持续时间大于15分钟"},{"key":"E","text":"既往史有高血压病、糖尿病、冠心病支架术或搭桥术病史"}],"answer":["A","B","C","D","E"],"raw":"4、高危胸痛症状包括哪些？（  ）\nA.剧烈、压榨样、撕裂样疼痛、向后背、腹部放射或转移\nB.大汗、晕厥或近似晕厥\nC.呼吸困难\nD.持续时间大于15分钟\nE.既往史有高血压病、糖尿病、冠心病支架术或搭桥术病史\n答案：ABCDE"},{"id":"zhinan-x-005","subject":"院级指南","section":"院级指南","type":"x","no":"5","stem":"ACS常见的诱因有哪些？（  ）","options":[{"key":"A","text":"劳累"},{"key":"B","text":"运动"},{"key":"C","text":"饱餐"},{"key":"D","text":"寒冷"},{"key":"E","text":"情绪激动"}],"answer":["A","B","C","D","E"],"raw":"5、ACS常见的诱因有哪些？（  ）\nA.劳累\nB.运动\nC.饱餐\nD.寒冷\nE.情绪激动\n答案：ABCDE"},{"id":"zhinan-x-006","subject":"院级指南","section":"院级指南","type":"x","no":"6","stem":"过敏反应何种情况下，肾上腺素给药方式应采用肌内注射？（  ）","options":[{"key":"A","text":"Ⅰ级"},{"key":"B","text":"Ⅱ级"},{"key":"C","text":"Ⅲ级"},{"key":"D","text":"Ⅳ级"},{"key":"E","text":"对于胃肠系统症状难以缓解的Ⅰ级反应"}],"answer":["B","C","E"],"raw":"6、过敏反应何种情况下，肾上腺素给药方式应采用肌内注射？（  ）\nA.Ⅰ级\nB.Ⅱ级\nC.Ⅲ级\nD.Ⅳ级\nE.对于胃肠系统症状难以缓解的Ⅰ级反应\n答案：BCE"},{"id":"zhinan-x-007","subject":"院级指南","section":"院级指南","type":"x","no":"7","stem":"哪些药可作为救治严重过敏反应的二线药物？（  ）","options":[{"key":"A","text":"肾上腺素"},{"key":"B","text":"糖皮质激素"},{"key":"C","text":"H1受体拮抗剂"},{"key":"D","text":"短效β2受体激动剂"}],"answer":["B","C","D"],"raw":"7、哪些药可作为救治严重过敏反应的二线药物？（  ）\nA.肾上腺素\nB.糖皮质激素\nC.H1受体拮抗剂\nD.短效β2受体激动剂\n答案：BCD"},{"id":"zhinan-x-008","subject":"院级指南","section":"院级指南","type":"x","no":"8","stem":"脓毒性休克患者的液体复苏以下叙述正确的有哪些？（  ）","options":[{"key":"A","text":"应尽早开始液体复苏。"},{"key":"B","text":"对脓毒症所致的低灌注，推荐在拟诊为脓毒性休克起3h内输注至少30ml/kg的晶体溶液进行初始复苏。"},{"key":"C","text":"完成初始复苏后，评估血流动力学状态以指导下一步的液体使用。"},{"key":"D","text":"可早期应用胶体液复苏。"}],"answer":["A","B","C"],"raw":"8、脓毒性休克患者的液体复苏以下叙述正确的有哪些？（  ）\nA.应尽早开始液体复苏。\nB.对脓毒症所致的低灌注，推荐在拟诊为脓毒性休克起3h内输注至少30ml/kg的晶体溶液进行初始复苏。\nC.完成初始复苏后，评估血流动力学状态以指导下一步的液体使用。\nD.可早期应用胶体液复苏。\n答案：ABC"},{"id":"zhinan-x-009","subject":"院级指南","section":"院级指南","type":"x","no":"9","stem":"脓毒症诊断初步评估可使用快速序贯器官衰竭评分（qSOFA），标准中的至少2项且同时乳酸＞2mmol/l时，即可考虑脓毒症。以下哪三项是qSOFA的评估标准？（  ）","options":[{"key":"A","text":"呼吸频率≥22次／min"},{"key":"B","text":"意识改变"},{"key":"C","text":"收缩压≤100mmHg"},{"key":"D","text":"尿量＜500ml/d"}],"answer":["A","B","C"],"raw":"9、脓毒症诊断初步评估可使用快速序贯器官衰竭评分（qSOFA），标准中的至少2项且同时乳酸＞2mmol/l时，即可考虑脓毒症。以下哪三项是qSOFA的评估标准？（  ）\nA.呼吸频率≥22次／min\nB.意识改变\nC.收缩压≤100mmHg\nD.尿量＜500ml/d\n答案：ABC"},{"id":"zhinan-x-010","subject":"院级指南","section":"院级指南","type":"x","no":"10","stem":"脓毒症诊断标准同时满足以下哪2条？（  ）","options":[{"key":"A","text":"确诊感染或疑似感染；"},{"key":"B","text":"血乳酸浓度≥2mmol/L"},{"key":"C","text":"SOFA评分较基线增加2分。"},{"key":"D","text":"qSOFA≥2"}],"answer":["A","C"],"raw":"10、脓毒症诊断标准同时满足以下哪2条？（  ）\nA.确诊感染或疑似感染；\nB.血乳酸浓度≥2mmol/L\nC.SOFA评分较基线增加2分。\nD.qSOFA≥2\n答案：AC"},{"id":"zhinan-x-011","subject":"院级指南","section":"院级指南","type":"x","no":"11","stem":"脓毒性休克诊断标准应同时满足以下3条？（  ）","options":[{"key":"A","text":"收缩压≤90mmHg；"},{"key":"B","text":"脓毒症诊断成立；"},{"key":"C","text":"充分液体复苏后仍需使用血管活性药物以维持平均动脉压≥65mmHg；"},{"key":"D","text":"血乳酸浓度≥2mmol/L。"}],"answer":["B","C","D"],"raw":"11、脓毒性休克诊断标准应同时满足以下3条？（  ）\nA.收缩压≤90mmHg；\nB.脓毒症诊断成立；\nC.充分液体复苏后仍需使用血管活性药物以维持平均动脉压≥65mmHg；\nD.血乳酸浓度≥2mmol/L。\n答案：BCD"},{"id":"zhinan-x-012","subject":"院级指南","section":"院级指南","type":"x","no":"12","stem":"VTE预防疗程，以下哪些是正确的？（  ）","options":[{"key":"A","text":"非手术患者预防7-14天；"},{"key":"B","text":"手术患者预防至术后7-14天；"},{"key":"C","text":"肿瘤大手术预防至术后28天；"},{"key":"D","text":"骨科髋关节、膝关节置换疗程35天"}],"answer":["A","B","C"],"raw":"12、VTE预防疗程，以下哪些是正确的？（  ）\nA.非手术患者预防7-14天；\nB.手术患者预防至术后7-14天；\nC.肿瘤大手术预防至术后28天；\nD.骨科髋关节、膝关节置换疗程35天\n答案：ABC"},{"id":"zhinan-x-013","subject":"院级指南","section":"院级指南","type":"x","no":"13","stem":"基于VTE风险分级的不同，VTE预防以下哪些策略是正确的？（  ）","options":[{"key":"A","text":"中高危，有出血风险的情况：基本预防+物理预防（排除禁忌症）"},{"key":"B","text":"中危，无出血风险的情况：基本预防+物理或药物预防"},{"key":"C","text":"中危，无出血风险的情况：基本预防+药物预防"},{"key":"D","text":"高危，无出血风险的情况：药物预防或药物预防联合物理预防"}],"answer":["A","B","D"],"raw":"13、基于VTE风险分级的不同，VTE预防以下哪些策略是正确的？（  ）\nA.中高危，有出血风险的情况：基本预防+物理预防（排除禁忌症）\nB.中危，无出血风险的情况：基本预防+物理或药物预防\nC.中危，无出血风险的情况：基本预防+药物预防\nD.高危，无出血风险的情况：药物预防或药物预防联合物理预防\n答案：ABD"},{"id":"zhinan-x-014","subject":"院级指南","section":"院级指南","type":"x","no":"14","stem":"关于Caprini评估量表的解读，以下正确的有哪些？（  ）","options":[{"key":"A","text":"肠炎病史主要指溃疡性结肠炎、克罗恩病。"},{"key":"B","text":"充血性心力衰竭包含正在服用药物治疗的慢性心衰患者。"},{"key":"C","text":"VTE病史包括动脉血栓，也得3分。"},{"key":"D","text":"VTE病史包括DVT或PE的每一次发作都被作为单独的事件记录下来进行评分。浅静脉血栓形成也必须包括在内，并且也得3分。"}],"answer":["A","B","D"],"raw":"14、关于Caprini评估量表的解读，以下正确的有哪些？（  ）\nA.肠炎病史主要指溃疡性结肠炎、克罗恩病。\nB.充血性心力衰竭包含正在服用药物治疗的慢性心衰患者。\nC.VTE病史包括动脉血栓，也得3分。\nD.VTE病史包括DVT或PE的每一次发作都被作为单独的事件记录下来进行评分。浅静脉血栓形成也必须包括在内，并且也得3分。\n答案：ABD"},{"id":"zhinan-x-015","subject":"院级指南","section":"院级指南","type":"x","no":"15","stem":"心脏骤停时，患者可出现哪些表现？（  ）","options":[{"key":"A","text":"突然意识丧失，可伴抽搐"},{"key":"B","text":"呼吸断续，呈叹息样，随后停止"},{"key":"C","text":"昏迷，瞳孔散大"},{"key":"D","text":"心音消失，脉搏触不到，血压测不出"}],"answer":["A","B","C","D"],"raw":"15、心脏骤停时，患者可出现哪些表现？（  ）\nA.突然意识丧失，可伴抽搐\nB.呼吸断续，呈叹息样，随后停止\nC.昏迷，瞳孔散大\nD.心音消失，脉搏触不到，血压测不出\n答案：ABCD"},{"id":"zhinan-x-016","subject":"院级指南","section":"院级指南","type":"x","no":"16","stem":"高质量的心肺复苏包括哪些？（  ）","options":[{"key":"A","text":"用力按压，按压深度至少5cm，速率为100～120次／min，并确保胸廓完全回弹"},{"key":"B","text":"尽量减少胸外按压的中断"},{"key":"C","text":"避免过度通气"},{"key":"D","text":"每2分钟更换1次按压者，如感觉疲劳可提早更换"},{"key":"E","text":"如果未建立高级气道，按压通气比率为30:2"}],"answer":["A","B","C","D","E"],"raw":"16、高质量的心肺复苏包括哪些？（  ）\nA.用力按压，按压深度至少5cm，速率为100～120次／min，并确保胸廓完全回弹\nB.尽量减少胸外按压的中断\nC.避免过度通气\nD.每2分钟更换1次按压者，如感觉疲劳可提早更换\nE.如果未建立高级气道，按压通气比率为30:2\n答案：ABCDE"},{"id":"zhinan-x-017","subject":"院级指南","section":"院级指南","type":"x","no":"17","stem":"急性疼痛镇痛药物的联合治疗，以下哪些是正确的？（  ）","options":[{"key":"A","text":"阿片类药物或曲马多与对乙酰氨基酚联合。"},{"key":"B","text":"对乙酰氨基酚和NSAIDs联合。"},{"key":"C","text":"阿片类或曲马多与NSAIDs联合。"},{"key":"D","text":"阿片类药物与局麻药联合用于PCEA。"}],"answer":["A","B","C","D"],"raw":"17、急性疼痛镇痛药物的联合治疗，以下哪些是正确的？（  ）\nA.阿片类药物或曲马多与对乙酰氨基酚联合。\nB.对乙酰氨基酚和NSAIDs联合。\nC.阿片类或曲马多与NSAIDs联合。\nD.阿片类药物与局麻药联合用于PCEA。\n答案：ABCD"},{"id":"zhinan-x-018","subject":"院级指南","section":"院级指南","type":"x","no":"18","stem":"癌痛评估是合理、有效进行止痛治疗的前提，应当遵循哪些原则？（  ）","options":[{"key":"A","text":"常规"},{"key":"B","text":"量化"},{"key":"C","text":"全面"},{"key":"D","text":"动态"},{"key":"E","text":"个体"}],"answer":["A","B","C","D"],"raw":"18、癌痛评估是合理、有效进行止痛治疗的前提，应当遵循哪些原则？（  ）\nA.常规\nB.量化\nC.全面\nD.动态\nE.个体\n答案：ABCD"},{"id":"zhinan-x-019","subject":"院级指南","section":"院级指南","type":"x","no":"19","stem":"WHO癌痛基本镇痛给药原则是哪些？（  ）","options":[{"key":"A","text":"口服给药"},{"key":"B","text":"按时给药"},{"key":"C","text":"个体化治疗"},{"key":"D","text":"注意具体细节"},{"key":"E","text":"按阶梯给药"}],"answer":["A","B","C","D","E"],"raw":"19、WHO癌痛基本镇痛给药原则是哪些？（  ）\nA.口服给药\nB.按时给药\nC.个体化治疗\nD.注意具体细节\nE.按阶梯给药\n答案：ABCDE"},{"id":"zhinan-x-020","subject":"院级指南","section":"院级指南","type":"x","no":"20","stem":"重症患者镇痛治疗中，可能出现的并发症包括哪些？（  ）","options":[{"key":"A","text":"呼吸抑制"},{"key":"B","text":"血压下降"},{"key":"C","text":"心动过缓"},{"key":"D","text":"谵妄和认知障碍"}],"answer":["A","B","C","D"],"raw":"20、重症患者镇痛治疗中，可能出现的并发症包括哪些？（  ）\nA.呼吸抑制\nB.血压下降\nC.心动过缓\nD.谵妄和认知障碍\n答案：ABCD"},{"id":"zhinan-x-021","subject":"院级指南","section":"院级指南","type":"x","no":"21","stem":"重症患者镇痛治疗的原则包括哪些？（  ）","options":[{"key":"A","text":"个体化镇痛"},{"key":"B","text":"快速镇痛"},{"key":"C","text":"按时镇痛"},{"key":"D","text":"安全性原则"}],"answer":["A","C","D"],"raw":"21、重症患者镇痛治疗的原则包括哪些？（  ）\nA.个体化镇痛\nB.快速镇痛\nC.按时镇痛\nD.安全性原则\n答案：ACD"},{"id":"zhinan-x-022","subject":"院级指南","section":"院级指南","type":"x","no":"22","stem":"镇静、镇痛基本目的包括（  ）","options":[{"key":"A","text":"消除或减轻疼痛"},{"key":"B","text":"减轻自主神经功能紊乱"},{"key":"C","text":"消除心理应激反应"},{"key":"D","text":"保证和改善睡眠"},{"key":"E","text":"机械通气的顺利实施和撤离"}],"answer":["A","B","C","D","E"],"raw":"22、镇静、镇痛基本目的包括（  ）\nA.消除或减轻疼痛\nB.减轻自主神经功能紊乱\nC.消除心理应激反应\nD.保证和改善睡眠\nE.机械通气的顺利实施和撤离\n答案：ABCDE"},{"id":"zhinan-x-023","subject":"院级指南","section":"院级指南","type":"x","no":"23","stem":"哪些患者慎用或禁用吗啡？（  ）","options":[{"key":"A","text":"低血容量的患者"},{"key":"B","text":"颅内压增高者"},{"key":"C","text":"肾功能不全者"},{"key":"D","text":"吗啡成瘾者"}],"answer":["A","B","C","D"],"raw":"23、哪些患者慎用或禁用吗啡？（  ）\nA.低血容量的患者\nB.颅内压增高者\nC.肾功能不全者\nD.吗啡成瘾者\n答案：ABCD"},{"id":"yanke-a1-001","subject":"眼科","section":"眼科","type":"a1","no":"1","stem":"关于视神经胶质瘤，下列叙述不正确的是","options":[{"key":"A","text":"多见于儿童患者"},{"key":"B","text":"病程进展缓慢，常先视力下降后眼球突出"},{"key":"C","text":"严重影响视力的患者可有视乳头水肿、视神经萎缩以及视野改变"},{"key":"D","text":"CT检查可发现视神经呈梭形膨大"},{"key":"E","text":"所有病例一经诊断，都应立即行外侧壁开眶肿瘤切除术"}],"answer":["E"],"raw":"1、关于视神经胶质瘤，下列叙述不正确的是\nA.多见于儿童患者\nB.病程进展缓慢，常先视力下降后眼球突出\nC.严重影响视力的患者可有视乳头水肿、视神经萎缩以及视野改变\nD.CT检查可发现视神经呈梭形膨大\nE.所有病例一经诊断，都应立即行外侧壁开眶肿瘤切除术\n答案：E"},{"id":"yanke-a1-002","subject":"眼科","section":"眼科","type":"a1","no":"2","stem":"流行性角结膜炎的病原体是","options":[{"key":"A","text":"肠道病毒"},{"key":"B","text":"腺病毒"},{"key":"C","text":"流感嗜血杆菌"},{"key":"D","text":"白喉杆菌"}],"answer":["B"],"raw":"2、流行性角结膜炎的病原体是\nA.肠道病毒\nB.腺病毒\nC.流感嗜血杆菌\nD.白喉杆菌\n答案：B"},{"id":"yanke-a1-003","subject":"眼科","section":"眼科","type":"a1","no":"3","stem":"下列组织中，不属于葡萄膜的是","options":[{"key":"A","text":"虹膜"},{"key":"B","text":"睫状体"},{"key":"C","text":"视网膜"},{"key":"D","text":"脉络膜"}],"answer":["C"],"raw":"3、下列组织中，不属于葡萄膜的是\nA.虹膜\nB.睫状体\nC.视网膜\nD.脉络膜\n答案：C"},{"id":"yanke-a1-004","subject":"眼科","section":"眼科","type":"a1","no":"4","stem":"眶上裂综合征为下列哪项受累","options":[{"key":"A","text":"第Ⅲ对脑神经"},{"key":"B","text":"第Ⅳ对脑神经"},{"key":"C","text":"第Ⅵ对脑神经"},{"key":"D","text":"A+B+C"},{"key":"E","text":"以上均不对"}],"answer":["D"],"raw":"4、眶上裂综合征为下列哪项受累\nA.第Ⅲ对脑神经\nB.第Ⅳ对脑神经\nC.第Ⅵ对脑神经\nD.A+B+C\nE.以上均不对\n答案：D"},{"id":"yanke-a1-005","subject":"眼科","section":"眼科","type":"a1","no":"5","stem":"对放射治疗最敏感的眼睑恶性肿瘤是","options":[{"key":"A","text":"黄色瘤"},{"key":"B","text":"眼睑血管瘤"},{"key":"C","text":"基底细胞癌"},{"key":"D","text":"鳞状上皮细胞癌"},{"key":"E","text":"皮脂腺癌"}],"answer":["C"],"raw":"5、对放射治疗最敏感的眼睑恶性肿瘤是\nA.黄色瘤\nB.眼睑血管瘤\nC.基底细胞癌\nD.鳞状上皮细胞癌\nE.皮脂腺癌\n答案：C"},{"id":"yanke-a1-006","subject":"眼科","section":"眼科","type":"a1","no":"6","stem":"急性闭角型青光眼的瞳孔开大是由于高眼压使","options":[{"key":"A","text":"瞳孔括约肌麻痹"},{"key":"B","text":"瞳孔开大肌兴奋"},{"key":"C","text":"副交感神经抑制"},{"key":"D","text":"交感神经兴奋"},{"key":"E","text":"交感及副交感神经功能失调"}],"answer":["A"],"raw":"6、急性闭角型青光眼的瞳孔开大是由于高眼压使\nA.瞳孔括约肌麻痹\nB.瞳孔开大肌兴奋\nC.副交感神经抑制\nD.交感神经兴奋\nE.交感及副交感神经功能失调\n答案：A"},{"id":"yanke-a1-007","subject":"眼科","section":"眼科","type":"a1","no":"7","stem":"连续环形撕囊时，撕囊直径最好为","options":[{"key":"A","text":"5 mm"},{"key":"B","text":"5、5 mm"},{"key":"C","text":"6 mm"},{"key":"D","text":"6、5 mm"}],"answer":["C"],"raw":"7、连续环形撕囊时，撕囊直径最好为\nA.5 mm\nB.5、5 mm\nC.6 mm\nD.6、5 mm\n答案：C"},{"id":"yanke-a1-008","subject":"眼科","section":"眼科","type":"a1","no":"8","stem":"视网膜中央静脉阻塞较常发生的并发症不包括","options":[{"key":"A","text":"黄斑囊样水肿"},{"key":"B","text":"玻璃体积血"},{"key":"C","text":"牵引性视网膜脱离"},{"key":"D","text":"新生血管性青光眼"},{"key":"E","text":"视网膜坏死"}],"answer":["E"],"raw":"8、视网膜中央静脉阻塞较常发生的并发症不包括\nA.黄斑囊样水肿\nB.玻璃体积血\nC.牵引性视网膜脱离\nD.新生血管性青光眼\nE.视网膜坏死\n答案：E"},{"id":"yanke-a1-009","subject":"眼科","section":"眼科","type":"a1","no":"9","stem":"前部缺血性视神经病变以下哪项描述是正确的","options":[{"key":"A","text":"炎症所致血管狭窄或阻塞是常见的原因"},{"key":"B","text":"多为老年人"},{"key":"C","text":"VEP改变最有特征性"},{"key":"D","text":"荧光眼底血管造影早期可见荧光渗漏"},{"key":"E","text":"早期视盘正常"}],"answer":["B"],"raw":"9、前部缺血性视神经病变以下哪项描述是正确的\nA. "},{"key":"C","text":"角膜上皮细胞"},{"key":"D","text":"结膜细胞"}],"answer":["A","C","D"],"raw":"108、眼表面包括\nA.泪膜\nB.角膜干细胞\nC.角膜上皮细胞\nD.结膜细胞\n答案：ACD"},{"id":"yanke-x-009","subject":"眼科","section":"眼科","type":"x","no":"109","stem":"屈光介质包括","options":[{"key":"A","text":"角膜"},{"key":"B","text":"视网膜"},{"key":"C","text":"房水"},{"key":"D","text":"玻璃体"}],"answer":["A","C","D"],"raw":"109、屈光介质包括\nA.角膜\nB.视网膜\nC.房水\nD.玻璃体\n答案：ACD"},{"id":"yanke-x-010","subject":"眼科","section":"眼科","type":"x","no":"110","stem":"房水排出的通道有","options":[{"key":"A","text":"前房角"},{"key":"B","text":"虹膜表面吸收"},{"key":"C","text":"葡萄膜巩膜途径"},{"key":"D","text":"晶状体"}],"answer":["A","B","C"],"raw":"110、房水排出的通道有\nA.前房角\nB.虹膜表面吸收\nC.葡萄膜巩膜途径\nD.晶状体\n答案：ABC"},{"id":"yanke-x-011","subject":"眼科","section":"眼科","type":"x","no":"111","stem":"免疫性结膜炎临床常见的有","options":[{"key":"A","text":"Stevens-Johnson综合征"},{"key":"B","text":"过敏性结膜炎"},{"key":"C","text":"泡性结膜炎"},{"key":"D","text":"春季角结膜炎"}],"answer":["A","B","C","D"],"raw":"111、免疫性结膜炎临床常见的有\nA.Stevens-Johnson综合征\nB.过敏性结膜炎\nC.泡性结膜炎\nD.春季角结膜炎\n答案：ABCD"},{"id":"yanke-x-012","subject":"眼科","section":"眼科","type":"x","no":"112","stem":"术前眼周围病灶的检查包括","options":[{"key":"A","text":"慢性泪囊炎"},{"key":"B","text":"面部疖肿"},{"key":"C","text":"副鼻窦炎"},{"key":"D","text":"化脓性中耳炎"}],"answer":["A","B","C","D"],"raw":"112、术前眼周围病灶的检查包括\nA.慢性泪囊炎\nB.面部疖肿\nC.副鼻窦炎\nD.化脓性中耳炎\n答案：ABCD"},{"id":"yanke-x-013","subject":"眼科","section":"眼科","type":"x","no":"113","stem":"虹膜挫伤易导致","options":[{"key":"A","text":"瞳孔散大"},{"key":"B","text":"光反射消失或迟钝"},{"key":"C","text":"调节麻痹近视力障碍"},{"key":"D","text":"瞳孔缩小"}],"answer":["A","B","C"],"raw":"113、虹膜挫伤易导致\nA.瞳孔散大\nB.光反射消失或迟钝\nC.调节麻痹近视力障碍\nD.瞳孔缩小\n答案：ABC"},{"id":"yanke-x-014","subject":"眼科","section":"眼科","type":"x","no":"114","stem":"假膜见于","options":[{"key":"A","text":"β-溶血性链球菌性结膜炎"},{"key":"B","text":"Koch-Weeks杆菌性结膜炎"},{"key":"C","text":"腺病毒引起的流行性角结膜炎"},{"key":"D","text":"白喉杆菌性结膜炎"}],"answer":["A","C"],"raw":"114、假膜见于\nA.β-溶血性链球菌性结膜炎\nB.Koch-Weeks杆菌性结膜炎\nC.腺病毒引起的流行性角结膜炎\nD.白喉 n答案：AC"}]}</script>
<script>
(function () {
  "use strict";

  /* ========== 数据 ========== */
  var BANK = JSON.parse(document.getElementById("bank").textContent);
  var ALL = BANK.questions;
  var TOTAL = ALL.length;
  var BY_ID = {};
  var SUBJECTS = [];
  var SUBJ = {};
  var SLUG2NAME = {};
  var POOL = {};
  var TYPE_LABEL = { a1: "单选题", x: "多选题", tf: "判断题" };

  ALL.forEach(function (q) {
    BY_ID[q.id] = q;
    var m = SUBJ[q.subject];
    if (!m) {
      var slug = q.id.split("-")[0];
      m = SUBJ[q.subject] = { name: q.subject, slug: slug, total: 0, a1: 0, x: 0, tf: 0 };
      SLUG2NAME[slug] = q.subject;
      SUBJECTS.push(m);
      POOL[q.subject] = [];
    }
    m.total++;
    m[q.type]++;
    POOL[q.subject].push(q);
  });

  /* ========== 状态 ========== */
  var KEY = "sjt2026.v1";
  var DEF = function () {
    return { v: 1, font: 1, seen: {}, stats: {}, wrong: {}, sess: {}, last: null };
  };
  var S = (function () {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (!s || s.v !== 1) return DEF();
      var d = DEF();
      for (var k in d) if (!(k in s)) s[k] = d[k];
      return s;
    } catch (e) { return DEF(); }
  })();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }
  function seenMap(sub) { return S.seen[sub] || (S.seen[sub] = {}); }
  function stat(sub) { return S.stats[sub] || (S.stats[sub] = { a: 0, c: 0 }); }
  function wrongList(sub) { return S.wrong[sub] || (S.wrong[sub] = []); }
  function seenCount(sub) { return Object.keys(S.seen[sub] || {}).length; }
  function totalSeen() {
    var n = 0;
    for (var k in S.seen) n += Object.keys(S.seen[k]).length;
    return n;
  }
  function totalRate() {
    var a = 0, c = 0;
    for (var k in S.stats) { a += S.stats[k].a; c += S.stats[k].c; }
    return a ? Math.round((c / a) * 100) : null;
  }
  function rateOf(sub) {
    var s = S.stats[sub];
    return s && s.a ? Math.round((s.c / s.a) * 100) : null;
  }
  function addWrong(sub, id) { var L = wrongList(sub); if (L.indexOf(id) < 0) L.push(id); }
  function delWrong(sub, id) { var L = wrongList(sub); var i = L.indexOf(id); if (i >= 0) L.splice(i, 1); }

  /* ========== 工具 ========== */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pct(n) { return n == null ? "—" : n + "%"; }
  function cut(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function sameSet(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    var x = a.slice().sort().join(""), y = b.slice().sort().join("");
    return x === y;
  }
  function letterList(keys) {
    return keys.map(function (k) { return k === "T" ? "正确" : k === "F" ? "错误" : k; }).join("、");
  }
  function go(hash) {
    if (location.hash === hash) route(); else location.hash = hash;
  }
  function qs(sel, root) { return (root || document).querySelector(sel); }

  /* ========== 会话 ========== */
  var UI = { sel: [], sheet: false, w: false, sub: null };
  function sessKey(sub, w) { return sub + (w ? "|w" : ""); }

  function startSess(sub, w) {
    var ids = w ? wrongList(sub).filter(function (id) { return BY_ID[id]; }) : POOL[sub].map(function (q) { return q.id; });
    if (!ids.length) return null;
    var order = ids.slice();
    var mode = w ? "rand" : "seq";
    if (mode === "rand") shuffle(order);
    var s = { order: order, idx: 0, mode: mode, w: !!w, ans: {} };
    S.sess[sessKey(sub, w)] = s;
    S.last = { sub: sub, w: !!w };
    save();
    return s;
  }
  function getSess(sub, w) {
    var s = S.sess[sessKey(sub, w)];
    if (s && s.order && s.order.length) return s;
    return null;
  }

  /* ========== 渲染入口 ========== */
  var app = document.getElementById("app");
  var bottom = document.getElementById("bottom");
  var bwrap = document.getElementById("bwrap");

  function render() {
    var h = location.hash.replace(/^#/, "") || "/";
    var p = h.split("/").filter(Boolean);
    document.documentElement.setAttribute("data-fs", S.font);
    window.scrollTo(0, 0);
    if (p[0] === "s") return viewSubject(decodeURIComponent(p[1] || ""));
    if (p[0] === "p") return viewPractice(decodeURIComponent(p[1] || ""), p[2] === "wrong");
    if (p[0] === "wrong") return viewWrong();
    if (p[0] === "settings") return viewSettings();
    return viewHome();
  }

  function setBottom(html) {
    if (!html) { bottom.hidden = true; bwrap.innerHTML = ""; return; }
    bottom.hidden = false;
    bwrap.innerHTML = html;
  }

  /* ========== 首页 ========== */
  function viewHome() {
    var seen = totalSeen();
    var last = S.last && S.last.sub && getSess(S.last.sub, S.last.w);
    var lastHtml = "";
    if (last) {
      var lq = last.order[last.idx] ? BY_ID[last.order[last.idx]] : null;
      var lname = S.last.sub + (S.last.w ? " · 错题重练" : "");
      lastHtml =
        '<button class="card pad" data-act="resume" style="width:100%;text-align:left;margin-bottom:14px">' +
          '<div class="between"><div class="grow">' +
            '<div class="tiny">继续上次</div>' +
            '<div style="font-weight:600;margin-top:2px">' + esc(lname) + '</div>' +
            '<div class="tiny" style="margin-top:2px">' + (lq ? "第 " + (last.idx + 1) + " / " + last.order.length + " 题" : "已完成") + '</div>' +
          '</div><div style="color:var(--brand);font-size:.9em;font-weight:600">继续 ›</div></div>' +
        '</button>';
    }

    var cards = SUBJECTS.map(function (m) {
      var sc = seenCount(m.name), rt = rateOf(m.name), wn = (S.wrong[m.name] || []).length;
      var done = m.total ? Math.round((sc / m.total) * 100) : 0;
      return '<button class="card scard" data-act="subject" data-val="' + esc(m.slug) + '">' +
        '<div class="between"><div class="nm">' + esc(m.name) + '</div>' +
        (wn ? '<div class="tiny"><span class="dot"></span>' + wn + '</div>' : "") +
        '</div>' +
        '<div class="n">共 ' + m.total + ' 题</div>' +
        '<div class="bar" style="margin-top:9px;height:5px"><i style="width:' + done + '%"></i></div>' +
        '<div class="st"><span>已做 ' + sc + '/' + m.total + '</span><span style="flex:1"></span><span>正确率 ' + pct(rt) + '</span></div>' +
        '</button>';
    }).join("");

    app.innerHTML =
      '<div class="wrap">' +
        '<header class="top">' +
          '<h1>2026三基题库</h1>' +
          '<div class="sub">共 ' + TOTAL + ' 题 · 已做 ' + seen + ' 题 · 总正确率 ' + pct(totalRate()) + '</div>' +
        '</header>' +
        '<div class="card pad" style="margin-bottom:14px">' +
          '<div class="between" style="margin-bottom:8px"><span class="tiny">总进度</span>' +
          '<span class="tiny">' + seen + ' / ' + TOTAL + '</span></div>' +
          '<div class="bar"><i style="width:' + (TOTAL ? (seen / TOTAL) * 100 : 0) + '%"></i></div>' +
        '</div>' +
        lastHtml +
        '<div class="grid">' + cards + '</div>' +
        '<div class="note" style="margin:18px 2px 6px">点科目开始练习；答错的题会自动进错题本。</div>' +
      '</div>';

    setBottom(
      '<button class="btn" data-act="nav" data-val="#/wrong">错题本' +
        (totalWrong() ? ' · ' + totalWrong() : "") + '</button>' +
      '<button class="btn" data-act="nav" data-val="#/settings">设置</button>'
    );
  }
  function totalWrong() {
    var n = 0;
    for (var k in S.wrong) n += S.wrong[k].length;
    return n;
  }

  /* ========== 科目页 ========== */
  function viewSubject(slug) {
    var sub = SLUG2NAME[slug];
    if (!sub) return go("#/");
    var m = SUBJ[sub];
    var sc = seenCount(sub), rt = rateOf(sub), wn = (S.wrong[sub] || []).length;
    var sess = getSess(sub, false);
    var lastQ = sess && sess.order[sess.idx] ? BY_ID[sess.order[sess.idx]] : null;

    app.innerHTML =
      '<div class="wrap">' +
        '<div class="qhead"><button class="back" data-act="nav" data-val="#/">‹ 返回</button>' +
          '<span class="pos">' + m.total + ' 题</span></div>' +
        '<h1 style="font-size:1.4em;font-weight:650">' + esc(sub) + '</h1>' +
        '<div class="tiny" style="margin-top:4px">单选 ' + m.a1 + ' · 多选 ' + m.x + ' · 判断 ' + m.tf + '</div>' +
        '<div class="card pad" style="margin:16px 0">' +
          '<div class="between"><span class="tiny">已做</span><span class="tiny">' + sc + ' / ' + m.total + '</span></div>' +
          '<div class="bar" style="margin:8px 0 12px"><i style="width:' + (m.total ? (sc / m.total) * 100 : 0) + '%"></i></div>' +
          '<div class="between"><span class="tiny">正确率</span><span class="tiny">' + pct(rt) + '</span></div>' +
          '<div class="between" style="margin-top:10px"><span class="tiny">错题本</span><span class="tiny">' + wn + ' 题</span></div>' +
        '</div>' +
        '<div class="card list">' +
          '<button class="item" data-act="start" data-val="' + esc(slug) + '" style="width:100%;text-align:left">' +
            '<div class="grow"><div class="ttl">' + (lastQ ? "继续练习" : "开始练习") + '</div>' +
            '<div class="desc">' + (lastQ ? "上次做到第 " + (sess.idx + 1) + " / " + sess.order.length + " 题" : "按题号顺序，答错自动进错题本") + '</div></div>' +
            '<div style="color:var(--ink-3)">›</div>' +
          '</button>' +
          '<button class="item" data-act="startWrong" data-val="' + esc(slug) + '" style="width:100%;text-align:left"' + (wn ? "" : " disabled") + '>' +
            '<div class="grow"><div class="ttl">错题重练</div>' +
            '<div class="desc">' + (wn ? "本科 " + wn + " 道错题，随机顺序，答对即移出" : "暂无错题") + '</div></div>' +
            '<div style="color:var(--ink-3)">' + (wn ? "›" : "") + '</div>' +
          '</button>' +
        '</div>' +
        '<div class="note" style="margin:14px 2px">' + esc(sub) + ' 的进度只存在这台设备上。</div>' +
      '</div>';
    setBottom("");
  }

  /* ========== 答题 ========== */
  function viewPractice(slug, w) {
    var sub = SLUG2NAME[slug];
    if (!sub) return go("#/");
    var key = sessKey(sub, w);
    var sess = (w ? getSess(sub, true) : getSess(sub, false));

    if (!sess) {
      if (w) {
        app.innerHTML = '<div class="wrap"><div class="qhead"><button class="back" data-act="nav" data-val="#/s/' + esc(slug) + '">‹ 返回</button></div>' +
          '<div class="empty"><div class="big">🗂</div><div>' + esc(sub) + ' 暂无错题</div>' +
          '<div class="note" style="margin-top:10px">答错的题会自动收集到这里</div></div></div>';
        setBottom('<button class="btn" data-act="nav" data-val="#/s/' + esc(slug) + '">返回</button>');
        return;
      }
      sess = startSess(sub, false);
      if (!sess) return go("#/s/" + slug);
    }

    UI.w = w; UI.sub = sub;

    // 完成
    if (sess.idx >= sess.order.length) {
      var okN = 0, totalN = 0;
      sess.order.forEach(function (id) {
        var a = sess.ans[id];
        if (a) { totalN++; if (a.ok) okN++; }
      });
      var r = totalN ? Math.round((okN / totalN) * 100) : 0;
      app.innerHTML =
        '<div class="wrap">' +
          '<div class="qhead"><button class="back" data-act="back">‹ 返回</button></div>' +
          '<div class="card pad" style="text-align:center;padding:34px 20px;margin-top:16px">' +
            '<div style="font-size:2em">' + (r >= 80 ? "🎯" : "📘") + '</div>' +
            '<h2 style="margin:10px 0 4px;font-size:1.25em">本组已做完</h2>' +
            '<div class="muted" style="font-size:.9em">共 ' + sess.order.length + ' 题 · 答对 ' + okN + ' 题 · 正确率 ' + r + '%</div>' +
          '</div>' +
          '<div class="note" style="margin:16px 2px;text-align:center">' + (w ? "答对的题已从错题本移出" : "错题已收进错题本") + '</div>' +
        '</div>';
      setBottom(
        '<button class="btn" data-act="restart">再练一遍</button>' +
        '<button class="btn primary" data-act="nav" data-val="#/s/' + esc(slug) + '">返回科目</button>'
      );
      return;
    }

    var q = BY_ID[sess.order[sess.idx]];
    if (!q) { sess.idx = 0; save(); return render(); }
    var a = sess.ans[q.id];
    var answered = !!a;
    if (!answered) {
      if (!UI.sel.length || UI.qid !== q.id) { UI.sel = []; }
      UI.qid = q.id;
    }

    var answeredN = sess.order.filter(function (id) { return sess.ans[id]; }).length;
    var progress = Math.round((answeredN / sess.order.length) * 100);

    var optsHtml;
    if (q.type === "tf") {
      optsHtml = '<div class="opts">' + [
        { k: "T", t: "正确" }, { k: "F", t: "错误" }
      ].map(function (o) {
        var cls = "opt big";
        if (answered) {
          cls += " lock";
          if (q.answer.indexOf(o.k) >= 0) cls += " ok";
          else if (a.sel.indexOf(o.k) >= 0) cls += " bad";
        } else if (UI.sel.indexOf(o.k) >= 0) cls += " sel";
        return '<button class="' + cls + '" data-act="pick" data-val="' + o.k + '">' + o.t + '</button>';
      }).join("") + '</div>';
    } else {
      optsHtml = '<div class="opts">' + q.options.map(function (o) {
        var cls = "opt";
        if (answered) {
          cls += " lock";
          if (q.answer.indexOf(o.key) >= 0) cls += " ok";
          else if (a.sel.indexOf(o.key) >= 0) cls += " bad";
        } else if (UI.sel.indexOf(o.key) >= 0) cls += " sel";
        return '<button class="' + cls + '" data-act="pick" data-val="' + esc(o.key) + '">' +
          '<span class="k">' + esc(o.key) + '</span><span class="t">' + esc(o.text) + '</span></button>';
      }).join("") + '</div>';
    }

    var fb = "";
    if (answered) {
      fb = '<div class="fb ' + (a.ok ? "ok" : "bad") + '">' +
        '<div class="hd">' + (a.ok ? "✓ 回答正确" : "✗ 回答错误") + '</div>' +
        '<div class="bd">' + (a.ok ? "" : "你选了 <b>" + esc(letterList(a.sel)) + "</b>　→　") +
        '正确答案 <b>' + esc(letterList(q.answer)) + '</b></div>' +
        '</div>';
    }

    app.innerHTML =
      '<div class="wrap">' +
        '<div class="qhead">' +
          '<button class="back" data-act="back">‹ 返回</button>' +
          '<span class="pos">第 ' + (sess.idx + 1) + ' / ' + sess.order.length + ' 题' +
            ' · 原题号 ' + esc(q.no) + '</span>' +
          '<button class="back" data-act="sheet">题号</button>' +
        '</div>' +
        '<div class="bar" style="margin-bottom:14px;height:5px"><i style="width:' + progress + '%"></i></div>' +
        '<div class="card qcard">' +
          '<div class="tiny" style="margin-bottom:8px"><span class="tag">' + (TYPE_LABEL[q.type] || "") + '</span>' +
            ' <span style="color:var(--ink-3)">' + esc(q.section) + '</span></div>' +
          '<div class="stem">' + esc(q.stem) + '</div>' +
          optsHtml + fb +
        '</div>' +
        '<div class="note" style="margin:12px 2px 0;text-align:center">' +
          (answered
            ? "已作答 · 点下方「" + (sess.idx + 1 >= sess.order.length ? "完成" : "下一题") + "」继续"
            : (q.type === "x" ? "多选题：选好后点「确认答案」" : q.type === "tf" ? "判断题：点选项即判定" : "单选题：点选项即判定")) +
        '</div>' +
      '</div>';

    // 底部按钮
    var canConfirm = !answered && q.type === "x" && UI.sel.length > 0;
    var mainBtn = answered
      ? '<button class="btn primary" data-act="next">' + (sess.idx + 1 >= sess.order.length ? "完成" : "下一题") + '</button>'
      : (q.type === "x"
        ? '<button class="btn primary" data-act="confirm"' + (canConfirm ? "" : " disabled") + '>确认答案</button>'
        : '<button class="btn primary" data-act="next">跳过</button>');
    setBottom(
      '<button class="btn ghost" data-act="prev"' + (sess.idx === 0 ? " disabled" : "") + '>上一题</button>' +
      mainBtn
    );

    // 题号面板
    if (UI.sheet) {
      var nums = sess.order.map(function (id, i) {
        var aa = sess.ans[id];
        var c = "num" + (i === sess.idx ? " cur" : "") + (aa ? (aa.ok ? " ok" : " bad") : "");
        return '<button class="' + c + '" data-act="jump" data-val="' + i + '">' + (i + 1) + '</button>';
      }).join("");
      var d = document.createElement("div");
      d.className = "sheet";
      d.innerHTML = '<div class="panel"><div class="between" style="margin-bottom:12px">' +
        '<h3>题号 · 已答 ' + answeredN + ' / ' + sess.order.length + '</h3>' +
        '<button class="btn sm ghost" data-act="sheet">关闭</button></div>' +
        '<div class="nums">' + nums + '</div></div>';
      document.body.appendChild(d);
      UI.sheet = false;
    }
  }

  function judge(q, sel) {
    var ok = sameSet(sel, q.answer);
    var st = stat(q.subject);
    st.a++;
    if (ok) st.c++;
    seenMap(q.subject)[q.id] = 1;
    if (ok) delWrong(q.subject, q.id); else addWrong(q.subject, q.id);
    var key = sessKey(q.subject, UI.w);
    if (!S.sess[key]) S.sess[key] = { order: [], idx: 0, mode: "seq", w: UI.w, ans: {} };
    S.sess[key].ans[q.id] = { sel: sel.slice(), ok: ok };
    S.last = { sub: q.subject, w: UI.w };
    save();
    render();
  }

  /* ========== 错题本 ========== */
  function viewWrong() {
    var groups = SUBJECTS.filter(function (m) { return (S.wrong[m.name] || []).length; });
    var body;
    if (!groups.length) {
      body = '<div class="empty"><div class="big">🗂</div><div>错题本是空的</div>' +
        '<div class="note" style="margin-top:10px">练习中答错的题会自动收进来</div></div>';
    } else {
      body = groups.map(function (m) {
        var n = S.wrong[m.name].length;
        var rows = S.wrong[m.name].map(function (id) {
          var q = BY_ID[id];
          if (!q) return "";
          return '<div class="item wq">' +
            '<div class="grow"><div class="ttl q" style="font-weight:500;font-size:.9em">' +
              (TYPE_LABEL[q.type] || "") + ' · 原题号 ' + esc(q.no) + '</div>' +
              '<div class="desc" style="line-height:1.55">' + esc(cut(q.stem, 48)) + '</div></div>' +
            '<button class="btn sm ghost rw" data-act="removeWrong" data-val="' + esc(m.slug + "|" + id) + '">移出</button>' +
          '</div>';
        }).join("");
        return '<div class="card list" style="margin-bottom:12px">' +
          '<div class="item"><div class="grow"><div class="ttl">' + esc(m.name) + '</div>' +
          '<div class="desc">' + n + ' 题待巩固</div></div>' +
          '<button class="btn sm" data-act="startWrong" data-val="' + esc(m.slug) + '">重练</button>' +
          '<button class="btn sm ghost" data-act="clearWrong" data-val="' + esc(m.slug) + '">清空</button></div>' +
          rows +
          '</div>';
      }).join("");
    }
    app.innerHTML =
      '<div class="wrap">' +
        '<div class="qhead"><button class="back" data-act="nav" data-val="#/">‹ 返回</button></div>' +
        '<h1 style="font-size:1.4em;font-weight:650">错题本</h1>' +
        '<div class="tiny" style="margin-top:4px">答对一次自动移出 · 共 ' + totalWrong() + ' 题</div>' +
        '<div style="height:14px"></div>' + body +
      '</div>';
    setBottom("");
  }

  /* ========== 设置 ========== */
  function viewSettings() {
    var fonts = [["小", 0], ["中", 1], ["大", 2]];
    var seg = '<div class="seg">' + fonts.map(function (f) {
      return '<button class="' + (S.font === f[1] ? "on" : "") + '" data-act="font" data-val="' + f[1] + '">' + f[0] + '</button>';
    }).join("") + '</div>';

    var subRows = SUBJECTS.map(function (m) {
      var sc = seenCount(m.name);
      return '<div class="item"><div class="grow"><div class="ttl">' + esc(m.name) + '</div>' +
        '<div class="desc">已做 ' + sc + '/' + m.total + ' · 错题 ' + (S.wrong[m.name] || []).length + '</div></div>' +
        '<button class="btn sm danger" data-act="resetOne" data-val="' + esc(m.slug) + '">重置</button></div>';
    }).join("");

    app.innerHTML =
      '<div class="wrap">' +
        '<div class="qhead"><button class="back" data-act="nav" data-val="#/">‹ 返回</button></div>' +
        '<h1 style="font-size:1.4em;font-weight:650">设置</h1>' +
        '<div class="spacer"></div>' +
        '<div class="card pad"><div class="ttl" style="font-weight:600;margin-bottom:10px">字号</div>' + seg + '</div>' +
        '<div class="spacer"></div>' +
        '<div class="card"><div class="item"><div class="grow"><div class="ttl">全部重置</div>' +
          '<div class="desc">清空所有进度、错题本与统计</div></div>' +
          '<button class="btn sm danger" data-act="resetAll">重置</button></div></div>' +
        '<div class="note" style="margin:18px 2px 6px">单科重置</div>' +
        '<div class="card">' + subRows + '</div>' +
        '<div class="note" style="margin:20px 2px 0;text-align:center">' +
          '题库 ' + TOTAL + ' 题 · 数据生成于 ' + esc((BANK.meta && BANK.meta.generatedAt) || "") +
          '<br>进度仅保存在本机浏览器，换设备不会同步' +
        '</div>' +
      '</div>';
    setBottom("");
  }

  /* ========== 事件 ========== */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) {
      if (e.target.classList && e.target.classList.contains("sheet")) { UI.sheet = false; render(); }
      return;
    }
    var act = el.getAttribute("data-act");
    var val = el.getAttribute("data-val");

    if (act === "nav") { go(val); return; }
    if (act === "subject") { go("#/s/" + val); return; }
    if (act === "resume") {
      if (!S.last) return;
      go("#/p/" + SUBJ[S.last.sub].slug + (S.last.w ? "/wrong" : ""));
      return;
    }
    if (act === "start") {
      var sub = SLUG2NAME[val];
      if (!getSess(sub, false)) startSess(sub, false);
      go("#/p/" + val);
      return;
    }
    if (act === "startWrong") {
      var s2 = SLUG2NAME[val];
      if (!(S.wrong[s2] || []).length) return;
      startSess(s2, true);
      go("#/p/" + val + "/wrong");
      return;
    }
    if (act === "pick") {
      var slug = location.hash.split("/")[2].split("?")[0];
      var sub2 = SLUG2NAME[decodeURIComponent(slug)];
      var sess = getSess(sub2, UI.w);
      var q = sess && BY_ID[sess.order[sess.idx]];
      if (!q || sess.ans[q.id]) return;
      if (q.type === "x") {
        var i = UI.sel.indexOf(val);
        if (i >= 0) UI.sel.splice(i, 1); else UI.sel.push(val);
        render();
        return;
      }
      judge(q, [val]);
      return;
    }
    if (act === "confirm") {
      var sub3 = UI.sub;
      var sess3 = getSess(sub3, UI.w);
      var q3 = sess3 && BY_ID[sess3.order[sess3.idx]];
      if (q3) judge(q3, UI.sel.slice());
      return;
    }
    if (act === "next" || act === "prev") {
      var sub4 = UI.sub, sess4 = getSess(sub4, UI.w);
      if (!sess4) return;
      UI.sel = [];
      if (act === "next") sess4.idx = Math.min(sess4.idx + 1, sess4.order.length);
      else sess4.idx = Math.max(sess4.idx - 1, 0);
      save();
      render();
      return;
    }
    if (act === "jump") {
      var sess5 = getSess(UI.sub, UI.w);
      if (sess5) { sess5.idx = parseInt(val, 10) || 0; UI.sel = []; save(); render(); }
      return;
    }
    if (act === "sheet") { UI.sheet = !UI.sheet; render(); return; }
    if (act === "back") { history.back(); return; }
    if (act === "restart") {
      var sub6 = UI.sub;
      startSess(sub6, UI.w);
      UI.sel = [];
      render();
      return;
    }
    if (act === "removeWrong") {
      var parts = (val || "").split("|");
      var subR = SLUG2NAME[parts[0]], idR = parts.slice(1).join("|");
      if (!subR || !idR) return;
      if (el.dataset.armed === "1") {
        delWrong(subR, idR);
        delete S.sess[sessKey(subR, true)];
        save(); render();
        return;
      }
      el.dataset.armed = "1";
      el.textContent = "确认移出";
      el.classList.add("danger");
      setTimeout(function () {
        if (el.isConnected) { el.dataset.armed = ""; el.textContent = "移出"; el.classList.remove("danger"); }
      }, 4000);
      return;
    }
    if (act === "clearWrong") {
      var sub7 = SLUG2NAME[val];
      if (confirm("清空「" + sub7 + "」的全部错题？此操作不可撤销。")) {
        S.wrong[sub7] = [];
        delete S.sess[sessKey(sub7, true)];
        save(); render();
      }
      return;
    }
    if (act === "font") { S.font = parseInt(val, 10) || 0; save(); render(); return; }
    if (act === "resetOne") {
      var sub8 = SLUG2NAME[val];
      if (confirm("重置「" + sub8 + "」的练习进度、统计和错题？此操作不可撤销。")) {
        delete S.seen[sub8]; delete S.stats[sub8]; S.wrong[sub8] = [];
        delete S.sess[sub8]; delete S.sess[sessKey(sub8, true)];
        if (S.last && S.last.sub === sub8) S.last = null;
        save(); render();
      }
      return;
    }
    if (act === "resetAll") {
      if (confirm("重置全部：清空所有科目的进度、统计和错题本。此操作不可撤销。")) {
        var font = S.font;
        S = DEF(); S.font = font;
        save(); go("#/"); render();
      }
      return;
    }
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
